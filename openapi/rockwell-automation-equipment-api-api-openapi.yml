tags:
- name: Equipment API
  description: The Equipment API is used to manage equipment data.
paths:
  /maintenance/v1/equipment-attributes:
    post:
      operationId: createEquipmentAttribute
      summary: Create Equipment Attribute
      tags:
      - Equipment API
      description: Creates a new Equipment Attribute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddEquipmentAttribute'
      responses:
        '201':
          description: The resource was created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentAttributeDTO'
        '400':
          description: A validation error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
      x-source: https://developers.plex.com/api/documentation/equipment-api/create-equipment-attribute
    get:
      operationId: listEquipmentAttributes
      summary: List Equipment Attributes
      tags:
      - Equipment API
      description: List equipment attributes by query parameters.
      parameters:
      - name: attributeName
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The name of an Equipment Attribute.
      - name: unit
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The unit associated with the Equipment Attribute.
      - name: typeAttribute
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: If true, only the list of Type Equipment Attributes will be returned.
      - name: groupAttribute
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: If true, only the list of Group Equipment Attributes will be returned.
      - name: categoryAttribute
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: If true, only the list of Category Equipment Attributes will be returned.
      - name: useValues
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: If true, only the list of Equipment Attributes where values are being use will be returned.
      - name: smartAttribute
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: If true, only the list of Smart Equipment Attributes will be returned.
      - name: active
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: If true, only the list of Active Equipment Attributes will be returned.
      responses:
        '200':
          description: The query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentAttributeDTO'
      x-source: https://developers.plex.com/api/documentation/equipment-api/list-equipment-attributes
  /maintenance/v1/equipment-attributes/{id}:
