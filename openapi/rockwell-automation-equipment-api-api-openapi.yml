  /maintenance/v1/equipment:
    get:
      operationId: listEquipment
      summary: List Equipment
      tags:
      - Equipment API
      description: List equipment by query parameters.
      parameters:
      - name: equipmentId
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The Equipment ID.
      - name: equipmentTypeId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the Equipment Type.
      - name: buildingId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the Equipment Building.
      - name: locationId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the Equipment Location.
      - name: workcenterId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the Equipment Workcenter.
      - name: partId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the associated Part.
      - name: partType
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The associated Part Type.
      - name: status
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The associated Equipment Status.
      - name: serialNo
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The Equipment Serial Number.
      - name: active
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: The Equipment Active flag.
      responses:
        '200':
          description: The query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentDTO'
