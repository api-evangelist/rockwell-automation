  /maintenance/v1/equipment-types:
    get:
      operationId: listEquipmentTypes
      summary: List Equipment Types
      tags:
      - Equipment API
      description: List equipment Types by query parameters.
      parameters:
      - name: equipmentType
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The name of an Equipment Type.
      responses:
        '200':
