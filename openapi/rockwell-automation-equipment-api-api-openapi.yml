          description: The Equipment Model Number.
          example: string
        equipmentType:
          type: string
          description: The Equipment Type of the Equipment.
          example: string
        equipmentTypeId:
          type: string
          format: uuid
          description: The ID of the Equipment Type.
          example: 00000000-0000-0000-0000-000000000000
        equipmentGroup:
          type: string
          description: The Group of the Equipment.
          example: string
        equipmentCategory:
          type: string
          description: The Category of the Equipment.
          example: string
        equipmentPriority:
          type: string
          description: The Priority of the Equipment.
          example: string
        location:
