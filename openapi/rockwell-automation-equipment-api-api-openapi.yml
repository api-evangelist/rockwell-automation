                $ref: '#/components/schemas/ValidationResponse'
        '404':
          description: The resource does not exist.
      x-source: https://developers.plex.com/api/documentation/equipment-api/update-equipment-attribute
  /maintenance/v1/equipment-types/{id}:
    get:
      operationId: getEquipmentTypes
      summary: Get Equipment Types
      tags:
      - Equipment API
      description: Get equipment type by ID.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
