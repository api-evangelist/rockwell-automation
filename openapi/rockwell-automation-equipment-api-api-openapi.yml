components:
  schemas:
    UpdateEquipmentAttribute:
      type: object
      properties:
        attributeName:
          type: string
          description: The name of the Equipment Attribute.
          example: string
        description:
          type: string
          description: A description of the Equipment Attribute.
          example: string
        unitId:
          type: string
          format: uuid
          description: The unit ID associated with the Equipment Attribute.
          example: 00000000-0000-0000-0000-000000000000
        useValues:
          type: boolean
          description: The Use Value Flag.
          example: false
        typeAttribute:
          type: boolean
          description: The Type Attribute Flag.
          example: false
        groupAttribute:
          type: boolean
          description: The Group Attribute Flag.
          example: false
        categoryAttribute:
          type: boolean
          description: The Category Attribute Flag.
          example: false
        smartAttribute:
          type: boolean
          description: The Smart Attribute Flag. Operating Parameters module must be enabled for Smart Attributes.
          example: false
        active:
          type: boolean
          description: The Active Flag.
          example: false
        attributeValues:
          type: array
          description: List of associated Values if Use Value is enabled.
          items:
            type: object
            properties: {}
        attributeValue:
          type: string
          description: A value of the Equipment Attribute.
          example: string
        sortOrder:
          type: integer
          format: int32
          description: The sort order for the Equipment Attribute Value.
          example: 0
      required:
      - attributeName
      - unitId
    EquipmentDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the Equipment.
