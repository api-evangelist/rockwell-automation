          format: uuid
          description: The ID of the Equipment Building.
          example: 00000000-0000-0000-0000-000000000000
        workcenter:
          type: string
          description: The Workcenter of the Equipment.
          example: string
        workcenterId:
          type: string
          format: uuid
          description: The ID of the Equipment Workcenter.
          example: 00000000-0000-0000-0000-000000000000
        department:
          type: string
          description: The Department of the Equipment.
          example: string
        status:
          type: string
          description: The Status of the Equipment.
          example: string
        taxClassification:
          type: string
          description: The Tax Classification of the Equipment.
          example: string
        champion:
          type: string
          description: The Champion of the Equipment.
          example: string
        serialNo:
          type: string
          description: The Equipment Serial Number.
          example: string
        active:
          type: boolean
          description: The Equipment Active flag.
          example: false
        equipmentAttributes:
          type: array
          description: The list of associated Equipment Attributes.
          items:
            type: object
            properties: {}
        parts:
          type: array
          description: The list of associated Parts.
          items:
            type: object
            properties: {}
    EquipmentTypeDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: An ID representing the Equipment Type.
          example: 00000000-0000-0000-0000-000000000000
        equipmentType:
          type: string
