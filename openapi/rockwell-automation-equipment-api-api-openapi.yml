      operationId: getEquipmentAttributes
      summary: Get Equipment Attributes
      tags:
      - Equipment API
      description: Get equipment attribute by ID.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
      responses:
        '200':
          description: The query executed successfully.
          content:
