  /accounting/v1/ap-invoices/{id}/linkreceipts:
    post:
      operationId: linkReceiptsWithApInvoice
      summary: Link Receipts With AP Invoice
      tags:
      - Accounts Payable Invoices API
      description: 'Disclaimer: The Accounts Payable Invoices API only links the following supported receipt types with AP invoices: receiving and consignment usage. This API does not link settlement receipts with AP invoices. The APIs are designed to maintain optimal performance with a limit of 300 receipts per invoice per call. To avoid timeout errors, you can call this endpoint in batches of 300 receipts each to link more receipts to an invoice.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
      requestBody:
        required: true
        content:
