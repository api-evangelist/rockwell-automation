          type: boolean
          description: Specify that the AP invoice line is a tax line.
          example: false
      required:
      - invoiceNumber
      - terms
      - periodDisplay
      - currencyCode
      - status
      - description
      - isTaxLine
  securitySchemes:
    PlexConnectApiKey:
      type: apiKey
      in: header
      name: X-Plex-Connect-Api-Key
      description: 'Subscription key (Consumer Key of an app created in the Plex Developer Portal). Source: https://developers.plex.com/getstarted'
