components:
  schemas:
    DynamicMultiOutTemplateDto:
      type: object
      description: The Dynamic Multi Out Template model.
      properties:
        id:
          type: string
          format: uuid
          description: A unique identifier for the Dynamic Multi Out Template.
          example: 00000000-0000-0000-0000-000000000000
        code:
          type: string
          description: The unique code of the Dynamic Multi Out Template.
          example: string
        active:
          type: boolean
          description: A flag that determines if the Dynamic Multi Out Template is active.
          example: false
        valid:
          type: boolean
          description: A flag that determines if the Dynamic Multi Out Template is valid to be used in a set.
          example: false
    DynamicMultiOutTemplatePartOperationDto:
      type: object
      description: The Part Operation model for Dynamic Multi Out Templates.
      properties:
        id:
          type: string
          format: uuid
          description: A unique identifier for the Part Operation.
          example: 00000000-0000-0000-0000-000000000000
        templateId:
          type: string
          format: uuid
          description: A unique identifier for the Dynamic Multi Out Template.
          example: 00000000-0000-0000-0000-000000000000
        partId:
          type: string
          format: uuid
          description: A unique identifier for the Part.
          example: 00000000-0000-0000-0000-000000000000
        partNumber:
          type: string
          description: The Part Number of the Part Operation.
          example: string
        revision:
          type: string
          description: The Revision of the Part.
          example: string
        partNumberRevision:
          type: string
          description: The Part Operation's Part Number Revision formatted with separator.
          example: string
        operationNumber:
          type: integer
          format: int32
          description: The Operation Number of the Part Operation.
          example: 0
        operationCode:
          type: string
          description: The Operation Code of the Part Operation.
          example: string
        workcenters:
          type: array
          description: The workcenters that belong to the operation and are valid for Multi Out Template execution.
          items:
            type: string
        multiple:
          type: number
          format: double
          description: The multiple value of the Part Operation.
          example: 0.1
        primary:
          type: boolean
          description: When true, flags this Part Operation as the primary for this template.
          example: false
