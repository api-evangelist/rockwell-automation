openapi: 3.2.0
info:
  title: Plex (Rockwell Automation) Connect Purchase Orders API
  version: '2026-10-20'
  description: Plex Smart Manufacturing Platform REST APIs, converted mechanically from the structured operation documents the Plex Developer Portal (developers.plex.com, a Rockwell Automation property) serves at /api/documentation/{api}/{operation}. No operations were authored by hand.
  x-generated-from: provider-documentation-json
  x-source: https://developers.plex.com/api/documentation/info
servers:
- url: https://connect.plex.com
  description: Production
- url: https://test.connect.plex.com
  description: Test (from https://developers.plex.com/api/sandbox/url)
security:
- PlexConnectApiKey: []
tags:
- name: Purchase Orders API
  description: The Purchase Orders API is used to retrieve purchase order information, including line items. This API exposes endpoints to retrieve purchase orders and their sub-resources in the context of Purchasing. Use a GET request to retrieve the information about purchase orders, line items related to purchase orders, purchase order types, and statuses.
paths:
  /purchasing/v1/purchase-orders/{id}/line-items/{lineItemId}:
    get:
      operationId: getLineItem
      summary: Get Line Item
      tags:
      - Purchase Orders API
      description: Retrieve a PO line item by ID. A line item on a purchase order contains information that specifies the purchased item or service along with the low-level details of the order, including the price (depending on configuration) and release schedule. Most of the fields available in a line item are controlled by the PO type. Some fields are also controlled by module settings and setup table configuration.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: A unique identifier for the purchase order.
      - name: lineItemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: A unique identifier for the line item.
      responses:
        '200':
          description: The query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineItemDto'
        '404':
          description: The resource was not found.
      x-source: https://developers.plex.com/api/documentation/purchase-orders-api/get-line-item
  /purchasing/v1/purchase-orders/{id}:
    get:
      operationId: getPurchaseOrder
      summary: Get Purchase Order
      tags:
      - Purchase Orders API
      description: Retrieve a purchase order by ID. Purchase orders (POs) are created for single-use "spot buys" or recurring blanket orders of goods from suppliers. Before using POs to order goods (such as parts, materials, and supplies), the goods must be defined in the system. For example, a component part must appear on the Parts screen to order it from a supplier. Once the purchase order is created in the system, Get Purchase Order is used to retrieve the purchase order information.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: A unique identifier for the purchase order.
      responses:
        '200':
          description: The query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderDto'
        '404':
          description: The purchase order was not found.
      x-source: https://developers.plex.com/api/documentation/purchase-orders-api/get-purchase-order
  /purchasing/v1/purchase-orders/{poId}/line-items:
    get:
      operationId: listLineItems
      summary: List Line Items
      tags:
      - Purchase Orders API
      description: List PO line items by query parameters. The List Line Items operation retrieves the information associated with the line items. PO line items are used to specify the purchased item or service along with the low-level details of the order, including the price (depending on configuration) and release schedule. Most of the fields available in a line item are controlled by the PO type. Some fields are also controlled by module settings and setup table configuration.
      parameters:
      - name: id
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: A list of unique identifiers for line items.
      - name: lineItemNumber
        in: query
        required: false
        schema:
          type: integer
          format: int32
          example: 0
        description: The PO line item number.
      - name: status
        in: query
        required: false
        schema:
          type: string
          example: string
        description: 'Setup Table: PO Line Item Status'
      - name: manufacturer
        in: query
        required: false
        schema:
          type: string
          example: string
        description: 'Application: Manufacturers'
      - name: manufacturerPartNumber
        in: query
        required: false
        schema:
          type: string
          example: string
        description: Manufacturer part number, this may be different than the Plex part number.
      - name: supplierPartNumber
        in: query
        required: false
        schema:
          type: string
          example: string
        description: Supplier part number, this may be different than the Plex part number.
      - name: itemId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: A unique identifier for the supply item.
      - name: partId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: A unique identifier for the part.
      - name: building
        in: query
        required: false
        schema:
          type: string
          example: string
        description: 'Application: Buildings'
      - name: department
        in: query
        required: false
        schema:
          type: string
          example: string
        description: 'Application: Department List'
      - name: createdDateBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:17Z'
        description: The date on which the record was created.
      - name: createdDateEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:17Z'
        description: The date on which the record was created.
      - name: modifiedById
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the user who last modified the record.
      - name: modifiedDateBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:17Z'
        description: The date on which the record was last modified.
      - name: modifiedDateEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:17Z'
        description: The date on which the record was last modified.
      - name: poId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: A unique identifier for the purchase order.
      responses:
        '200':
          description: The query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineItemDto'
        '404':
          description: The purchase order was not found.
      x-source: https://developers.plex.com/api/documentation/purchase-orders-api/list-line-items
  /purchasing/v1/purchase-orders/{id}/line-items/{lineItemId}/prices:
    get:
      operationId: listPurchaseOrderPrices
      summary: List Purchase Order Prices
      tags:
      - Purchase Orders API
      description: List purchase order prices based on specified query parameters related to the price's effective date and expiration date.
      parameters:
      - name: priceByDateBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:17Z'
        description: A date on which to validate if the Price is effective. Only returns records with an Expiration Date on or after this value when it is specified.
      - name: priceByDateEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:17Z'
        description: A date on which to validate if the Price is effective. Only returns records with an Effective Date on or before this value when it is specified.
      - name: effectiveDateBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:17Z'
        description: A date on which to validate if the Price is effective. Only returns records with an Effective Date on or after this value when it is specified.
      - name: effectiveDateEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:17Z'
        description: A date on which to validate if the Price is effective. Only returns records with an Effective Date on or before this value when it is specified.
      - name: expirationDateBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:17Z'
        description: A date on which to validate if the Price is effective. Only returns records with an Expiration Date on or after this value when it is specified.
      - name: expirationDateEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:17Z'
        description: A date on which to validate if the Price is effective. Only returns records with an Expiration Date on or before this value when it is specified.
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: A unique identifier for the purchase order.
      - name: lineItemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: A unique identifier for the line item.
      responses:
        '200':
          description: The query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoPriceDto'
        '404':
          description: The resource was not found.
      x-source: https://developers.plex.com/api/documentation/purchase-orders-api/list-purchase-order-prices
  /purchasing/v1/purchase-order-statuses:
    get:
      operationId: listPurchaseOrderStatuses
      summary: List Purchase Order Statuses
      tags:
      - Purchase Orders API
      description: List purchase order statuses based on specified PO status properties. Purchase order status can include values such as New, Requested, Review, On order, Approved, Hold, Cancelled, Received, or other custom statuses as configured in the PO Status setup table.
      parameters:
      - name: name
        in: query
        required: false
        schema:
          type: string
          example: string
        description: List of purchase order status names.
      - name: active
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: Indicates whether the purchase order status is active or inactive.
      - name: default
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: Indicates that this purchase order status is the default for purchase orders.
      - name: receive
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: Indicates that purchase orders in this status allow receiving.
      - name: includeInMrp
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: Indicates that purchase orders in this status are included in MRP (Material Requirements Planning).
      - name: cancelled
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: Indicates that purchase orders in this status are canceled.
      - name: release
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: Indicates that purchase orders in this status are released.
      - name: onOrder
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: Indicates that purchase orders in this status are on order (sent to the supplier).
      - name: received
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: Indicates that purchase orders in this status were fully received.
      responses:
        '200':
          description: The query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderStatusDto'
      x-source: https://developers.plex.com/api/documentation/purchase-orders-api/list-purchase-order-statuses
  /purchasing/v1/purchase-order-types:
    get:
      operationId: listPurchaseOrderTypes
      summary: List Purchase Order Types
      tags:
      - Purchase Orders API
      description: List purchase order type records based on specified PO type properties. Purchase order types can include values such as Direct Materials, Purchased Components and Materials, Subcontract, Inventoried MRO / Supply, Indirect Services, Tooling, CapEx, or other custom types as configured on the Purchase Order Types screen.
      parameters:
      - name: name
        in: query
        required: false
        schema:
          type: string
          example: string
        description: List of purchase order type names.
      - name: active
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: Indicates whether the purchase order type is active or inactive.
      - name: default
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: Indicates that this purchase order type is the default for purchase orders.
      - name: includeInMRP
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: Indicates that purchase orders of this type are included in MRP (Material Requirements Planning).
      responses:
        '200':
          description: The query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderTypeDto'
      x-source: https://developers.plex.com/api/documentation/purchase-orders-api/list-purchase-order-types
  /purchasing/v1/purchase-orders:
    get:
      operationId: listPurchaseOrders
      summary: List Purchase Orders
      tags:
      - Purchase Orders API
      description: List purchase orders by query parameters. Purchase orders (POs) are created for single-use "spot buys" or recurring blanket orders of goods from suppliers. Before using POs to order goods (such as parts, materials, and supplies), the goods must be defined in the system. For example, a component part must appear on the Parts screen before ordering it from a supplier.
      parameters:
      - name: id
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: A list of purchase order IDs.
      - name: pONumber
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The purchase order number.
      - name: status
        in: query
        required: false
        schema:
          type: string
          example: string
        description: 'Setup Table: PO Status'
      - name: active
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: This flag will be set to true by default.
      - name: receive
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: Indicates that purchase orders in this status allow receiving.
      - name: type
        in: query
        required: false
        schema:
          type: string
          example: string
        description: 'Application: PO Type'
      - name: supplierId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: A unique identifier for the supplier.
      - name: shipTo
        in: query
        required: false
        schema:
          type: string
          example: string
        description: 'The destination to which goods and services on the PO will be shipped to. Application: PO Ship To'
      - name: orderedDateBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:17Z'
        description: The date on which the status was set to On Order.
      - name: orderedDateEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:17Z'
        description: The date on which the status was set to On Order.
      - name: dueDateBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:17Z'
        description: The Due Date for the PO, not for individual lines or releases.
      - name: dueDateEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:17Z'
        description: The Due Date for the PO, not for individual lines or releases.
      - name: building
        in: query
        required: false
        schema:
          type: string
          example: string
        description: 'Application: Buildings'
      - name: department
        in: query
        required: false
        schema:
          type: string
          example: string
        description: 'Application: Department List'
      - name: blanketOrder
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: Determines whether the Purchase Order is a blanket order or discrete order.
      - name: createdById
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the user who created the record.
      - name: createdDateBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:17Z'
        description: The date on which the record was created.
      - name: createdDateEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:17Z'
        description: The date on which the record was created.
      - name: modifiedById
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the user who last modified the record.
      - name: modifiedDateBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:17Z'
        description: The date on which the record was last modified.
      - name: modifiedDateEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:17Z'
        description: The date on which the record was last modified.
      responses:
