components:
  schemas:
    LineItemDto:
      type: object
      description: The primary model for a Line Item.
      properties:
        id:
          type: string
          format: uuid
          description: A unique identifier for the Line Item.
          example: 00000000-0000-0000-0000-000000000000
        lineItemNumber:
          type: integer
          format: int32
          description: PO Line Item Number
          example: 0
        status:
          type: string
          description: 'Setup Table: PO Line Item Status'
          example: string
        expirationDate:
          type: string
          format: date-time
          description: The Expiration Date of the Line Item.
          example: '2026-10-20T12:03:17Z'
        unit:
          type: string
          example: string
        orderUnit:
          type: string
          description: The unit of measure for the part on the PO.
          example: string
        description:
          type: string
          description: The description of the product or service being ordered.
          example: string
        unitPrice:
          type: number
          format: double
          description: Price per unit.
          example: 0.1
        estimatedPrice:
          type: boolean
          description: If the unit price is estimated.
          example: false
        accountId:
          type: string
          format: uuid
          description: The ID of the General Ledger account associated with the PO Line.
          example: 00000000-0000-0000-0000-000000000000
        manufacturer:
          type: string
          description: 'Application: Manufacturers'
          example: string
        manufacturerPartNumber:
          type: string
          description: Manufacturer Part Number, this may be different than the Plex part number.
          example: string
        supplierPartNumber:
          type: string
          description: Supplier Part Number, this may be different than the Plex part number.
          example: string
        itemId:
          type: string
          format: uuid
          description: A unique identifier for the supply item.
          example: 00000000-0000-0000-0000-000000000000
        taxCode:
          type: string
          description: 'Application: Tax Codes'
          example: string
        partId:
          type: string
          format: uuid
          description: A unique identifier for the part.
          example: 00000000-0000-0000-0000-000000000000
        operationCode:
          type: string
          description: 'Application: Operation List'
          example: string
        partOperationId:
          type: string
          format: uuid
          description: A unique identifier for the part operation.
          example: 00000000-0000-0000-0000-000000000000
        routeToEmployeeId:
          type: string
          format: uuid
          description: The Employee ID to which the request is routed.
          example: 00000000-0000-0000-0000-000000000000
        requestedById:
          type: string
          format: uuid
          description: The ID of the user who requested the record.
          example: 00000000-0000-0000-0000-000000000000
        weightUnit:
          type: string
          example: string
        weightConversion:
          type: number
          format: double
          example: 0.1
        internalNote:
          type: string
          description: A note that can only be viewed on the Line Item Detail form.
          example: string
        note:
          type: string
          description: A note for the line item that is displayed in grid records.
          example: string
        building:
          type: string
          description: 'Application: Buildings'
          example: string
        department:
          type: string
          description: 'Application: Department List'
          example: string
        blanketQuantity:
          type: number
          format: double
          description: The blanket order quantity for the line item.
          example: 0.1
        createdDate:
          type: string
          format: date-time
          description: The date on which the record was created.
          example: '2026-10-20T12:03:17Z'
        modifiedById:
          type: string
          format: uuid
          description: The ID of the user who last modified the record.
          example: 00000000-0000-0000-0000-000000000000
        modifiedDate:
          type: string
          format: date-time
          description: The date on which the record was last modified.
          example: '2026-10-20T12:03:17Z'
    PurchaseOrderStatusDto:
      type: object
      description: The primary model for a PO Status.
      properties:
        name:
          type: string
          description: The name of the purchase order status.
          example: string
        receive:
          type: boolean
          description: Indicates that purchase orders in this status allow receiving.
          example: false
        active:
          type: boolean
          description: Indicates whether the purchase order status is active or inactive.
          example: false
        default:
          type: boolean
          description: Indicates that this purchase order status is the default for purchase orders.
          example: false
        includeInMrp:
          type: boolean
          description: Indicates that purchase orders in this status are included in MRP (Material Requirements Planning).
          example: false
        cancelled:
          type: boolean
          description: Indicates that purchase orders in this status are canceled.
          example: false
        release:
          type: boolean
          description: Indicates that purchase orders in this status are released.
          example: false
        onOrder:
          type: boolean
          description: Indicates that purchase orders in this status are on order (sent to the supplier).
          example: false
        received:
          type: boolean
          description: Indicates that purchase orders in this status were fully received.
          example: false
    PoPriceDto:
      type: object
      description: The primary model for a Price.
      properties:
        effectiveDate:
          type: string
          format: date-time
          description: The effective date of the price.
          example: '2026-10-20T12:03:17Z'
        expirationDate:
          type: string
          format: date-time
          description: The expiration date of the price.
          example: '2026-10-20T12:03:17Z'
        unitPrice:
          type: number
          format: double
          description: Price per unit.
          example: 0.1
        note:
          type: string
          example: string
        createdById:
          type: string
          format: uuid
          description: The ID of the user who created the record.
          example: 00000000-0000-0000-0000-000000000000
        createdDate:
          type: string
          format: date-time
          description: The date on which the record was created.
          example: '2026-10-20T12:03:17Z'
        modifiedById:
          type: string
          format: uuid
          description: The ID of the user who last modified the record.
          example: 00000000-0000-0000-0000-000000000000
        modifiedDate:
          type: string
          format: date-time
          description: The date on which the record was last modified.
          example: '2026-10-20T12:03:17Z'
    PurchaseOrderDto:
      type: object
      description: The primary model for a Purchase Order.
      properties:
        id:
          type: string
          format: uuid
          description: A unique identifier for the purchase order.
          example: 00000000-0000-0000-0000-000000000000
        poNumber:
          type: string
          description: The purchase order number.
          example: string
        currencyCode:
          type: string
          description: The ISO 4217 three digit alphanumeric currency code designation.
          example: string
        status:
          type: string
          description: 'Setup Table: PO Status'
          example: string
        active:
          type: boolean
          description: This flag will be set to true by default.
          example: false
        receive:
          type: boolean
          description: Indicates that purchase orders in this status allow receiving.
          example: false
        type:
          type: string
          description: 'Application: PO Type'
          example: string
        supplierId:
          type: string
          format: uuid
          description: A unique identifier for the supplier.
          example: 00000000-0000-0000-0000-000000000000
        supplierAddressId:
          type: string
          format: uuid
          description: A unique identifier for the supplier address.
