components:
  schemas:
    UpdatePartDTO:
      type: object
      description: The part model containing the data required to update a part.
      properties:
        number:
          type: string
          description: The part number.
          example: string
        name:
          type: string
          description: The part name.
          example: string
        revision:
          type: string
          description: The part revision.
          example: string
        description:
          type: string
