          description: Determines whether the End Unit Number (EUN) tracking is required for this part. When true, the system enforces the EUN assignment for inventory and production transactions involving this part, enabling end to end unit level traceability. Once enabled for a part, it cannot be disabled.
          example: false
      required:
      - number
      - type
      - status
  securitySchemes:
    PlexConnectApiKey:
      type: apiKey
      in: header
      name: X-Plex-Connect-Api-Key
      description: 'Subscription key (Consumer Key of an app created in the Plex Developer Portal). Source: https://developers.plex.com/getstarted'
