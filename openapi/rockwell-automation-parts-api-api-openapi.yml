    get:
      operationId: listPartsV2
      summary: List Parts
      tags:
      - Parts API
      description: List parts by query parameters.
      parameters:
      - name: id
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: A list of part IDs.
      - name: number
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The part number.
      - name: revision
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The part revision.
      - name: type
        in: query
        required: false
        schema:
          type: string
          example: string
        description: 'The part type. Setup Table: Part_Type.'
      - name: status
        in: query
        required: false
        schema:
          type: string
          example: string
        description: 'The status of the part. Setup Table: Part_Status.'
      - name: source
        in: query
        required: false
        schema:
          type: string
          example: string
        description: 'The part source, which represents the origin of the part. Setup Table: Part_Source.'
      - name: productType
        in: query
        required: false
        schema:
          type: string
          example: string
        description: 'The part''s product type. Setup Table: Part_Product_Type.'
      - name: allergens
        in: query
        required: false
        schema:
          type: string
          example: string
        description: 'Allergen(s) defined on the part. Setup Table: Allergen. Allergen values are only returned when the HACCP module or the Storage Validation module is enabled.'
