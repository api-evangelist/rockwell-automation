          example: string
        type:
          type: string
          description: 'The part type. Setup Table: Part_Type.'
          example: string
        group:
          type: string
          description: 'The part group. Setup Table: Part_Group.'
          example: string
        source:
          type: string
          description: 'The part source, which represents the origin of the part. Setup Table: Part_Source.'
          example: string
        productType:
          type: string
          description: 'The part''s product type. Setup Table: Part_Product_Type.'
          example: string
        status:
          type: string
          description: 'The status of the part. Setup Table: Part_Status.'
          example: string
        note:
          type: string
          description: A note about the part.
          example: string
        leadTimeDays:
          type: integer
          format: int32
          description: The number of days in advance to schedule orders for the part.
          example: 0
        buildingCode:
          type: string
          description: 'The main building where the part is located. Application: Buildings.'
          example: string
        allergens:
          type: array
          description: 'Allergen(s) defined on the part. Setup Table: Allergen. Allergen values are only returned when the HACCP module or the Storage Validation module is enabled.'
          items:
            type: string
        storageConditions:
          type: array
          description: 'The storage condition(s) defined on the part. Setup Table: Storage_Condition. Storage condition values are only returned when the Storage Validation module is enabled.'
          items:
            type: string
        serialize:
          type: boolean
          description: Tracks container serial numbers.
          example: false
        lotRequired:
          type: boolean
          description: Determines whether lot tracking is required for this part. When true, the part is included in lot management and must have a valid lot format. When false or omitted, lot tracking is not required for the part.
          example: false
        lotFormat:
          type: string
          description: Determines the format of automatically generated lot numbers. A lot format is composed of an ordered sequence of tokens, each resolving to a runtime value derived from contextual information such as dates, identifiers, sequences, etc.
          example: string
        bomSubstitutionAllow:
          type: boolean
          description: Determines whether Bill of Materials (BOM) substitutions are permitted for this part. When true, substitute components can be used in place of this part on a BOM. When false, substitutions are not allowed and the exact part must be used.
          example: false
        eunRequired:
          type: boolean
          description: Determines whether the End Unit Number (EUN) tracking is required for this part. When true, the system enforces the EUN assignment for inventory and production transactions involving this part, enabling end to end unit level traceability. Once enabled for a part, it cannot be disabled.
          example: false
      required:
      - number
      - type
      - status
