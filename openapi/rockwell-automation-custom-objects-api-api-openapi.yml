paths:
  /platform/custom-objects/v1/data/{customObjectName}/add:
    post:
      operationId: createCustomObjectDataInBulk
      summary: Create Custom Object Data In Bulk
      tags:
      - Custom Objects API
      description: 'Create records for the specified custom object. The newly added CustomObjectRecords are returned.

        This operation is limited to 5000 records per transaction.'
      parameters:
      - name: customObjectName
        in: path
        required: true
        schema:
          type: string
          example: string
        description: The name of the custom object.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomObjectData'
      responses:
        '201':
          description: Query executed successfully and the custom object data was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomObjectRecord'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '404':
          description: The custom object was not found.
      x-source: https://developers.plex.com/api/documentation/custom-objects-api/create-custom-object-data-in-bulk
  /platform/custom-objects/v1/data/{customObjectName}:
