openapi: 3.2.0
info:
  title: Plex (Rockwell Automation) Connect Part Specifications API
  version: '2026-10-20'
  description: Plex Smart Manufacturing Platform REST APIs, converted mechanically from the structured operation documents the Plex Developer Portal (developers.plex.com, a Rockwell Automation property) serves at /api/documentation/{api}/{operation}. No operations were authored by hand.
  x-generated-from: provider-documentation-json
  x-source: https://developers.plex.com/api/documentation/info
servers:
- url: https://connect.plex.com
  description: Production
- url: https://test.connect.plex.com
  description: Test (from https://developers.plex.com/api/sandbox/url)
security:
- PlexConnectApiKey: []
tags:
- name: Part Specifications API
  description: The Part Specifications API is used to manage part specifications data.
paths:
  /quality/v1/part-specifications:
    post:
      operationId: addOrUpdatePartSpecification
      summary: Add Or Update Part Specification
      tags:
      - Part Specifications API
      description: Add or update a part specification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddPartSpecificationDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecificationDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
      x-source: https://developers.plex.com/api/documentation/part-specifications-api/add-or-update-part-specification
    get:
      operationId: listPartSpecifications
      summary: List Part Specifications
      tags:
      - Part Specifications API
      description: Retrieve a list of part specifications.
      parameters:
      - name: partId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The Specification Part ID.
      - name: ids
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the Part Specification.
      - name: specificationNumber
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The Specification number of the part specification.
      - name: specificationType
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The Specification Type filter for the part specification.
      - name: active
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: The Active filter for the part specification.
      - name: createdDateTimeBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:13Z'
        description: The Created Date Time Begin filter for the part specification.
      - name: createdDateTimeEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:13Z'
        description: The Created Date Time End filter for the part specification.
      - name: updatedDateTimeBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:13Z'
        description: The Updated Date Time Begin filter for the part specification.
      - name: updatedDateTimeEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:13Z'
        description: The Updated Date Time End filter for the part specification.
      responses:
        '200':
          description: Query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecificationDto'
      x-source: https://developers.plex.com/api/documentation/part-specifications-api/list-part-specifications
  /quality/v1/part-specifications/{id}:
    delete:
      operationId: deletePartSpecification
      summary: Delete Part Specification
      tags:
      - Part Specifications API
      description: Delete a part specification by ID.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: A unique identifier for the part specification.
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '404':
          description: Not Found
      x-source: https://developers.plex.com/api/documentation/part-specifications-api/delete-part-specification
    get:
      operationId: getPartSpecification
      summary: Get Part Specification
      tags:
      - Part Specifications API
      description: Retrieve a part specification by ID.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: A unique identifier for the part specification.
      responses:
        '200':
          description: The query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecificationDto'
        '404':
          description: Resource not found.
      x-source: https://developers.plex.com/api/documentation/part-specifications-api/get-part-specification
