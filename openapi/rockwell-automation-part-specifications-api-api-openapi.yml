          example: 0
        runLengthX:
          type: integer
          format: int32
          description: The length of the run on the X chart.
          example: 0
        spc:
          type: boolean
          description: The SPC enabled flag for the specification.
          example: false
        specialSymbol:
          type: string
          description: The special symbol to use for the part specification.
          example: string
        specificationDimensionType:
          type: string
          description: The specification dimension type of the part specification.
          example: string
        specificationNumber:
          type: string
          description: The specification number of the part specification.
          example: string
        specificationId:
          type: string
          format: uuid
          description: The Specification ID of the part specification.
          example: 00000000-0000-0000-0000-000000000000
        specificationType:
          type: string
          description: The specification type.
          example: string
        targetValue:
          type: number
          format: double
          description: The Nominal/Target value of the specification.
          example: 0.1
        targetValueDisplay:
          type: boolean
          description: Indicates whether or not the target value is displayed.
          example: false
        toleranceType:
          type: string
          description: The tolerance type attributes of the part specification.
          example: string
        trend:
          type: boolean
          description: Consecutive Trending alert.
          example: false
        trendLength:
          type: integer
          format: int32
          description: The trend length for alerts on the specification.
          example: 0
        upperTolerance:
          type: number
          format: double
          description: The upper tolerance value of the specification.
          example: 0.1
        unit:
          type: string
          description: The unit of measure for the specification.
          example: string
        valueText:
          type: string
          description: The value text of the specification.
          example: string
        workcenterId:
          type: string
          format: uuid
          description: The workcenter associated with the specification.
          example: 00000000-0000-0000-0000-000000000000
      required:
      - color
      - description
      - formula
      - functionRequirementType
      - gageType
      - importance
      - note
      - plcName
      - precision
      - specificationDimensionType
      - specificationNumber
