          example: string
        precision:
          type: integer
          format: int32
          description: The number of decimal places for numeric values.
          example: 0
        primaryImageNodeNo:
          type: integer
          format: int32
          description: The primary image node number for the specification.
          example: 0
        runAboveMeanR:
          type: integer
          format: int32
          description: Run above centerline on Range chart alert.
          example: 0
        runAboveMeanX:
          type: integer
          format: int32
          description: Run above centerline on X chart alert.
          example: 0
        runBelowMeanR:
          type: integer
          format: int32
          description: Run below centerline on Range chart alert.
          example: 0
        runBelowMeanX:
          type: integer
          format: int32
          description: Run below centerline on X chart alert.
          example: 0
        runLengthR:
