          $ref: '#/components/schemas/ToleranceTypeDto'
        trend:
          type: integer
          format: int32
          description: The Consecutive Trending alert.
          example: 0
        trendLength:
          type: integer
          format: int32
          description: The trend length for alerts on the specification.
          example: 0
        updatedDateTime:
          type: string
          format: date-time
          description: The latest date this specification was updated.
          example: '2026-10-20T12:03:13Z'
        valueText:
          type: string
          description: The value text of the specification.
          example: string
        workcenter:
          type: string
          description: The workcenter associated with the specification.
          example: string
        workcenterId:
          type: string
          format: uuid
          description: The ID of the workcenter associated with the specification.
          example: 00000000-0000-0000-0000-000000000000
    ToleranceTypeDto:
      type: object
      properties:
        name:
          type: string
          description: The tolerance type name.
          example: string
        attribute:
          type: boolean
          description: The designation of this tolerance type is an attribute specification or not.
          example: false
        target:
          type: number
          format: double
          description: The target of the tolerance type.
          example: 0.1
        targetPlus:
          type: number
          format: double
          description: The tolerance limit relating to value more than the target.
          example: 0.1
        targetMinus:
          type: number
          format: double
          description: The tolerance limit relating to value less than the target.
          example: 0.1
        decimalPrecision:
          type: integer
          format: int32
          description: Specify the number of decimal places to apply to measurements.
