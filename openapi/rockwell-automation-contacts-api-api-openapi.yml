tags:
- name: Contacts API
  description: The Contacts API is used to manage contact master data.
paths:
  /mdm/v1/contacts:
    post:
      operationId: createContact
      summary: Create Contact
      tags:
      - Contacts API
      description: Create a new Contact.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContactDTO'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
      x-source: https://developers.plex.com/api/documentation/contacts-api/create-contact
    get:
      operationId: listContacts
      summary: List Contacts
      tags:
      - Contacts API
      description: List Contacts by query parameters.
      parameters:
      - name: id
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: A list of contact IDs.
      - name: customerId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
      - name: firstName
        in: query
        required: false
        schema:
          type: string
          example: string
      - name: lastName
        in: query
        required: false
        schema:
          type: string
          example: string
      - name: companyName
        in: query
        required: false
        schema:
          type: string
          example: string
      - name: description
        in: query
        required: false
        schema:
          type: string
          example: string
      - name: supplierId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
      - name: type
        in: query
        required: false
        schema:
          type: string
          example: string
        description: 'Setup table: Contact Type.'
      - name: associatedWithId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: IAM Account Id
      responses:
        '200':
          description: The query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactDTO'
      x-source: https://developers.plex.com/api/documentation/contacts-api/list-contacts
  /mdm/v1/contacts/{id}/deactivate:
    post:
      operationId: deactivateContact
      summary: Deactivate Contact
      tags:
      - Contacts API
      description: Deactivate a Contact.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
      responses:
        '202':
          description: Accepted
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '404':
          description: Not Found
      x-source: https://developers.plex.com/api/documentation/contacts-api/deactivate-contact
  /mdm/v1/contacts/{id}:
    delete:
      operationId: deleteContact
      summary: Delete Contact
      tags:
      - Contacts API
      description: Delete a Contact.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '404':
          description: Not Found
      x-source: https://developers.plex.com/api/documentation/contacts-api/delete-contact
    get:
      operationId: getContact
      summary: Get Contact
      tags:
      - Contacts API
      description: Retrieve a Contact by Resource ID.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: Contact Resource ID
      responses:
        '200':
          description: The query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactDTO'
        '400':
          description: Bad Request
        '404':
          description: The contact does not exist.
      x-source: https://developers.plex.com/api/documentation/contacts-api/get-contact
    put:
      operationId: updateContact
      summary: Update Contact
      tags:
      - Contacts API
      description: Update a Contact.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateContactDTO'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '404':
          description: Not Found
      x-source: https://developers.plex.com/api/documentation/contacts-api/update-contact
  /mdm/v1/contacts/sync:
    post:
      operationId: syncContacts
      summary: Sync Contacts
      tags:
      - Contacts API
      description: Sync a set of Contacts from another system. This operation creates Contacts that do not exist in Plex and updates existing Contacts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncContactDTO'
      responses:
        '202':
          description: Accepted
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
      x-source: https://developers.plex.com/api/documentation/contacts-api/sync-contacts
