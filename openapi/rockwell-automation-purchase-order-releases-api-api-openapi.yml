components:
  schemas:
    UpdateReleaseDto:
      type: object
      description: The Release model exposed for updating.
      properties:
        status:
          type: string
          description: The status of the release. If no value is provided for the status, it will be determined based on the firm and planned days by the values provided in this request or in the Approved Supplier record associated with the PO line item.
          example: string
        dueDate:
          type: string
          format: date-time
          description: The Due Date of the Release.
          example: '2026-10-20T12:03:17Z'
        quantity:
          type: number
          format: double
          description: Release Quantity.
          example: 0.1
        type:
          type: string
          description: Release Type.
          example: string
        note:
          type: string
          description: Release Note.
          example: string
        poShipTo:
          type: string
          description: Purchase Order Ship To.
          example: string
        firmDays:
          type: integer
          format: int32
          description: 'The maximum number of days in which to create releases with a firm status.

            Any value provided in this parameter will override any Approved Supplier record associated with the PO line item.'
          example: 0
        planDays:
          type: integer
          format: int32
          description: 'The maximum number of days in which to create releases with a planned status.

            Any value provided in this parameter will override any Approved Supplier record associated with the PO line item.'
          example: 0
        forecastDays:
          type: integer
          format: int32
          description: 'The maximum number of days in which to create releases with a forecast status.

            Provide a value in this parameter to limit the created releases (the Approved Supplier record is not used to limit the number of Forecast Days for releases).'
          example: 0
      required:
      - dueDate
      - quantity
    ReleaseCancelDto:
      type: object
      description: The Release Cancel model
      properties:
        status:
          type: string
          description: The Release_Status
          example: string
      required:
      - status
    CreateReleaseDto:
      type: object
      description: The Sequenced Release model exposed for adding.
      properties:
        id:
          type: string
          format: uuid
          description: A unique identifier for the sequenced release.
          example: 00000000-0000-0000-0000-000000000000
        salesReleaseId:
          type: string
          format: uuid
          description: A unique identifier for the sales release.
          example: 00000000-0000-0000-0000-000000000000
        kitId:
          type: string
          format: uuid
          description: A unique identifier for the kit.
          example: 00000000-0000-0000-0000-000000000000
      required:
      - salesReleaseId
      - kitId
    ReleaseStatusDto:
      type: object
      description: The Release Status model.
      properties:
        name:
          type: string
          description: A unique identifier for the Release Status.
          example: string
        includeInMrp:
          type: boolean
          description: IncludeInMrp Flag
          example: false
        default:
          type: boolean
          description: Default Flag
          example: false
        active:
          type: boolean
          description: Active Flag
          example: false
        cancelled:
          type: boolean
          description: Cancelled Flag
          example: false
        received:
          type: boolean
          description: Received Flag
          example: false
        partial:
          type: boolean
          description: Partial Flag
          example: false
        forecast:
          type: boolean
          description: Forecast Flag
          example: false
        planStatus:
          type: boolean
          description: PlanStatus Flag
          example: false
        mrpAutoChange:
          type: boolean
          description: MrpAutoChange Flag
          example: false
        open:
          type: boolean
          description: Open Flag
          example: false
        immediateStatus:
          type: boolean
          description: ImmediateStatus Flag
          example: false
    ReleaseDto:
      type: object
      description: The Sequenced Release model.
      properties:
        id:
          type: string
          format: uuid
          description: A unique identifier for the sequenced release.
          example: 00000000-0000-0000-0000-000000000000
        salesReleaseNumber:
          type: string
          description: The sales release number.
          example: string
        releaseStatus:
          type: string
          description: The status assigned to the sequenced release.
          example: string
        salesReleaseId:
          type: string
          format: uuid
          description: A unique identifier for the sales release.
          example: 00000000-0000-0000-0000-000000000000
        kitId:
          type: string
          format: uuid
          description: A unique identifier for the kit.
          example: 00000000-0000-0000-0000-000000000000
        kitName:
          type: string
          description: The kit name.
          example: string
        createdById:
          type: string
          format: uuid
          description: The user account ID that created the release.
          example: 00000000-0000-0000-0000-000000000000
        createdDateTime:
          type: string
          format: date-time
          description: The date and time on which the release was created.
          example: '2026-10-20T12:03:13Z'
        modifiedById:
          type: string
          format: uuid
          description: The user account ID that last modified the release record.
          example: 00000000-0000-0000-0000-000000000000
        modifiedDateTime:
          type: string
          format: date-time
          description: The date and time on which the release record was modified.
          example: '2026-10-20T12:03:13Z'
        packedById:
          type: string
          format: uuid
          description: The account ID of the user who packed the release.
          example: 00000000-0000-0000-0000-000000000000
        packedDateTime:
          type: string
          format: date-time
          description: The date and time on which the release was packed.
          example: '2026-10-20T12:03:13Z'
        unPackedById:
          type: string
          format: uuid
          description: The account ID of the user who unpacked the release.
          example: 00000000-0000-0000-0000-000000000000
        unPackedDateTime:
          type: string
          format: date-time
          description: The date and time on which the release was unpacked.
          example: '2026-10-20T12:03:13Z'
    ValidationResponse:
      type: object
      properties:
        code:
          type: string
          example: string
        message:
          type: string
          example: string
        errors:
          type: array
          items:
            type: object
            properties: {}
