      x-source: https://developers.plex.com/api/documentation/edi-api/create-log
    get:
      operationId: getLogs
      summary: Get Logs
      tags:
      - EDI API
      description: List Logs by query parameters.
      parameters:
      - name: mailboxId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: A unique identifier for a Mailbox.
      - name: customerId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: A unique identifier for a Customer.
      - name: action
        in: query
        required: false
        schema:
          type: string
          example: string
        description: EDI Action. Must be a unique value.
      - name: status
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The Status of the EDI Log entry, supports a comma delimited list of desired statuses
      - name: documentName
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The Document Name.
      - name: logDateBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:11Z'
        description: The start of the date range for filtering the log entries.
      - name: logDateEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:11Z'
        description: The end of the date range for filtering the log entries.
      - name: mailboxActive
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: The Active flag of the EDI Mailbox. Set to true to return logs associated with active mailboxes, false for inactive mailboxes, and do not include the parameter to return active and inactive mailboxes.
      - name: workflowName
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The name of the workflow to filter on.
      - name: workflowType
        in: query
        required: false
        schema:
          type: string
          example: string
        description: This Type of the Workflow.
      - name: workflowActive
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: The Active flag of the Workflow of the EDI Mailbox. Set to true to return logs associated with active workflows, false for inactive workflows, and do not include the parameter to return active and inactive workflows or logs that are not associated with a workflow.
      responses:
        '200':
          description: Retrieved EDI Logs successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Log'
        '400':
          description: A validation error has occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '404':
