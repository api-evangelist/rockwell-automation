components:
  schemas:
    Mailbox:
      type: object
      description: API Resource for EDI Mailbox.
      properties:
        id:
          type: string
          format: uuid
          description: A unique identifier for the Mailbox.
          example: 00000000-0000-0000-0000-000000000000
        createdDate:
          type: string
          format: date-time
          description: The date on which the mailbox was created.
          example: '2026-10-20T12:03:11Z'
        createdById:
          type: string
          format: uuid
          description: The IAM Account ID of the user who created the mailbox.
          example: 00000000-0000-0000-0000-000000000000
        modifiedById:
          type: string
          format: uuid
          description: The IAM Account ID of the user who last modified the mailbox.
          example: 00000000-0000-0000-0000-000000000000
        modifiedDate:
          type: string
          format: date-time
          description: The date on which the mailbox was last modified.
          example: '2026-10-20T12:03:11Z'
        code:
          type: string
          description: The Mailbox Code of the EDI Mailbox, which identifies the user of the Mailbox.
          example: string
        supplierId:
          type: string
          format: uuid
          description: The ID of the Supplier.
          example: 00000000-0000-0000-0000-000000000000
        customerId:
          type: string
          format: uuid
          description: The ID of the Customer.
          example: 00000000-0000-0000-0000-000000000000
        shipFromBuildingId:
          type: string
          format: uuid
          description: The ID of the building from which the order will ship.
          example: 00000000-0000-0000-0000-000000000000
        note:
          type: string
          description: EDI Mailbox Note.
          example: string
        status:
          type: string
          description: EDI Mailbox Status.
          example: string
        name:
          type: string
          description: EDI Mailbox Name. Must be a unique value.
          example: string
        qualifier:
          type: string
          description: Indicates the type of data for the Mailbox Code value. Typically a two-character value. For example, 01 would be a DUNS Number.
          example: string
        use:
          type: string
          description: Indicates how the Mailbox will be used, such as Send or Send/Receive.
          example: string
        originCode:
          type: string
          description: The User Code mapped to outbound documents.
          example: string
        vendorCode:
          type: string
          description: The Vendor Code mapped to outbound documents.
          example: string
        destinationQualifier:
          type: string
          description: Indicates the type of data for the Destination Mailbox value. Typically a two-character value. For example, 01 would be a DUNS Number.
          example: string
        destinationMailbox:
          type: string
          description: The Destination value of the EDI Mailbox, which is the identifier of the trading partner associated to the mailbox.
          example: string
        destinationCode:
          type: string
          description: A Code used to identify the recipient at a trading partner, such as a specific DUNS Number.
          example: string
        elementSeparator:
          type: string
          description: Single character code used to parse data. This separates each element of a segment.
          example: string
        subelementSeparator:
          type: string
          description: Single character code used to parse data within an element.
          example: string
        segmentTerminator:
          type: integer
          format: int32
          description: The ASCII value used to end segments.
          example: 0
        transmissionCount:
          type: integer
          format: int32
          description: A counter to track document creation.
          example: 0
        isa01:
          type: string
          description: First element of the ISA segment.
          example: string
        isa02:
          type: string
          description: Second element of the ISA segment.
          example: string
        isa03:
          type: string
          description: Third element of the ISA segment.
          example: string
        isa04:
          type: string
          description: Fourth element of the ISA segment.
          example: string
        actualProcessorDuns:
          type: string
          description: DUNS number used for outbound documents.
          example: string
        shipFromCode:
          type: string
          description: Identifies the location for the shipment.
          example: string
        secondaryPlantCode:
          type: string
          description: Secondary plant code.
          example: string
        overrideUnitOfMeasureCode:
          type: string
          description: Use to override and specify the unit of measure for use on Outbound documents.
          example: string
        active:
          type: boolean
          description: Indicates whether the mailbox is active.
          example: false
        tradingPartnerName:
          type: string
          description: Trading Partner Name.
          example: string
    EdiNotification:
      type: object
      description: API Resource for an EDI Notification.
      properties:
        customerId:
          type: string
          format: uuid
          description: A unique identifier for the customer that the notification is being generated about.
          example: 00000000-0000-0000-0000-000000000000
        documentName:
          type: string
          description: 'The name of the EDI document that the notification is being generated about (ex: DELJIT).'
          example: string
        notificationBody:
          type: string
          description: The body of the notification.
          example: string
        notificationSubject:
          type: string
          description: The subject of the notification.
          example: string
        notificationType:
          type: string
          description: The type of the notification.
          example: string
        shipFromId:
          type: string
          format: uuid
          description: Optional unique identifier identifying the ship from location that the notification is being generated about.
          example: 00000000-0000-0000-0000-000000000000
    LogStatus:
      type: object
      description: API Resource for EDI Log Status.
      properties:
        status:
          type: string
          description: The status of the EDI Log.
          example: string
    LoadErrorType:
      type: object
      description: API Resource for EDI Load Error Type.
      properties:
        description:
          type: string
          description: The Load Error Type Description.
          example: string
    TransformedDataType:
      type: object
      description: API resource for transformed data
      properties:
        transformedData:
          type: string
          description: The base64 encoded transformed data representation of the EDI document
          example: string
    ReleaseSnapshot:
      type: object
      description: API Resource for EDI Release Snapshot
      properties:
        poLineId:
          type: string
          format: uuid
          description: The Resource Id of the PO Line record.
          example: 00000000-0000-0000-0000-000000000000
        shipToId:
          type: string
          format: uuid
          description: The Customer Address Resource Id ship to Address
          example: 00000000-0000-0000-0000-000000000000
        releaseNo:
          type: string
          description: The Release Number
          example: string
        processDate:
          type: string
          format: date-time
          description: The Process Date
          example: '2026-10-20T12:03:11Z'
        dueDate:
          type: string
          format: date-time
          description: The Due Date
          example: '2026-10-20T12:03:11Z'
        shipDate:
          type: string
          format: date-time
          description: The Ship Date
          example: '2026-10-20T12:03:11Z'
        releaseQuantity:
          type: integer
          format: int32
          description: The Release Quantity
          example: 0
        ediAccumQuantity:
          type: integer
          format: int32
          description: The EDI Accum Quantity
          example: 0
        accumQuantity:
          type: integer
          format: int32
          description: The Accum Quantity
          example: 0
        accumAuthorizedQuantity:
          type: integer
          format: int32
          description: The Accum Authorized Quantity
          example: 0
        isDaily:
          type: boolean
          description: Is Daily
          example: false
        isChange:
          type: boolean
          description: Is Change
          example: false
        originalEDIQuantity:
          type: integer
          format: int32
          description: The Original EDI Quantity
          example: 0
        lastShipperNo:
          type: string
          description: The Last Shipper Number
          example: string
        lastShipDate:
          type: string
          format: date-time
          description: The Last Ship Date
          example: '2026-10-20T12:03:11Z'
        lastShipQuantity:
          type: integer
          format: int32
          description: The Last Ship Quantity
          example: 0
    AddEdiLogRequest:
      type: object
      description: Request to add a new EDI Log.
      properties:
        documentNumber:
          type: string
          description: The document number provided in the document.
          example: string
        documentName:
          type: string
          description: The EDI document name for this document (i.e. 830, DELJIT).
          example: string
        interchangeNo:
          type: string
          description: The interchange no provided in the document.
          example: string
        mailboxId:
          type: string
          format: uuid
          description: The identifier for the mailbox that the EDI Log belongs to.
          example: 00000000-0000-0000-0000-000000000000
        status:
          type: string
          description: The status to set the added EDI log record to.
          example: string
    InboundReceive:
      type: object
      description: A object containing information about EDI objects to receive.
      properties:
        ediResourceIds:
          type: array
          description: A list of the EDI resource ids to receive.
          items:
            type: string
            format: uuid
    Problem:
      type: object
      description: API Resource for an EDI Problem.
      properties:
        problemType:
          type: string
          description: The type of problem
          example: string
        description:
          type: string
          description: A description of the problem.
          example: string
        problemDate:
          type: string
          format: date-time
          description: The date that the problem occurred.
          example: '2026-10-20T12:03:11Z'
        mailboxId:
          type: string
          format: uuid
          description: Optional unique identifier of the mailbox that the problem is associated with.
          example: 00000000-0000-0000-0000-000000000000
        shipperId:
          type: string
          format: uuid
          description: Optional unique identifier of the shipper that the problem is associated with.
          example: 00000000-0000-0000-0000-000000000000
        documentName:
          type: string
          description: Optional name of the document that the problem is associated with.
          example: string
    LogXmlRepresentation:
      type: object
      description: API Resource for EDI Log XML Representation.
      properties:
        xmlRepresentation:
          type: string
          description: The XML Representation of the EDI document. This is the canonical XML form.
          example: string
    ValidationResponse:
      type: object
      properties:
        code:
          type: string
          example: string
        message:
          type: string
          example: string
        errors:
          type: array
          items:
            type: object
            properties: {}
    UnitDto:
      type: object
      description: Basic unit information.
      properties:
        id:
          type: string
          format: uuid
          description: A unique identifier for the unit.
          example: 00000000-0000-0000-0000-000000000000
        unit:
          type: string
          description: The unique name of the actual unit.
          example: string
        denominatorUnit:
          type: string
          description: The Denominator label is used whenever the Unit is required in the denominator of an equation.
          example: string
        ediCode:
          type: string
          description: The code in an EDI document that represents the unit.
          example: string
        weightUnit:
          type: boolean
          description: True if this unit is used for weight.
          example: false
        pieceUnit:
          type: boolean
          description: True if this unit is used for Pieces.
          example: false
        hourUnit:
          type: boolean
          description: True if this unit is used for Hours.
          example: false
        dayUnit:
          type: boolean
          description: True if this unit is used for calendar Days.
          example: false
        weekUnit:
          type: boolean
          description: True if this unit is used for calendar Weeks.
          example: false
        monthUnit:
          type: boolean
          description: True if this unit is used for calendar Months.
          example: false
        yearUnit:
          type: boolean
          description: True if this unit is used for calendar Years.
          example: false
        unitStandard:
          type: string
          description: The standard of the unit.
          example: string
        areaUnit:
          type: boolean
          description: True if this unit is used for Area measurement.
          example: false
        reference:
          type: string
          description: Reference
          example: string
    LogicAppsWorkflowRun:
      type: object
      description: Information describing a particular run through the Logic Apps workflow.
      properties:
        runId:
          type: string
          description: A unique identifier for the Azure Logic Apps Workflow Run.
          example: string
        workflowType:
          type: string
          description: The Workflow Type that is being executed.
          example: string
      required:
      - runId
    LogTrackingNo:
      type: object
      description: Information describing a particular workflow run through.
      properties:
        trackingNo:
          type: string
          description: A unique identifier for Workflow Run (i.e. azure run_id or Boomi execution id).
          example: string
      required:
      - trackingNo
    AddEdiLogDocument:
      type: object
      description: Request to add an EDI document.
      properties:
        rawDocument:
          type: string
          description: The base 64 encoded raw EDI document to be parsed for the given standard and document type.
          example: string
        standard:
          type: string
          description: The EDI document standard for this document (i.e. X12, EDIFACT).
          example: string
    Log:
      type: object
      description: API Resource for EDI Log
      properties:
        id:
          type: string
          format: uuid
          description: A unique identifier for the Log.
          example: 00000000-0000-0000-0000-000000000000
        action:
          type: string
          description: Send or Receive. Send indicates that the document is an outbound document whereas receive indicates that the document is an inbound document.
          example: string
        status:
          type: string
          description: The Status of the EDI Log, such as Loaded or Accepted.
          example: string
        logDate:
          type: string
          format: date-time
          description: The date on which the document was created.
          example: '2026-10-20T12:03:11Z'
        mailboxId:
          type: string
          format: uuid
          description: The ID of the EDI Mailbox.
          example: 00000000-0000-0000-0000-000000000000
        documentName:
          type: string
          description: The name of the EDI document associated to the EDI Log entry.
          example: string
        ediKey:
          type: integer
          format: int32
          description: The EDI Key associated to the EDI Log entry.
          example: 0
        mailboxActive:
          type: boolean
          description: The Active flag of the EDI Mailbox.
          example: false
        customerId:
          type: string
          format: uuid
          description: The ID of the Customer.
          example: 00000000-0000-0000-0000-000000000000
        workflowType:
          type: string
          description: The Workflow Type of the Mailbox associated to the EDI Log entry.
          example: string
        workflowActive:
          type: boolean
          description: The Active flag of the Workflow of the EDI Mailbox.
          example: false
        workflowName:
          type: string
          description: The Workflow Name of the Mailbox associated to the EDI Log entry.
          example: string
        previewMode:
          type: boolean
          description: The Preview flag of the Document Setup.
          example: false
        pendingTransmission:
          type: boolean
          description: The Pending Transmission flag of the EDI Log entry.
          example: false
    Document:
      type: object
      description: API Resource for EDI Document.
      properties:
        id:
          type: string
          format: uuid
          description: A unique identifier for the Log.
          example: 00000000-0000-0000-0000-000000000000
        rawDocument:
          type: string
          description: Contains the segment data encoded in Base64.
          example: string
        segmentTerminator:
          type: string
          description: The ASCII value used to end segments.
          example: string
    LoadError:
      type: object
      description: API Resource for EDI Load Error.
      properties:
        id:
          type: string
          format: uuid
          description: A unique identifier for the EDI Log entry associated with this Error.
          example: 00000000-0000-0000-0000-000000000000
        loadErrorTypeDescription:
          type: string
          description: The Load Error Type Key.
          example: string
        mailboxId:
          type: string
          format: uuid
          description: The ID of the EDI Mailbox.
          example: 00000000-0000-0000-0000-000000000000
        partNumber:
          type: string
          description: The Item Part Number.
          example: string
        plantCode:
          type: string
          description: The Plant Code
          example: string
        poNumber:
          type: string
          description: The Purchase Order Number.
          example: string
        revision:
          type: string
          description: The Revision Number
          example: string
        customerName:
          type: string
          description: The Customer Name
          example: string
        ediDate:
          type: string
          format: date-time
          description: EDI Date.
          example: '2026-10-20T12:03:11Z'
        note:
          type: string
          description: A note with further information describing the error.
          example: string
        dockCode:
          type: string
          description: The Dock Code.
          example: string
        loadErrorMessage:
          type: string
          description: The Load Error Message
          example: string
  securitySchemes:
    PlexConnectApiKey:
      type: apiKey
      in: header
      name: X-Plex-Connect-Api-Key
      description: 'Subscription key (Consumer Key of an app created in the Plex Developer Portal). Source: https://developers.plex.com/getstarted'
