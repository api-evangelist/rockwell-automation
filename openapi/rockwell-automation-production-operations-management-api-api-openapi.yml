          type: string
          format: uuid
          description: UUID of the part operation that was produced.
          example: 00000000-0000-0000-0000-000000000000
        operationNumber:
          type: integer
          format: int32
          description: The Operation Number (sequence order) of the part Operation that was produced. 10 characters maximum.
          example: 0
