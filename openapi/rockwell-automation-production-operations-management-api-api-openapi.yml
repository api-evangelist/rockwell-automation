          type: string
          description: 'Part Number and Revision formatted with a separator. If the part has a revision, Plex returns the part number and the revision joined by the delimiter defined in the Part Rev Separator configuration (a system-wide value, up to 5 characters). If the part has no revision, only the part number is returned. Format: {partNumber}{partRevSeparator}{revision}.'
          example: string
