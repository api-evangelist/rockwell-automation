    ProductionHistorySummary:
      type: object
      description: A production record in Plex is the action of recording production of a product that results in depleting source material and advancing the product to the next operation. A single production record is created each time production is recorded. When Plex Production Tracking is implemented, production is recorded multiple times during a shift. For example, after a container is full or a job operation is completed, there may be a long list of production records. Production records do not include scrapped parts (scrapped using specific scrapping functions). Production records include parts produced and moved into a Plex container record, regardless of the status of that container record.
      properties:
        workcenterId:
          type: string
          format: uuid
          description: UUID of the workcenter where the production transaction was recorded.
          example: 00000000-0000-0000-0000-000000000000
        workcenterCode:
          type: string
          description: A short name associated to the workcenterID, and a unique code to reference the workcenter. This code shows up throughout the system, primarily on the Control Panel. 50 characters maximum.
          example: string
        totalQuantity:
          type: number
          format: double
          description: Total Quantity that was produced. Decimal with a maximum of 18 total digits, 3 of which can be after the decimal point (precision 18, scale 3).
          example: 0.1
        jobId:
          type: string
          format: uuid
          description: UUID of the production job that production was recorded against. Note that a production job is not necessary to record production. Another scheduling method such as kanban may have been used.
          example: 00000000-0000-0000-0000-000000000000
        jobNumber:
          type: string
          description: Job number, including prefix and suffix, associated to the jobID that production was recorded against. 20 characters maximum.
          example: string
        partId:
          type: string
          format: uuid
          description: UUID of the part that was produced.
