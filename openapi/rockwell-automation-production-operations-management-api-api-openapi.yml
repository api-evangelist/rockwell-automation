components:
  schemas:
    AssignLotRequest:
      type: object
      description: Request object for assigning a lot.
      properties:
        jobOpId:
          type: string
          format: uuid
          description: A unique identifier of a job operation.
          example: 00000000-0000-0000-0000-000000000000
        batchNo:
          type: string
          description: The batch number.
          example: string
        forceCreateNewLot:
          type: boolean
          description: A boolean flag indicating whether new lot creation should be forced.
          example: false
      required:
      - jobOpId
    SearchWorkcenterSetupsRequest:
      type: object
      description: Request to search for Workcenter Setups
      properties:
        workcenterIds:
          type: array
          description: List of Workcenter IDs used to filter search results
          items:
            type: string
            format: uuid
        workcenterCodes:
          type: array
          description: List of Workcenter Codes used to filter search results
          items:
            type: string
        workcenterTypes:
          type: array
          description: List of Workcenter Types used to filter search results
          items:
            type: string
        workcenterGroups:
          type: array
          description: List of Workcenter Groups used to filter search results
          items:
            type: string
    AddSourceInventoryRequest:
      type: object
      description: Request to add a container to source inventory.
      properties:
        loadFIFO:
          type: boolean
          description: Flag used to indicate what sort order the added container will be added with. If true, the container will be added to the front of the queue. If false, the container will be added to the back of the queue.
          example: false
        serialNo:
          type: string
          description: The serial no of a container.
          example: string
      required:
      - serialNo
    SearchWorkcenterSetupsResponse:
      type: object
      description: Response returned when performing a search for Workcenter Setups
      properties:
        id:
          type: string
          format: uuid
          description: A unique identifier of the workcenter.
          example: 00000000-0000-0000-0000-000000000000
        code:
          type: string
          description: A short name associated with the workcenter ID, and a unique code to reference the workcenter. This code displays throughout the system, primarily on the Control Panel. 50 characters max.
          example: string
        name:
          type: string
          description: A long name associated with the workcenter ID. 100 characters max.
          example: string
        type:
          type: string
          description: The workcenter type.
          example: string
        group:
          type: string
          description: The workcenter group.
          example: string
        statusId:
          type: string
          format: uuid
          description: A unique identifier of the workcenter status.
          example: 00000000-0000-0000-0000-000000000000
        statusDescription:
          type: string
          description: A workcenter status description.
          example: string
        jobId:
          type: string
          format: uuid
          description: A unique identifier of the production job.
          example: 00000000-0000-0000-0000-000000000000
        jobNumber:
          type: string
          description: The job number, including prefix and suffix, associated with the job ID.
          example: string
        jobOperationId:
          type: string
          format: uuid
          description: A unique identifier for the job operation.
          example: 00000000-0000-0000-0000-000000000000
        operationNumber:
          type: number
          format: double
          description: The operation number of the part operation.
          example: 0.1
        operationCode:
          type: string
          description: The operation code of the part operation. 30 characters max.
          example: string
        jobOperationQuantity:
          type: number
          format: double
          description: The quantity to be produced in this job operation.
          example: 0.1
        partId:
          type: string
          format: uuid
          description: A unique identifier of the part.
          example: 00000000-0000-0000-0000-000000000000
        partNumber:
          type: string
          description: The part number associated with the part ID.
          example: string
        partRevision:
          type: string
          description: 8 characters max. The part revision. A revision level represents a change or modification to a part or part drawing that is usually initiated through an engineering change request (ECR).
          example: string
        partNumberRevision:
          type: string
          description: Format {partNumber}{part rev separator}{revision}. The part number revision formatted with separator. If a part number has a revision, Plex will return the part number and the revision separated by the Part Rev Separator setting. A Part Rev Separator can be up to 5 characters long.
          example: string
        partName:
          type: string
          description: The name of the part.
          example: string
        jobOperationStatus:
          type: string
          description: The job operation status.
          example: string
        jobOperationQuantityCompleted:
          type: number
          format: double
          description: The quantity of parts produced at job operation.
          example: 0.1
        jobOperationQuantityBalance:
          type: number
          format: double
          description: The quantity of parts remaining to be produced at job operation.
          example: 0.1
        containerType:
          type: string
          description: The container type.
          example: string
        standardQuantity:
          type: number
          format: double
          description: Standard pack size for the Part Operation.
          example: 0.1
    RecordBatchProductionRequest:
      type: object
      description: Record production request.
      properties:
        batchId:
          type: string
          format: uuid
          description: A unique identifier of the batch.
          example: 00000000-0000-0000-0000-000000000000
        batchComponentQuantities:
          type: array
          description: List of Batch Component Sources.
          items:
            type: object
            description: Component source for a batch operation.
            properties: {}
        operatorId:
          type: string
          format: uuid
          description: A unique identifier of an IAM account used to indicate what user is recording production. If no value is provided the IAM account associated with the API Key will be used.
          example: 00000000-0000-0000-0000-000000000000
        quantity:
          type: number
          format: double
          description: Quantity to be depleted from source.
          example: 0.1
        lotId:
          type: string
          format: uuid
          description: A unique identifier of a lot that is being produced for.
          example: 00000000-0000-0000-0000-000000000000
        locationId:
          type: string
          format: uuid
          description: A unique identifier of a location that is being produced to.
          example: 00000000-0000-0000-0000-000000000000
        partId:
          type: string
          format: uuid
          description: A unique identifier of a part. If no SupplyItemId is provided, this is required.
          example: 00000000-0000-0000-0000-000000000000
        supplyItemId:
          type: string
          format: uuid
          description: A unique identifier of a supply item. If no PartId is provided, this is required.
          example: 00000000-0000-0000-0000-000000000000
      required:
      - batchId
      - quantity
    RequiredSourceInventory:
      type: object
      description: Status of source inventory that is required to record production against the setup job operation.
      properties:
        partId:
          type: string
          format: uuid
          description: A unique identifier for the part.
          example: 00000000-0000-0000-0000-000000000000
        partOperationId:
          type: string
          format: uuid
          description: A unique identifier for the part operation.
          example: 00000000-0000-0000-0000-000000000000
        supplyItemId:
          type: string
          format: uuid
          description: A unique identifier for a supply item.
          example: 00000000-0000-0000-0000-000000000000
        loaded:
          type: boolean
          description: Flag indicating if the required source inventory has been loaded.
          example: false
        totalLoaded:
          type: number
          format: double
          description: The quantity of the source inventory that has been loaded.
          example: 0.1
        totalYield:
          type: number
          format: double
          description: The total yield of the loaded source inventory.
          example: 0.1
        bomQuantity:
          type: number
          format: double
          description: The quantity of the source inventory that is required per unit of production.
          example: 0.1
        sourceType:
          type: string
          description: The source inventory type.
          example: string
        name:
          type: string
          description: The source inventory name.
          example: string
