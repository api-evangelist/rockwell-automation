    ProductionLineWorkcenter:
      type: object
      description: A workcenter in Plex is defined as an area where a complete operation happens. It may represent a single part operation or multiple part operations, a single piece of equipment, or multiple pieces of equipment. A workcenter could be a machine, such as a stamping press, or an area like an inspection or assembly area, or a combination of these. When determining what your workcenters will be, think of a workcenter as a place where a container of parts is advanced through a routing step.
      properties:
        workcenterId:
          type: string
          format: uuid
          description: The unique identifier assigned to the workcenter.
          example: 00000000-0000-0000-0000-000000000000
        workcenterCode:
          type: string
          description: 50 characters max. A short name associated to the workcenterID, and a unique code to reference the workcenter. This code shows up throughout the system, primarily on the Control Panel.
          example: string
        name:
          type: string
          description: 100 characters max. The full name associated to the workcenterID that is a more descriptive name for the Workcenter. Depending on your settings, this name can also display on the control panel and sequence board.
          example: string
        workcenterType:
          type: string
          description: 50 characters max. Setup table &quot;Workcenter Type&quot; (part.dbo.workcenter_type). Grouping of similar workcenters. The Workcenter Type influences how the workcenter behaves, but is also available as a filter in different places (control panel, production status, Workcenter log, sequence board).
          example: string
        workcenterGroup:
          type: string
          description: 50 characters max. Setup table &quot;Workcenter Group&quot; (part.dbo.workcenter_group). An optional grouping of similar workcenters. This is helpful when there are many workcenters that can be chosen from the Control Panel. If the Workcenter Group setting is on, the Control Panel will display the Workcenter Groups then once a group is chosen, the list of workcenters only in that group will display.
          example: string
        buildingId:
          type: string
          format: uuid
          description: The unique identifier of the building the workcenter is located in.
          example: 00000000-0000-0000-0000-000000000000
        buildingCode:
          type: string
          description: 50 characters max. A short name for the building.
          example: string
        productionLineStatusDriver:
          type: boolean
          description: True, if the workcenter is identified as the bottleneck in the production line.
          example: false
        addBy:
          type: string
          description: 101 characters max. The name of the plex user who added the production line workcenter.
          example: string
        addDateTime:
          type: string
          format: date-time
          description: The date and time the production line workcenter was added.
          example: '2026-10-20T12:03:17Z'
    ScrapHistory:
      type: object
      description: A Scrap Entry in Plex is the action of scrapping a specific quantity of component or produced part that results in removing that quantity out of inventory. Recording of scrap is performed using the dedicated Record Scrap functions in the Control Panel or in other standalone applications.
      properties:
        transactionDate:
          type: string
          format: date-time
          description: Date/Time Format YYYY-MM-DDThh:mm:ss.fffffffZ See Knowledge center topic &quot;Dates and Times&quot; for more information (KC path Platform &gt; Plex APIs &gt; HTTP Data Source API &gt; Dates and Times). The date and time on which the scrap transaction was recorded in Plex.
          example: '2026-10-20T12:03:16Z'
        scrapReason:
          type: string
          description: 50 characters max. Setup table &quot;Scrap Reason&quot; (part.dbo.scrap_reason). The reason code which indicates why the material or part was scrapped.
          example: string
        transactionType:
          type: string
          description: Possible values are &quot;Control Panel Scrap&quot; and &quot;Scrap&quot;. Scrapping a part being produced in Control Panel will be identified as Control Panel Scrap. Recording scrap using any other application will be identified as Scrap.
          example: string
        quantity:
          type: number
          format: double
          description: Decimal, (19,5) max characters. Quantity that was scrapped.
          example: 0.1
        workcenterId:
          type: string
          format: uuid
          description: UUID V4 format XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX. UUID of the workcenter where scrap was recorded.
          example: 00000000-0000-0000-0000-000000000000
        workcenterCode:
          type: string
          description: 50 characters max. A short name associated to the workcenterID, and a unique code to reference the workcenter. This code shows up throughout the system, primarily on the Control Panel.
          example: string
        jobId:
          type: string
          format: uuid
          description: UUID V4 format XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX. UUID of the production job that scrap was recorded against. Note that a production job is not necessary to record scrap. Another scheduling method such as kanban may have been used.
          example: 00000000-0000-0000-0000-000000000000
        jobCode:
          type: string
          description: 20 characters max. Job number, including prefix and suffix, associated to the jobID that scrap was recorded against.
          example: string
        partId:
          type: string
          format: uuid
          description: UUID V4 format XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX. UUID of the part that was scrapped.
          example: 00000000-0000-0000-0000-000000000000
        partNumber:
          type: string
          description: 100 characters max. Part Number associated to the partId that was scrapped. A short code or number to call the part. This value shows up throughout the system, so use something others will recognize. Acceptable Part Number characters include uppercase and lowercase letters (A-Z), numbers (0-9), and special characters such as dashes (-), underscores ( _ ), and spaces. Other characters may cause issues.
          example: string
        revision:
          type: string
          description: 8 characters max. Part Revision of the partID. A revision level represents a change or modification to a part or part drawing that is usually initiated through an engineering change request (ECR).
          example: string
        partNumberRevision:
          type: string
          description: Format {partNumber}{part rev separator}{revision}. Part Number and Revision formatted with separator. If a part number has a revision, Plex will return the part number and the revision separated by the Part Rev Separator setting. A Part Rev Separator can be up to 5 characters long.
          example: string
        partOperationId:
          type: string
          format: uuid
          description: UUID V4 format XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX. UUID of the part operation that was scrapped.
          example: 00000000-0000-0000-0000-000000000000
        operationNumber:
          type: integer
          format: int32
          description: 10 characters max. The Operation Number (sequence order) of the part Operation that was scrapped.
          example: 0
        operationCode:
          type: string
          description: 30 characters max. The Operation Code associated to the partOperationID.
          example: string
        serialNo:
          type: string
          description: 25 characters max. The Serial No of the Scrap/Rejection Container.
          example: string
