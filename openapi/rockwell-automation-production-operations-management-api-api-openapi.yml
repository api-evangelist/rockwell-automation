        required: false
        schema:
          type: string
          example: string
        description: 'The sort order method used to determine how to order scheduled jobs. If omitted from the request, the default value is SortOrder unless the &quot;Run Record SortOrder Use&quot; setting is enabled, in which case the default is StartDate. Sort order values are: SortOrder, StartDate, CompletionDate, ToolAssemblyNo, Job.'
