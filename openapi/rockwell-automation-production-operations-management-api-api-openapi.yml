    LaborHistory:
      type: object
      description: In Plex, time spent by shop floor operators is tracked when they clock into a workcenter's timeclock and select a Labor Cost Activity. When an operator changes the activity, prior activity closes and the new activity starts. Operators can manually close an open activity by clocking out, or Plex can automatically force a clock out if an operator forgets to do so manually at the end of a shift.
      properties:
        employee:
          type: string
          description: Format {Last Name}, {First Name} ({Department}) Example &quot;Smith, John (Quality)&quot;.&quot; The name of an employee associated to labor record.
          example: string
        employeeId:
          type: string
          format: uuid
          description: UUID V4 format XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX. UUID assigned to employee that is associated to labor record.
          example: 00000000-0000-0000-0000-000000000000
        accountId:
          type: string
          format: uuid
          description: UUID V4 format XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX. UUID assigned to an IAM account that is associated to labor record.
          example: 00000000-0000-0000-0000-000000000000
        costActivity:
          type: string
          description: 50 characters max. The type of manufacturing labor activity that was performed, such as Setup, Maintenance, Production. This is the Cost Sub Type configured in Cost Types Setup application.
          example: string
        workcenterId:
          type: string
          format: uuid
          description: UUID V4 format XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX. UUID of the workcenter where the labor transaction was recorded.
          example: 00000000-0000-0000-0000-000000000000
        workcenterCode:
          type: string
          description: 50 characters max. A short name associated to the workcenterID at which a labor transaction occurred.
          example: string
        jobId:
          type: string
          format: uuid
          description: UUID V4 format XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX. UUID of the production job that was loaded to the workcenter when labor record was created.
          example: 00000000-0000-0000-0000-000000000000
        jobCode:
          type: string
          description: 20 characters max. Job number, including prefix and suffix, associated to the jobID that was loaded to the workcenter when labor record was created.
          example: string
        partId:
          type: string
          format: uuid
          description: UUID V4 format XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX. UUID of the part that was being produced in the workcenter when the labor activity was recorded.
          example: 00000000-0000-0000-0000-000000000000
        partNumber:
          type: string
          description: 100 characters max. Part Number associated to the partId that was being produced in the workcenter when the labor activity was recorded. A short code or number to call the part. This value shows up throughout the system, so use something others will recognize. Acceptable Part Number characters include uppercase and lowercase letters (A-Z), numbers (0-9), and special characters such as dashes (-), underscores ( _ ), and spaces. Other characters may cause issues.
          example: string
        revision:
          type: string
          description: 8 characters max. Part Revision of the partID. A revision level represents a change or modification to a part or part drawing that is usually initiated through an engineering change request (ECR).
          example: string
        partNumberRevision:
          type: string
          description: Format {partNumber}{part rev separator}{revision}. Part Number and Revision formatted with separator. If a part number has a revision, Plex will return the part number and the revision separated by the Part Rev Separator setting. A Part Rev Separator can be up to 5 characters long.
          example: string
        partOperationId:
          type: string
          format: uuid
          description: UUID V4 format XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX. The UUID of the part operation that was being produced in the workcenter when the labor activity was recorded.
          example: 00000000-0000-0000-0000-000000000000
        operationNumber:
          type: integer
          format: int32
          description: 10 characters max. The Operation Number (sequence order) of the part Operation that was being produced in the workcenter when the labor activity was recorded.
          example: 0
        operationCode:
          type: string
          description: 30 characters max. The Operation Code associated to the partOperationID.
          example: string
        beginTime:
          type: string
          format: date-time
          description: Date/Time Format YYYY-MM-DDThh:mm:ss.fffffffZ See Knowledge center topic &quot;Dates and Times&quot; for more information (KC path Platform &gt; Plex APIs &gt; HTTP Data Source API &gt; Dates and Times). The start date and time of the activity.
          example: '2026-10-20T12:03:16Z'
        endTime:
          type: string
          format: date-time
          description: Date/Time Format YYYY-MM-DDThh:mm:ss.fffffffZ See Knowledge center topic &quot;Dates and Times&quot; for more information (KC path Platform &gt; Plex APIs &gt; HTTP Data Source API &gt; Dates and Times). The end date and time of the activity.
          example: '2026-10-20T12:03:16Z'
        duration:
          type: integer
          format: int32
          description: The duration of the labor record in minutes.
          example: 0
