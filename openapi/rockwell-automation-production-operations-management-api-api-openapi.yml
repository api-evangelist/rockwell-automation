          example: false
        workcenterGroupWorkcenters:
          type: array
          description: List of workcenter IDs belonging to the workcenter group associated with this workcenter status.
          items:
            type: string
            format: uuid
        linkedWorkcenterEvents:
          type: array
          description: List of workcenter event IDs linked to this status.
          items:
            type: string
            format: uuid
    ProductionHistory:
      type: object
      description: A production record in Plex is the action of recording production of a product that results in depleting source material and advancing the product to the next operation. A single production record is created each time production is recorded. When Plex Production Tracking is implemented, production is recorded multiple times during a shift. For example, after a container is full or a job operation is completed, there may be a long list of production records. Production records do not include scrapped parts (scrapped using specific scrapping functions). Production records include parts produced and moved into a Plex container record, regardless of the status of that container record.
      properties:
        transactionDate:
          type: string
          format: date-time
          description: The date and time on which the production transaction was recorded in Plex.
          example: '2026-10-20T12:03:16Z'
        workcenterId:
          type: string
          format: uuid
          description: The ID of the workcenter where the production transaction was recorded.
          example: 00000000-0000-0000-0000-000000000000
        workcenterCode:
          type: string
          description: A short name associated to the &quot;workcenterID&quot; and a unique code to reference the workcenter. This code shows up throughout the system, primarily on the Control Panel. 50 characters max.
          example: string
        serialNo:
          type: string
          description: The serial number of the container. 25 characters max.
          example: string
        lotNo:
          type: string
          description: The unique lot number. 25 characters max.
          example: string
        employeeId:
          type: string
          format: uuid
          description: The employee resource ID.
          example: 00000000-0000-0000-0000-000000000000
        employeeName:
          type: string
          description: The employee name using the Plex User Display Name format.
          example: string
        quantity:
          type: number
          format: double
          description: The quantity that was produced.
          example: 0.1
        jobId:
          type: string
          format: uuid
          description: The ID of the production job that production was recorded against. Note that a production job is not necessary to record production. Another scheduling method such as Kanban may have been used.
          example: 00000000-0000-0000-0000-000000000000
        jobCode:
          type: string
          description: The job number, including prefix and suffix, associated to the &quot;jobId&quot; that production was recorded against. 20 characters max.
          example: string
        jobNo:
          type: string
          description: The unique job number. 20 characters max.
          example: string
        partId:
          type: string
          format: uuid
          description: The ID of the part that was produced.
          example: 00000000-0000-0000-0000-000000000000
        partNumber:
          type: string
          description: The part number associated to the &quot;partId&quot; that was produced. Acceptable part number characters include uppercase and lowercase letters (A-Z), numbers (0-9), and special characters such as dashes (-), underscores ( _ ), and spaces. Other characters may cause issues.
          example: string
        revision:
          type: string
          description: The part revision of the &quot;partId&quot;. A revision represents a change or modification to a part or part drawing that is usually initiated through an engineering change request (ECR).
          example: string
        partNumberRevision:
          type: string
          description: 'The part number and revision formatted with separator. If a part number has a revision, Plex will return the part number and the revision separated by the Part Rev Separator setting. A Part Rev Separator can be up to 5 characters long. Format: {partNumber}{part rev separator}{revision}.'
          example: string
        partOperationId:
          type: string
          format: uuid
          description: The ID of the part operation.
          example: 00000000-0000-0000-0000-000000000000
        operationNumber:
          type: integer
          format: int32
          description: The operation number of the part operation.
          example: 0
        operationCode:
          type: string
          description: The operation code associated to the &quot;partOperationId&quot;. 30 characters max.
          example: string
        masterUnitNo:
          type: string
          description: The master unit number of the master unit. 10 characters max.
          example: string
        masterUnitId:
          type: string
          format: uuid
          description: The master unit resource ID.
          example: 00000000-0000-0000-0000-000000000000
        lotId:
          type: string
          format: uuid
          description: The lot resource ID.
          example: 00000000-0000-0000-0000-000000000000
        heatCode:
          type: string
          description: The heat code of the heat. 50 characters max.
          example: string
        heatNo:
          type: string
          description: The heat number of the heat. 30 characters max.
          example: string
        heatId:
          type: string
          format: uuid
          description: The material heat resource ID.
          example: 00000000-0000-0000-0000-000000000000
        unit:
          type: string
          description: The unit of measure for the operation. 20 characters max.
          example: string
        trackingNo:
          type: string
          description: The tracking number of the container. 50 characters max.
          example: string
        shelfDateTime:
          type: string
          format: date-time
          description: The shelf life date of the container.
          example: '2026-10-20T12:03:16Z'
        manufacturedDateTime:
          type: string
          format: date-time
          description: The date a lot was manufactured, either in Plex or by a supplier or subcontractor.
          example: '2026-10-20T12:03:16Z'
        bestByDateTime:
          type: string
          format: date-time
          description: The best-by date which represents the last date for consumption of products in a lot by consumers.
          example: '2026-10-20T12:03:16Z'
        useByDateTime:
          type: string
          format: date-time
          description: The last date to use a lot for production.
          example: '2026-10-20T12:03:16Z'
        sellByDateTime:
          type: string
          format: date-time
          description: The last date for the sale of a product in a lot to consumers.
          example: '2026-10-20T12:03:16Z'
    LotResponse:
      type: object
      description: A lot
      properties:
        id:
          type: string
          format: uuid
          description: A unique identifier of the lot.
          example: 00000000-0000-0000-0000-000000000000
        lotNo:
          type: string
          description: The lot number.
          example: string
    SetupJobRequest:
      type: object
      description: Setup Job Request
      properties:
        jobOperationId:
          type: string
          format: uuid
          description: A unique identifier of a job operation.
          example: 00000000-0000-0000-0000-000000000000
      required:
      - jobOperationId
    RecordVariableBOMProductionRequest:
      type: object
      description: Request object for recording variable BOM production.
      properties:
        sourceComponentQuantities:
          type: array
          description: The list of source components to add to the batch.
          items:
            type: object
            description: Request object for control panel source material.
            properties: {}
        quantity:
          type: number
          format: double
          description: The source component quantity.
          example: 0.1
        jobOpId:
          type: string
          format: uuid
          description: A unique identifier for the job op on the workcenter.
          example: 00000000-0000-0000-0000-000000000000
        completeContainer:
          type: boolean
          description: Flag indicating if the output container should be finalized.
          example: false
        partId:
          type: string
          format: uuid
          description: A unique identifier for a part.
          example: 00000000-0000-0000-0000-000000000000
        itemId:
          type: string
          format: uuid
          description: A unique identifier for a supply item.
          example: 00000000-0000-0000-0000-000000000000
      required:
      - sourceComponentQuantities
      - quantity
      - jobOpId
    ScrapHistorySummary:
      type: object
      description: A Scrap Entry in Plex is the action of scrapping a specific quantity of component or produced part that results in removing that quantity out of inventory. Recording of scrap is performed using the dedicated Record Scrap functions in the Control Panel or in other standalone applications.
      properties:
        partId:
          type: string
          format: uuid
          description: UUID of the part that was scrapped.
          example: 00000000-0000-0000-0000-000000000000
        partNumber:
          type: string
          description: Part Number associated to the partId that was scrapped. A short code or number to call the part. This value shows up throughout the system, so use something others will recognize. Acceptable Part Number characters include uppercase and lowercase letters (A-Z), numbers (0-9), and special characters such as dashes (-), underscores ( _ ), and spaces. Other characters may cause issues. 100 characters maximum.
          example: string
        revision:
          type: string
          description: Part Revision of the partID. A revision level represents a change or modification to a part or part drawing that is usually initiated through an engineering change request (ECR). 8 characters maximum.
          example: string
        partNumberRevision:
          type: string
          description: 'Part Number and Revision formatted with a separator. If the part has a revision, Plex returns the part number and the revision joined by the delimiter defined in the Part Rev Separator configuration (a system-wide value, up to 5 characters). If the part has no revision, only the part number is returned. Format: {partNumber}{partRevSeparator}{revision}.'
          example: string
        partOperationId:
          type: string
          format: uuid
          description: UUID of the part operation that was scrapped.
          example: 00000000-0000-0000-0000-000000000000
        operationCode:
          type: string
          description: The Operation Code associated to the partOperationID. 30 characters maximum.
          example: string
        serialNo:
          type: string
          description: The Serial No of the Scrap/Rejection Container. 50 characters maximum.
          example: string
        operationNumber:
          type: integer
          format: int32
          description: The Operation Number (sequence order) of the part Operation that was scrapped. 10 characters maximum.
          example: 0
        workcenterId:
          type: string
          format: uuid
          description: UUID of the workcenter where scrap was recorded.
          example: 00000000-0000-0000-0000-000000000000
        workcenterCode:
          type: string
          description: A short name associated to the workcenterID, and a unique code to reference the workcenter. This code shows up throughout the system, primarily on the Control Panel. 50 characters maximum.
          example: string
        jobId:
          type: string
          format: uuid
          description: UUID of the production job that scrap was recorded against. Note that a production job is not necessary to record scrap. Another scheduling method such as kanban may have been used.
          example: 00000000-0000-0000-0000-000000000000
        jobNumber:
          type: string
          description: Job number, including prefix and suffix, associated to the jobID that scrap was recorded against. 20 characters maximum.
          example: string
        scrapReason:
          type: string
          description: Setup table &quot;Scrap Reason&quot; (part.dbo.scrap_reason). The reason code which indicates why the material or part was scrapped. 50 characters maximum.
          example: string
        totalQuantity:
          type: number
          format: double
          description: Total Quantity that was scrapped. Decimal with a maximum of 19 total digits, 5 of which can be after the decimal point (precision 19, scale 5).
          example: 0.1
    SetWorkcenterStatus:
      type: object
      description: Query object used for updating a workcenter status.
      properties:
        workcenterStatusId:
          type: string
          format: uuid
          description: A unique identifier of a workcenter status.
          example: 00000000-0000-0000-0000-000000000000
        workcenterEventId:
          type: string
          format: uuid
          description: A unique identifier of a workcenter event.
          example: 00000000-0000-0000-0000-000000000000
        accountId:
          type: string
          format: uuid
          description: A unique identifier of a plex user. If no user is specified the user account associated with the API key will be used.
          example: 00000000-0000-0000-0000-000000000000
      required:
      - workcenterStatusId
  securitySchemes:
    PlexConnectApiKey:
      type: apiKey
      in: header
      name: X-Plex-Connect-Api-Key
      description: 'Subscription key (Consumer Key of an app created in the Plex Developer Portal). Source: https://developers.plex.com/getstarted'
