    Workcenter:
      type: object
      description: A workcenter in Plex is defined as an area where a complete operation happens. It may represent a single part operation or multiple part operations, a single piece of equipment, or multiple pieces of equipment. A workcenter could be a machine, such as a stamping press, or an area like an inspection or assembly area, or a combination of these. When determining what your workcenters will be, think of a workcenter as a place where a container of parts is advanced through a routing step.
      properties:
        workcenterId:
          type: string
          format: uuid
          description: The UUID assigned to the workcenter.
          example: 00000000-0000-0000-0000-000000000000
        workcenterCode:
          type: string
          description: 50 characters max. A short name associated to the workcenterID, and a unique code to reference the workcenter. This code shows up throughout the system, primarily on the Control Panel.
          example: string
        name:
          type: string
          description: 100 characters max. The full name associated to the workcenterID that is a more descriptive name for the Workcenter. Depending on your settings, this name can also display on the control panel and sequence board.
          example: string
        workcenterType:
          type: string
          description: 50 characters max. Setup table &quot;Workcenter Type&quot; (part.dbo.workcenter_type). Grouping of similar workcenters. The Workcenter Type influences how the workcenter behaves, but is also available as a filter in different places (control panel, production status, Workcenter log, sequence board).
          example: string
        workcenterGroup:
          type: string
          description: 50 characters max. Setup table &quot;Workcenter Group&quot; (part.dbo.workcenter_group). An optional grouping of similar workcenters. This is helpful when there are many workcenters that can be chosen from the Control Panel. If the Workcenter Group setting is on, the Control Panel will display the Workcenter Groups then once a group is chosen, the list of workcenters only in that group will display.
          example: string
        buildingId:
          type: string
          format: uuid
          description: UUID of the building the workcenter is located in.
          example: 00000000-0000-0000-0000-000000000000
        buildingCode:
          type: string
          description: 50 characters max. A short name for the building.
          example: string
        tankSilo:
          type: boolean
          description: Boolean flag to indicate whether the workcenter is a Tank/Silo.
          example: false
        productionLineId:
          type: string
          format: uuid
          description: The unique identifier for the production line associated with the workcenter.
          example: 00000000-0000-0000-0000-000000000000
        ipAddress:
          type: string
          description: The IP Address of the workcenter.
          example: string
        plcName:
          type: string
          description: The PLC Name of the workcenter.
          example: string
