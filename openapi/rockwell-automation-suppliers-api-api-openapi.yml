components:
  schemas:
    AddressDTO:
      type: object
      description: The model for supplier address.
      properties:
        id:
          type: string
          format: uuid
          description: A unique identifier for the supplier address. This will be automatically generated if omitted from the request.
          example: 00000000-0000-0000-0000-000000000000
        code:
          type: string
          description: This must be unique in the context of a supplier.
          example: string
        type:
          type: string
          description: 'Setup Table: Supplier_Address_Type.'
          example: string
        country:
          type: string
          example: string
        address:
          type: string
          example: string
        city:
          type: string
          example: string
        zip:
          type: string
          example: string
        state:
          type: string
          example: string
        main:
          type: boolean
          description: A supplier may have only one address designated as their Main address.
          example: false
        remit:
          type: boolean
          description: A supplier may have only one address designated as their Remit payment address.
          example: false
        phone:
          type: string
          example: string
        fax:
          type: string
          example: string
        email:
          type: string
          example: string
        alternateSupplierName:
          type: string
          example: string
        createdById:
          type: string
          format: uuid
          description: IAM Account ID
          example: 00000000-0000-0000-0000-000000000000
        createdDate:
          type: string
          format: date-time
          example: '2026-10-20T12:03:18Z'
        modifiedById:
          type: string
          format: uuid
          description: IAM Account ID
          example: 00000000-0000-0000-0000-000000000000
        modifiedDate:
          type: string
          format: date-time
          example: '2026-10-20T12:03:18Z'
    UpdateSupplierDTO:
      type: object
      description: The supplier model exposed for updating.
      properties:
        code:
          type: string
          description: The Supplier Code used in Plex to identify the supplier. This must be unique in the context of a tenant.
          example: string
        oldCode:
          type: string
          example: string
        name:
          type: string
          example: string
        language:
          type: string
          example: string
        category:
          type: string
          description: 'Setup Table: Supplier_Category'
          example: string
        status:
          type: string
          description: 'Setup Table: Supplier_Status'
          example: string
        type:
          type: string
          description: 'Setup Table: Supplier_Type'
          example: string
        parentSupplierId:
          type: string
          format: uuid
          description: The ID of a parent supplier.
          example: 00000000-0000-0000-0000-000000000000
        webAddress:
          type: string
          example: string
        contactNote:
          type: string
          example: string
        note:
          type: string
          example: string
      required:
      - code
      - language
      - status
    UpdateFinancialsDto:
      type: object
      description: The model for Supplier Financials.
      properties:
        dunsNo:
          type: string
          description: Free text field for DUNS Number.
          example: string
        paymentStatus:
          type: string
          description: Values come from the Payment_Status setup table.
          example: string
        paymentType:
          type: string
          description: Values come from the Payment Type screen.
          example: string
        bankRemittanceCode:
          type: string
          description: Values come from the Bank Remittance Codes on the Bank Account Detail form.
          example: string
        paymentSupplierId:
          type: string
          format: uuid
          description: The default value is the ID of the current supplier.
          example: 00000000-0000-0000-0000-000000000000
        taxId:
          type: string
          description: Free text field for the Tax ID.
          example: string
        taxIdType:
          type: string
          description: The Tax ID Type (i.e., EIN, SSN, QI-EIN, Undetermined).
          example: string
        bankId:
          type: string
          description: Free text field for the Bank ID.
          example: string
        bankRoutingNo:
          type: string
          description: Free text field for the Bank Routing Number.
          example: string
        bankAccountNo:
          type: string
          description: Free text field for the Bank Account Number.
          example: string
        bankName:
          type: string
          description: Free text field for the Bank Name.
          example: string
        bankAddress:
          type: string
          description: Free text field for the Bank Street Address.
          example: string
        bankCity:
          type: string
          description: Free text field for the Bank City.
          example: string
        bankState:
          type: string
          description: State the bank resides in.
          example: string
        bankCountry:
          type: string
          description: Country the bank resides in.
          example: string
        bankZipCode:
          type: string
          description: Zip Code of the bank.
          example: string
        swiftNo:
          type: string
          description: Free text field for SWIFT Number.
          example: string
        ibanNo:
          type: string
          description: Free text field for IBAN Number.
          example: string
        misc1099:
          type: boolean
          description: Defines the supplier as 1099. This displays the 1099 check box on supplier invoices. When enabled, supplier invoices are flagged as 1099 by default.
          example: false
        bankAccountNoBankRemittanceCode:
          type: string
          description: The Bank Account Number associated with the Bank Remittance Code.
          example: string
        bankAccountCurrencyCode:
          type: string
          description: The bank account's Currency Code.
          example: string
    SyncSupplierDTO:
      type: object
      description: The full Supplier resource structure to be added or updated.
      properties:
        id:
          type: string
          format: uuid
          description: A unique identifier for the supplier address. This will be automatically generated if omitted from the request.
          example: 00000000-0000-0000-0000-000000000000
        code:
          type: string
          description: This must be unique in the context of a supplier.
          example: string
        oldCode:
          type: string
          example: string
        name:
          type: string
          example: string
        language:
          type: string
          example: string
        category:
          type: string
          description: 'Setup Table: Supplier_Category'
          example: string
        status:
          type: string
          description: 'Setup Table: Supplier_Status'
          example: string
        type:
          type: string
          description: 'Setup Table: Supplier_Address_Type.'
          example: string
        parentSupplierId:
          type: string
          format: uuid
          description: The ID of a parent supplier.
          example: 00000000-0000-0000-0000-000000000000
        webAddress:
          type: string
          example: string
        contactNote:
          type: string
          example: string
        note:
          type: string
          example: string
        financials:
          $ref: '#/components/schemas/UpdateFinancialsDTO'
        purchasingDefaults:
          $ref: '#/components/schemas/UpdatePurchasingDefaultsDTO'
        addresses:
          type: array
          description: A list of supplier addresses.
          items:
            type: object
            description: The supplier address model exposed for adding.
            properties: {}
        dunsNo:
          type: string
          description: Free text field for DUNS Number.
          example: string
        paymentStatus:
          type: string
          description: Values come from the Payment_Status setup table.
          example: string
        paymentType:
          type: string
          description: Values come from the Payment Type screen.
          example: string
