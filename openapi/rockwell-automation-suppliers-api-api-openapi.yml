        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:18Z'
      responses:
        '200':
          description: The query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressDTO'
        '404':
          description: The supplier was not found.
      x-source: https://developers.plex.com/api/documentation/suppliers-api/list-supplier-addresses
