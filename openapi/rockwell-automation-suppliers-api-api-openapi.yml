tags:
- name: Suppliers API
  description: The Suppliers API is used to manage supplier master data, including financial information, addresses, and purchasing information.
paths:
  /mdm/v1/suppliers/{supplierId}/addresses:
    post:
      operationId: createSupplierAddress
      summary: Create Supplier Address
      tags:
      - Suppliers API
      description: Create an address for a supplier.
      parameters:
      - name: supplierId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAddressDTO'
      responses:
        '201':
          description: The supplier address was successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressDTO'
        '400':
          description: A validation error has occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '404':
          description: The supplier resource was not found.
      x-source: https://developers.plex.com/api/documentation/suppliers-api/create-supplier-address
    get:
      operationId: listSupplierAddresses
      summary: List Supplier Addresses
      tags:
      - Suppliers API
      description: List supplier addresses by query parameters.
      parameters:
      - name: supplierId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
      - name: id
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: A list of supplier address IDs.
      - name: code
        in: query
        required: false
        schema:
          type: string
          example: string
        description: This must be unique in the context of a supplier.
      - name: createdById
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: IAM Account ID
      - name: createdDateBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:18Z'
      - name: createdDateEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:18Z'
      - name: modifiedById
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: IAM Account ID
      - name: modifiedDateBegin
