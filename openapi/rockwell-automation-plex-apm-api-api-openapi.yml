components:
  schemas:
    AssetDataDTO:
      type: object
      properties:
        receivedISOTimestamp:
          type: string
          format: date-time
          description: ISO Timestamp of the data
          example: '2020-01-01T12:30:00+00:00'
        receivedUnixTimestamp:
          type: integer
          format: int64
          description: 13 digit UNIX timestamp of the data
          example: 1577836800000
        source:
          type: string
          description: Source of the data.
          example: Gateway Name
        gatewayId:
          type: string
          description: Gateway Identifier
          example: 14cec83f-0b7a-43a5-acff-4fa98d606918
        asset:
          type: string
          description: If the asset has a name, the name is returned else the asset code is returned
          example: Asset Name
        tagName:
          type: string
          description: Tag Name
          example: Tag Name
        tagAlias:
          type: string
          description: Tag Alias
          example: Tag Alias
        value:
          type: number
          format: double
          description: Value. NaN if not a valid number
          example: -1.79
        quality:
          type: string
          description: Quality of the data - Good/Bad
          example: Bad
    ErrorResponse:
      type: object
      properties:
        httpStatusCode:
          type: integer
          format: int32
          example: 0
        code:
          type: string
          example: string
        message:
          type: string
          example: string
    LatestTagDataResponse:
      type: object
      properties:
        assetNames:
          type: string
          description: Asset Name.
          example: Extrudeuse
        assetCodes:
          type: string
          description: Asset Code.
          example: EM-1
        gatewayNames:
          type: string
          description: Gateway Name.
          example: Extruder GW
        gatewayId:
          type: string
          description: Gateway Id
          example: a9a68bff-b6ed-47ad-b130-a991dd7278ce
        value:
          type: string
          example: '20'
        tagNames:
          type: string
          description: Tag Name
          example: Warehouse.Temperature
        tagAlias:
          type: string
          description: Tag Alias
          example: Warehouse.Temperature
        quality:
          type: string
          description: Quality
          example: 'True'
        severity:
          type: string
          description: Severity
          example: Low
        streamType:
          type: string
          description: Stream Type
          example: Continuous
        dataTypeNames:
          type: string
          description: DataType Names
          example: Numerical
        receivedISOTimestamp:
          type: string
          description: Received ISO Timestamp
          example: '2022-08-24T06:46:16.501Z'
        unitName:
          type: string
          description: Unit Name
          example: Temperature
    ValidationResponse:
      type: object
      properties:
        code:
          type: string
          example: string
        message:
          type: string
          example: string
        errors:
          type: array
          items:
            type: object
            properties: {}
    AssetRequest:
      type: object
      properties:
        enabled:
          type: boolean
          description: Returns true if the asset is currently marked as active
          example: true
        assetNames:
          type: string
          description: Asset Names.
          example: TurretCNC_Asset
        assetCodes:
          type: string
          description: Asset Codes.
          example: TurretCNC_Asset
        assetSerialNumber:
          type: string
          description: The serial number of a physical asset
          example: TurretCNC_Asset
        assetDescription:
          type: string
          description: Descriptions
          example: TurretCNC_Asset
        gatewayName:
          type: string
          description: Gateway Names
          example: TurretGateway
        gatewayId:
          type: string
          description: GatewayIds
          example: d8bedb27-eadb-424b-a400-0dd22372d405
        fiixSiteName:
          type: string
          description: Fiix Site Names
          example: UK
        fiixAssetName:
          type: string
          description: Fiix Asset Names
          example: BoringMac
        plexMaintenanceEquipmentId:
          type: string
          description: Plex Maintenance Equipment Ids
          example: TurretCNC
        bridgeAttributes:
          type: string
          description: Asset Bridge Attribute Name
          example: '{"pmc Workcenter": "Oven - IoT"}'
        attributes:
          type: string
          description: Asset Attribute Name
          example: '[ { "asset Type": ["Engine Lathe","Baking Machine"], "brand": ["Brand X","Amada"], "location": [], "manufacturer": [], "model Number": [], "sub-location": ["East"], "zone": [] }]'
    ElapsedTimeAssetResponse:
      type: object
      description: Elapsed time results grouped by assets
      properties:
        assetCode:
          type: string
          description: Asset code
          example: AssetCode01
        results:
          type: array
          items:
            type: object
            properties: {}
    AssetStatusDTO:
      type: object
      properties:
        receivedISOTimestamp:
          type: string
          format: date-time
          description: ISO Timestamp of the event
          example: '2020-01-01T12:30:00+00:00'
        receivedUnixTimestamp:
          type: integer
          format: int64
          description: 13 digit UNIX timestamp of the event
          example: 1577836800000
        source:
          type: string
          description: Source of the event. &quot;Complex Event Processor&quot; in case of events generated by CEP
          example: Gateway Name
        gatewayId:
          type: string
          description: Gateway Identifier. In case of events generated by Complex Event Processor, this will be the gateway identifier of the gateway that sent the numerical data which caused the event.
          example: 14cec83f-0b7a-43a5-acff-4fa98d606918
        asset:
          type: string
          description: If the asset has a name, the name is returned else the asset code is returned
          example: Asset Name
        tagName:
          type: string
          description: Tag Name
          example: Tag Name
        tagAlias:
          type: string
          description: Tag Alias
          example: Tag Alias
        eventType:
          type: string
          description: Event Type - Problem, Abnormal etc.
          example: Problem
        state:
          type: string
          description: State of the event - True/False
          example: 'True'
        eventReason:
          type: string
          description: Event Reason
          example: Power Failure
        severity:
          type: string
          description: Severity of the event. High, Medium etc
          example: High
        quality:
          type: string
          description: Quality of the event - Good/Bad
          example: Bad
    ElapsedTimeTagResponse:
      type: object
      description: Elapsed time results grouped by tags
      properties:
        tagName:
          type: string
          description: Tag Name
          example: TagName01
        results:
          type: array
          items:
            type: object
            properties: {}
  securitySchemes:
    PlexConnectApiKey:
      type: apiKey
      in: header
      name: X-Plex-Connect-Api-Key
      description: 'Subscription key (Consumer Key of an app created in the Plex Developer Portal). Source: https://developers.plex.com/getstarted'
