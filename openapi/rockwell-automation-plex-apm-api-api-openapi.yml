  /cm/exhaust/v1/event/asset/elapsed-time:
    get:
      operationId: getElapsedTimeByAssets
      summary: Get Elapsed Time By Assets
      tags:
      - Plex APM API
      description: Returns event elapsed time grouped by assets based on asset code and tag name parameters within the provided time range. Optionally, event types can be provided to further filter the response. Maximum data points fetched has a limit of 100000 data points for the given time range.
      parameters:
      - name: startDateTime
        in: query
        required: true
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:14Z'
        description: 'Start date-time for the query. The valid date-time in UTC format is: YYYY-MM-DDThh:mm:ss.fffffffZ. Future date-time is not allowed.'
      - name: endDateTime
        in: query
        required: true
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:14Z'
        description: 'End date-time for the query. The valid date-time in UTC format is: YYYY-MM-DDThh:mm:ss.fffffffZ. Future date-time is not allowed.'
      - name: assetCodes
        in: query
        required: true
        schema:
          type: string
          example: string
        description: Comma separated list of asset codes for which event elapsed time records are required. Complete match is required. Asset codes are case-sensitive. An error response will be given when provided asset codes are invalid.
      - name: tagNames
        in: query
        required: false
        schema:
          type: string
          example: string
        description: Comma separated list of tag names for which event elapsed time records are required. Complete match is required. Tag names are case-sensitive. An error response will be given when provided tag names are invalid.
      - name: eventTypes
        in: query
        required: false
        schema:
          type: string
          example: string
        description: Comma separated list of event Types for which event elapsed time records are required. Valid values are Problem, Abnormal, Action Required, Maintenance, InCycle, Idle, Off and Other.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElapsedTimeAssetResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-source: https://developers.plex.com/api/documentation/plex-apm-api/get-elapsed-time-by-assets
