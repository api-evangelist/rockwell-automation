openapi: 3.2.0
info:
  title: Plex (Rockwell Automation) Connect Plex APM API
  version: '2026-10-20'
  description: Plex Smart Manufacturing Platform REST APIs, converted mechanically from the structured operation documents the Plex Developer Portal (developers.plex.com, a Rockwell Automation property) serves at /api/documentation/{api}/{operation}. No operations were authored by hand.
  x-generated-from: provider-documentation-json
  x-source: https://developers.plex.com/api/documentation/info
servers:
- url: https://connect.plex.com
  description: Production
- url: https://test.connect.plex.com
  description: Test (from https://developers.plex.com/api/sandbox/url)
security:
- PlexConnectApiKey: []
tags:
- name: Plex APM API
  description: The 'Plex APM API' is used to fetch equipment(assets) and parameters(tags) data from Plex APM(IIoT).
paths:
  /cm/exhaust/v1/assets:
    get:
      operationId: getAssetList
      summary: Get Asset List
      tags:
      - Plex APM API
      description: Returns list of assets(equipments) configured in Plex APM.
      parameters:
      - name: enabled
        in: query
        required: false
        schema:
          type: string
          example: string
        description: True/False and it accepts either one. In case you want to fetch all assets keep this parameter blank.
      - name: assetNames
        in: query
        required: false
        schema:
          type: string
          example: string
        description: Comma separated list of Asset names for which Asset records are required. Complete match is required. Invalid asset codes will be ignored and no records will be returned for them.
      - name: assetCodes
        in: query
        required: false
        schema:
          type: string
          example: string
        description: Comma separated list of Asset codes for which status records are required. Complete match is required. Invalid asset codes will be ignored and no records will be returned for them.
      - name: assetSerialNumbers
        in: query
        required: false
        schema:
          type: string
          example: string
        description: Comma separated list of Asset Serial Numbers for which assets records are required. Complete match is required. Invalid Asset Serial Numbers will be ignored and no records will be returned for them.
      - name: descriptions
        in: query
        required: false
        schema:
          type: string
          example: string
        description: Comma separated list of Descriptions for which Asset records are required. Complete match is required.
      - name: gatewayIds
        in: query
        required: false
        schema:
          type: string
          example: string
        description: Comma separated list of Gateway Ids for which Asset records are required. Complete match is required. Invalid asset codes will be ignored and no records will be returned for them.
      - name: gatewayNames
        in: query
        required: false
        schema:
          type: string
          example: string
        description: Comma separated list of Gateway Names for which Asset records are required. Complete match is required. Invalid Gateway Names will be ignored and no records will be returned for them.
      - name: fiixSiteNames
        in: query
        required: false
        schema:
          type: string
          example: string
        description: Comma separated list of Fiix Site Names for which Asset records are required. Complete match is required. Invalid Fiix Site Names will be ignored and no records will be returned for them.
      - name: fiixAssetNames
        in: query
        required: false
        schema:
          type: string
          example: string
        description: Comma separated list of Fiix Asset Names for which Asset records are required. Complete match is required. Invalid Fiix Asset Names will be ignored and no records will be returned for them.
      - name: plexMaintenanceEquipmentIds
        in: query
        required: false
        schema:
          type: string
          example: string
        description: Comma separated list of Plex Maintenance EquipmentIds for which Asset records are required. Complete match is required. Invalid Plex Maintenance EquipmentIds will be ignored and no records will be returned for them.
      - name: assetBridgeAttributeName
        in: query
        required: false
        schema:
          type: string
          example: string
        description: Comma separated list of Asset Bridge Attribute Name for which Asset records are required. Complete match is required. Invalid Asset Bridge Attribute Name will be ignored and no records will be returned for them.
      - name: bridgeAttributeValues
        in: query
        required: false
        schema:
          type: string
          example: string
        description: Comma separated list of Bridge Attribute Values for which Asset records are required. Complete match is required. Invalid Bridge Attribute Values will be ignored and no records will be returned for them.
      - name: assetAttributeName
        in: query
        required: false
        schema:
          type: string
          example: string
        description: Comma separated list of Asset Attribute Name for which Asset records are required. Complete match is required. Invalid Asset Attribute Name will be ignored and no records will be returned for them.
      - name: assetAttributeValues
        in: query
        required: false
        schema:
          type: string
          example: string
        description: Comma separated list of Asset Attribute Values for which Asset records are required. Complete match is required. Invalid asset codes will be ignored and no records will be returned for them.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetRequest'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-source: https://developers.plex.com/api/documentation/plex-apm-api/get-asset-list
  /cm/exhaust/v1/asset-data-points:
    get:
      operationId: getAssetNumericalData
      summary: Get Asset Numerical Data
      tags:
      - Plex APM API
      description: Returns the numerical data for an asset based on the query parameters.
      parameters:
      - name: startDate
        in: query
        required: true
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:14Z'
        description: 'Start datetime for the query. Valid format: YYYY-MM-DDThh:mm:ss.fffffffZ'
      - name: endDate
        in: query
        required: true
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:14Z'
        description: 'End datetime for the query. Valid format: YYYY-MM-DDThh:mm:ss.fffffffZ'
      - name: assetCodes
        in: query
        required: false
        schema:
          type: string
          example: string
        description: Comma separated list of Asset codes for which status records are required. Complete match is required. Invalid asset codes will be ignored and no records will be returned for them.
      - name: tagNames
        in: query
        required: false
        schema:
          type: string
          example: string
        description: Comma separated list of tag names for which status records are required. Complete match is required. Invalid tag names will be ignored and no records will be returned for them.
      - name: daysOfTheWeek
        in: query
        required: false
        schema:
          type: string
          example: string
        description: 'Comma separated list of Days of the week to include in the result. Valid values: Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday'
      - name: periodStartTime
        in: query
        required: false
        schema:
          type: string
          example: string
        description: Start period of the results to be returned in HH:mm:ss format. Should be used along with periodEndTime. Example- '08:00:00'
      - name: periodEndTime
        in: query
        required: false
        schema:
          type: string
          example: string
        description: End period of the results to be returned in HH:mm:ss format. Should be used along with periodStartTime. Example- '16:00:00'
      - name: quality
        in: query
        required: false
        schema:
          type: string
          example: string
        description: Comma separated list of Event quality for which status records are required. Valid values are Good/Bad
      - name: _sortOrder
        in: query
        required: false
        schema:
          type: string
          example: string
        description: 'Sort order of status records by timestamp. Valid values: asc/desc. Default: desc'
      - name: _limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          example: 0
        description: Top N records to return. Do not pass or pass 0 to return maximum allowed records (100,000)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetDataDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-source: https://developers.plex.com/api/documentation/plex-apm-api/get-asset-numerical-data
