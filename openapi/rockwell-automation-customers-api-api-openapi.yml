      - name: code
        in: query
        required: false
        schema:
          type: string
          example: string
      - name: quoteTo
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: If true, this address may be used for customer quotes.
      - name: shipTo
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: If true, this address may be used for customer shipping.
      - name: billTo
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: If true, this address may be used for customer invoices.
      - name: remitTo
        in: query
