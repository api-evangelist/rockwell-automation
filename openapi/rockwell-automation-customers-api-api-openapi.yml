        poolAddressId:
          type: string
          format: uuid
          description: The customer address ID to be used for pooling.
          example: 00000000-0000-0000-0000-000000000000
        oldCustomerNo:
          type: string
          example: string
        active:
          type: boolean
          example: false
        phone:
          type: string
          example: string
        fax:
          type: string
          example: string
        email:
          type: string
          example: string
        name:
