        invoiceMailboxId:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        billAndHoldMailboxId:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        createInvoice:
          type: boolean
          example: false
        suppressAsn:
          type: boolean
          example: false
        suppressEdiLoad:
          type: boolean
          example: false
        ignoreAccums:
          type: boolean
          example: false
        serviceShipment:
          type: boolean
          example: false
        shipTime:
          type: integer
          format: int32
          example: 0
        shipTimeUnit:
          type: string
          example: string
    CustomerAddressDTO:
      type: object
      description: The all-inclusive domain model for a [object Object].
      properties:
        id:
          type: string
          format: uuid
          description: A unique identifier for the Customer Address. This will be automatically generated if omitted from the request.
          example: 00000000-0000-0000-0000-000000000000
        code:
          type: string
          example: string
        note:
          type: string
          example: string
        quoteTo:
          type: boolean
          description: If true, this address may be used for customer quotes.
          example: false
        shipTo:
          type: boolean
          description: If true, this address may be used for customer shipping.
          example: false
        billTo:
          type: boolean
          description: If true, this address may be used for customer invoices.
          example: false
        billToAddressId:
          type: string
          format: uuid
          description: The customer address ID to be used for customer billing.
          example: 00000000-0000-0000-0000-000000000000
        remitTo:
          type: boolean
          description: If true, this address may be used for remittance.
          example: false
        thirdPartyShipTo:
          type: boolean
          description: If true, this is a valid third-party shipping address.
          example: false
        thirdPartyShipToAddressId:
          type: string
          format: uuid
          description: The customer address ID to be used for third-party shipping.
          example: 00000000-0000-0000-0000-000000000000
        pool:
