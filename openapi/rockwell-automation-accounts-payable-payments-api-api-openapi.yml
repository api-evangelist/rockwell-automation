tags:
- name: Accounts Payable Payments API
  description: The Accounts Payable Payments API is used to retrieve Accounts Payable Payments, Accounts Payable Payment Lines and Accounts Payable Payment Checks data.
paths:
  /accounting/v1/ap-payments/{id}:
    get:
      operationId: getApPayment
      summary: Get AP Payment
      tags:
      - Accounts Payable Payments API
      description: Retrieves an AP Payment by ID.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The Accounts Payable Payment resource id.
      responses:
        '200':
          description: The query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountsPayablePaymentDto'
        '404':
          description: The resource does not exist.
      x-source: https://developers.plex.com/api/documentation/accounts-payable-payments-api/get-ap-payment
  /accounting/v1/ap-payments:
    get:
      operationId: listApPayments
      summary: List AP Payments
      tags:
      - Accounts Payable Payments API
      description: List AP payments based on specified parameters.
      parameters:
      - name: id
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the AP Payment.
      - name: paymentNumber
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The AP payment number.
      - name: periodDisplayBegin
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The starting period used to return AP payment records.
      - name: periodDisplayEnd
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The ending period used to return AP payment records.
      - name: transactionDateBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:00Z'
        description: The start date used to return AP payment transaction records during a period.
      - name: transactionDateEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:00Z'
        description: The end date used to return AP payment transaction records during a period.
      - name: createdDateBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:00Z'
        description: The beginning date used to return AP payments created within a time frame.
      - name: createdDateEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:00Z'
        description: The ending date used to return AP payments created within a time frame.
      - name: booked
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: Specify AP payment is booked.
      responses:
        '200':
          description: The query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountsPayablePaymentDto'
      x-source: https://developers.plex.com/api/documentation/accounts-payable-payments-api/list-ap-payments
components:
  schemas:
    AccountsPayablePaymentDto:
      type: object
      description: The Accounts Payable Payment model.
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the AP payment.
          example: 00000000-0000-0000-0000-000000000000
        paymentNumber:
          type: string
          description: The AP payment number.
          example: string
        supplierId:
          type: string
          format: uuid
          description: The ID of the AP supplier.
          example: 00000000-0000-0000-0000-000000000000
        supplierCode:
          type: string
          description: The AP supplier code.
          example: string
        amount:
          type: number
          format: double
          description: AP payment amount.
          example: 0.1
        periodDisplay:
          type: string
          description: The period in which an AP payment is recorded.
          example: string
        transactionDate:
          type: string
          format: date-time
          description: The date on which an AP payment transaction was recorded.
          example: '2026-10-20T12:03:00Z'
        note:
          type: string
          description: Note added to an AP payment.
          example: string
        createdById:
          type: string
          format: uuid
          description: The ID of the user who created the record.
          example: 00000000-0000-0000-0000-000000000000
        createdDate:
          type: string
          format: date-time
          description: The date on which an AP payment was created.
          example: '2026-10-20T12:03:00Z'
        modifiedById:
          type: string
          format: uuid
          description: The ID of the user who last modified the record.
          example: 00000000-0000-0000-0000-000000000000
        modifiedDate:
          type: string
          format: date-time
          description: The date on which an AP payment was modified.
          example: '2026-10-20T12:03:00Z'
        paymentType:
          type: string
          description: AP Payment Type.
          example: string
        status:
          type: string
          description: AP payment status.
          example: string
        checkDate:
          type: string
          format: date-time
          description: Date the AP payment check was issued.
          example: '2026-10-20T12:03:00Z'
        booked:
          type: boolean
          description: Specify AP payment is booked.
          example: false
        cleared:
          type: string
          description: 'Specify AP payment has cleared.

            Uncleared - the transaction is not part of a bank reconciliation

            Pending - the transaction is part of a saved bank reconciliation that has not yet been finalized

            Cleared - the transaction is part of a finalized bank reconciliation and has cleared the relevant bank account'
          example: string
        clearDate:
          type: string
          format: date-time
          description: Date the AP payment cleared.
          example: '2026-10-20T12:03:00Z'
        clearPeriod:
          type: string
          description: Period in which the AP payment cleared.
          example: string
        clearedAmount:
          type: number
          format: double
          description: AP payment cleared amount.
          example: 0.1
        void:
          type: boolean
          description: Specify AP payment has been voided.
          example: false
        voucherNo:
          type: string
          description: AP payment voucher number.
          example: string
        checkNote:
          type: string
          description: Note added to an AP payment check.
          example: string
        mailedDate:
          type: string
          format: date-time
          description: Date on which AP payment check was mailed.
          example: '2026-10-20T12:03:00Z'
        exchangeRate:
          type: number
          format: double
          description: AP payment exchange rate.
          example: 0.1
        currencyCode:
          type: string
          description: AP payment currency code.
          example: string
        lines:
          type: array
          description: List of AP Payment lines
          items:
            type: object
            description: The Accounts Payable Payment Line model.
            properties: {}
  securitySchemes:
    PlexConnectApiKey:
      type: apiKey
      in: header
      name: X-Plex-Connect-Api-Key
      description: 'Subscription key (Consumer Key of an app created in the Plex Developer Portal). Source: https://developers.plex.com/getstarted'
