paths:
  /accounting/v1/general-ledger-activity/ap-invoices:
    get:
      operationId: listGlTransactionLinesForApInvoices
      summary: List GL Transaction Lines For AP Invoices
      tags:
      - General Ledger Transactions API
      description: List GL transaction lines for AP invoices based on specified parameters.
      parameters:
      - name: accountId
        in: query
        required: true
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: A unique identifier for the GL transaction account.
      - name: periodDisplay
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The GL transaction fiscal period.
      - name: transactionDateBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:12Z'
        description: The beginning date on which a GL transaction was recorded.
      - name: transactionDateEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:12Z'
        description: The end date on which a GL transaction was recorded.
      responses:
        '200':
          description: Query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralLedgerActivityAPInvoiceDto'
        '400':
          description: The validation result for an invalid account ID.
      x-source: https://developers.plex.com/api/documentation/general-ledger-transactions-api/list-gl-transaction-lines-for-ap-invoices
