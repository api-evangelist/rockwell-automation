        active:
          type: boolean
          example: false
        averageCost:
          type: number
          format: double
          description: Average cost of a Supply Item.
          example: 0.1
        responsiblePersonId:
          type: string
          format: uuid
          description: The ID of the person responsible for the Supply Item.
          example: 00000000-0000-0000-0000-000000000000
        vendorManaged:
