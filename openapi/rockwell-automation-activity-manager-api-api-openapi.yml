      summary: Create Activity
      tags:
      - Activity Manager API
      description: Add an activity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddActivityRequestDto'
      responses:
        '201':
          description: The record was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddActivityResponseDto'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddActivityResponseDto'
      x-source: https://developers.plex.com/api/documentation/activity-manager-api/create-activity
    get:
      operationId: listActivities
      summary: List Activities
      tags:
      - Activity Manager API
      description: Retrieve a list of activities.
      parameters:
      - name: tenantId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The Tenant ID.
      - name: activityIds
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the activity.
      - name: activityName
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The name of the activity.
      - name: activityType
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The activity type.
      - name: activityStatus
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The status information of the activity.
      - name: priority
        in: query
        required: false
        schema:
          type: integer
          format: int32
          example: 0
        description: The priority information about the activity.
      - name: dueDateStartDateTime
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:01Z'
        description: The due date of the activity.
      - name: dueDateEndDateTime
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:01Z'
        description: The due date of the activity.
      - name: customerCode
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The customer code of the activity.
      - name: supplierCode
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The supplier code of the activity.
      - name: location
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The location of the activity.
      - name: private
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: Indicates whether the activity is private or not.
      - name: assignedTo
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The User ID assigned to the activity.
      - name: assignedToDepartment
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The department code to which the activity is assigned.
      - name: involvedUsers
        in: query
        required: false
