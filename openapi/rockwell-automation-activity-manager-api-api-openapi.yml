          type: integer
          format: int32
          example: 0
        description: The status type of the activity.
      - name: progressType
        in: query
        required: false
        schema:
          type: integer
          format: int32
          example: 0
        description: The progress type of the activity.
      - name: parentActivity
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The parent ID of the activity.
      - name: plannedStartDateTime
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:01Z'
        description: The planned start date of the activity.
      - name: plannedFinishDateTime
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:01Z'
        description: The planned finish date of the activity.
      - name: lastModifiedDateTimeBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:01Z'
        description: The beginning date used to return activities that were last modified within a time frame.
      - name: lastModifiedDateTimeEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:01Z'
        description: The end date used to return activities that were last modified within a time frame.
