        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReleaseDto'
      responses:
        '200':
          description: The release was updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseDto'
        '400':
          description: A validation error has occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '404':
          description: Not Found
      x-source: https://developers.plex.com/api/documentation/sales-releases-api/update-release
components:
  schemas:
    UpdateReleaseDto:
      type: object
      description: The Release model exposed for updating.
      properties:
        status:
          type: string
          description: The status of the release. If no value is provided for the status, it will be determined based on the firm and planned days by the values provided in this request or in the Approved Supplier record associated with the PO line item.
          example: string
        dueDate:
          type: string
          format: date-time
          description: The Due Date of the Release.
          example: '2026-10-20T12:03:17Z'
        quantity:
          type: number
          format: double
          description: Release Quantity.
          example: 0.1
        type:
          type: string
          description: Release Type.
          example: string
        note:
          type: string
          description: Release Note.
          example: string
        poShipTo:
          type: string
          description: Purchase Order Ship To.
          example: string
        firmDays:
          type: integer
          format: int32
          description: 'The maximum number of days in which to create releases with a firm status.

            Any value provided in this parameter will override any Approved Supplier record associated with the PO line item.'
          example: 0
        planDays:
          type: integer
          format: int32
          description: 'The maximum number of days in which to create releases with a planned status.

            Any value provided in this parameter will override any Approved Supplier record associated with the PO line item.'
          example: 0
        forecastDays:
          type: integer
          format: int32
          description: 'The maximum number of days in which to create releases with a forecast status.

            Provide a value in this parameter to limit the created releases (the Approved Supplier record is not used to limit the number of Forecast Days for releases).'
          example: 0
      required:
      - dueDate
      - quantity
    CreateReleaseDto:
      type: object
      description: The Sequenced Release model exposed for adding.
      properties:
        id:
          type: string
          format: uuid
          description: A unique identifier for the sequenced release.
          example: 00000000-0000-0000-0000-000000000000
        salesReleaseId:
          type: string
          format: uuid
          description: A unique identifier for the sales release.
          example: 00000000-0000-0000-0000-000000000000
        kitId:
          type: string
          format: uuid
          description: A unique identifier for the kit.
          example: 00000000-0000-0000-0000-000000000000
      required:
      - salesReleaseId
      - kitId
    ReleaseEdiDto:
      type: object
      description: The Release EDI model exposed for adding.
      properties:
        line11:
