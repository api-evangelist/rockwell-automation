        line16:
          type: string
          description: A line 16 value sent from EDI, typically for label usage.
          example: string
        line17:
          type: string
          description: A line 17 value sent from EDI, typically for label usage.
          example: string
        lineCode:
          type: string
          description: The EDI line code associated with the release.
          example: string
        pickupTime:
          type: string
          format: date-time
          description: The time at which the sales release will be picked up.
          example: '2026-10-20T12:03:17Z'
        batch:
          type: string
