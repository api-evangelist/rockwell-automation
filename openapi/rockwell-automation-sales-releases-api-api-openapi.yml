      x-source: https://developers.plex.com/api/documentation/sales-releases-api/get-release-edi-details
    put:
      operationId: updateReleaseEdiDetails
      summary: Update Release EDI Details
      tags:
      - Sales Releases API
      description: Update a sales release's EDI details.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The release ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReleaseEdiDto'
      responses:
        '200':
          description: The release EDI details were updated successfully.
          content:
            application/json:
              schema:
