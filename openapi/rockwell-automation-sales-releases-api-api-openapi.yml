          example: string
        materialHandlingCode:
          type: string
          description: The material handling code associated with the sales release.
          example: string
        timeFrameCode:
          type: string
          description: The time frame code, typically from EDI, for the sales release.
          example: string
        usepoint:
          type: string
          description: The use point associated with the sales release.
          example: string
        vehicleId:
          type: string
          description: The vehicle ID on the sales release.
          example: string
        logId:
          type: string
          format: uuid
          description: The ID of the EDI log entry.
          example: 00000000-0000-0000-0000-000000000000
        orderNumber:
          type: string
          description: The EDI order number associated with the sales release.
          example: string
    ReleaseDto:
      type: object
      description: The Sequenced Release model.
      properties:
