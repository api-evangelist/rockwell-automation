tags:
- name: Sales Releases API
  description: The Sales Releases API is used to manage sales release data.
paths:
  /sales/v1/releases:
    post:
      operationId: createRelease
      summary: Create Release
      tags:
      - Sales Releases API
      description: Create a sales release.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReleaseDto'
      responses:
        '201':
          description: The release was added successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseDto'
        '400':
          description: A validation error has occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
      x-source: https://developers.plex.com/api/documentation/sales-releases-api/create-release
    get:
      operationId: listReleases
      summary: List Releases
      tags:
      - Sales Releases API
      description: List sales release records based on sales release properties.
      parameters:
      - name: id
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the sales release.
      - name: releaseNumber
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The release number, typically dictated by the customer, for a specific sales release.
      - name: orderLineIds
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the purchase order line.
      - name: type
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The release type for a specific sales release.
      - name: shipToAddressId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the customer address to which the release will ship.
      - name: shipDateBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:17Z'
        description: The date on which a sales release must be shipped to satisfy the release's due date.
      - name: shipDateEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:17Z'
        description: The date on which a sales release must be shipped to satisfy the release's due date.
      - name: dueDateBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:17Z'
        description: The date on which a sales release is expected to be fulfilled.
      - name: dueDateEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:17Z'
        description: The date on which a sales release is expected to be fulfilled.
      - name: status
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The sales release's current status.
      - name: source
        in: query
        required: false
        schema:
          type: string
          example: string
        description: Identifies the source of the sales release, such as EDI or email.
      - name: scheduleDateBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:17Z'
        description: The schedule date relates multiple releases, which may span various parts and/or purchase orders, to a customer's schedule. This is typically populated via EDI.
      - name: scheduleDateEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:17Z'
        description: The schedule date relates multiple releases, which may span various parts and/or purchase orders, to a customer's schedule. This is typically populated via EDI.
      - name: createdById
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the Plex user who created the record.
      - name: createdDateBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:17Z'
        description: The date on which the record was created.
      - name: createdDateEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:17Z'
        description: The date on which the record was created.
      - name: modifiedById
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the Plex user who last modified the record.
      - name: modifiedDateBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:17Z'
        description: The date on which the record was last modified.
      - name: modifiedDateEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:17Z'
        description: The date on which the record was last modified.
      - name: partNumber
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The part number for the sales release.
      responses:
        '200':
          description: The query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseDto'
      x-source: https://developers.plex.com/api/documentation/sales-releases-api/list-releases
