                $ref: '#/components/schemas/ValidationResponse'
        '404':
          description: Not Found
      x-source: https://developers.plex.com/api/documentation/sales-releases-api/update-release-edi-details
  /sales/v1/releases/{id}:
    get:
      operationId: getRelease
      summary: Get Release
      tags:
      - Sales Releases API
      description: Retrieve a sales release record by ID.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
