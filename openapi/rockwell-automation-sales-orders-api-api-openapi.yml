components:
  schemas:
    UpdateCustomerPurchaseOrderDto:
      type: object
      description: Update customer purchase order.
      properties:
        customerId:
          type: string
          format: uuid
          description: The ID of the customer associated with the sales order.
          example: 00000000-0000-0000-0000-000000000000
        poNumber:
          type: string
          description: The customer's purchase order number on the sales order.
          example: string
        status:
          type: string
          description: The purchase order status.
          example: string
        type:
          type: string
          description: The purchase order type.
          example: string
        category:
          type: string
          description: The purchase order category.
          example: string
        terms:
          type: string
          description: The order's payment terms.
          example: string
        incoTerms:
          type: string
          description: International Commercial (INCO) Terms applied to the sales order.
          example: string
        fob:
          type: string
          description: The Freight on Board terms of the order.
          example: string
        freightTerms:
          type: string
          description: The freight terms applied to the order.
          example: string
        insideSalesId:
          type: string
          format: uuid
          description: The ID of the inside salesperson associated with the order.
          example: 00000000-0000-0000-0000-000000000000
        outsideSalesId:
          type: string
          format: uuid
          description: The ID of the outside salesperson associated with the order.
          example: 00000000-0000-0000-0000-000000000000
        poNumberRevision:
          type: string
          description: The revision number of the purchase order.
          example: string
        poNumberRevisionDate:
          type: string
          format: date-time
          description: The date on which the purchase order was revised.
          example: '2026-10-20T12:03:17Z'
        orderDate:
          type: string
          format: date-time
          description: The date on which the order was placed.
          example: '2026-10-20T12:03:17Z'
        expirationDate:
          type: string
          format: date-time
          description: The date on which the purchase order expires.
          example: '2026-10-20T12:03:17Z'
        contactId:
          type: string
          format: uuid
          description: The ID of the contact associated with this order.
          example: 00000000-0000-0000-0000-000000000000
        carrier:
          type: string
          description: The carrier associated with the purchase order. (A carrier is a supplier that has a Supplier Type of &quot;Carrier&quot;.)
          example: string
        note:
          type: string
          description: A note on the sales order.
          example: string
        invoiceInternalNote:
          type: string
          description: A note on the sales order that will populate the Internal Note field on the accounts receivable customer invoice record.
          example: string
        invoicePrintedNote:
          type: string
          description: A note on the sales order that will populate the printed Note field on the accounts receivable customer invoice record.
          example: string
        multipleDocksPerShipper:
          type: boolean
          description: Identifies whether multiple releases with different shipping docks on a single shipper are allowed.
          example: false
        multiplePOPerShipper:
          type: boolean
          description: Identifies whether multiple orders on one shipper are allowed.
          example: false
      required:
      - customerId
      - poNumber
      - status
      - type
    UpdateOrderLineDto:
      type: object
      description: Update order line.
      properties:
        customerPartId:
          type: string
          format: uuid
          description: The ID of the customer part number assigned to the sales order line.
          example: 00000000-0000-0000-0000-000000000000
        note:
          type: string
          description: A note on the sales order line.
          example: string
        lineNumber:
          type: string
          description: Typically corresponds to the line item number on the physical copy of the purchase order.
