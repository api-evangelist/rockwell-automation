tags:
- name: Sales Orders API
  description: The Sales Orders API is used to manage sales order data.
paths:
  /sales/v1/orders:
    post:
      operationId: createCustomerPurchaseOrder
      summary: Create Customer Purchase Order
      tags:
      - Sales Orders API
      description: Create a customer purchase order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerPurchaseOrderDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdersDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
      x-source: https://developers.plex.com/api/documentation/sales-orders-api/create-customer-purchase-order
    get:
      operationId: listSalesOrders
      summary: List Sales Orders
      tags:
      - Sales Orders API
      description: List Sales Orders by query parameters.
      parameters:
      - name: id
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: A unique identifier for the sales order. This will be automatically generated if omitted from the request.
      - name: customerId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the customer associated with the sales order.
      - name: orderNumber
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The internal order number generated by Plex that corresponds to a given sales order. (Applicable to two-tier ordering only.)
      - name: poNumber
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The customer's purchase order number on the sales order.
      - name: poNumberRevisionDateBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:17Z'
        description: The beginning date used to return order records with revisions during a time frame, if applicable.
      - name: poNumberRevisionDateEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:17Z'
        description: The end date used to return order records with revisions within a time frame, if applicable.
      - name: status
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The purchase order status.
      - name: type
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The purchase order type.
      - name: category
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The purchase order category.
      - name: orderDateBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:17Z'
        description: The beginning date used to return orders that were placed within a time frame.
      - name: orderDateEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:17Z'
        description: The end date used to return orders that were placed within a time frame.
      - name: expirationDateBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:17Z'
        description: The beginning date used to return purchase orders with an expiration date within a time frame.
      - name: expirationDateEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:17Z'
        description: The end date used to return purchase orders with an expiration date within a time frame.
      - name: terms
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The order's payment terms.
      - name: incoTerms
        in: query
        required: false
        schema:
          type: string
          example: string
        description: International Commercial (INCO) Terms applied to the sales order.
      - name: fob
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The Freight on Board terms of the order.
      - name: freightTerms
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The freight terms applied to the order.
      - name: insideSalesId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the inside salesperson associated with the order.
      - name: outsideSalesId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the outside salesperson associated with the order.
      - name: createdById
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the user who created the record.
      - name: createdDateBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:17Z'
        description: The beginning date used to return orders that were created within a time frame.
      - name: createdDateEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:17Z'
        description: The end date used to return orders that were created within a time frame.
      - name: modifiedById
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the user who last modified the record.
      - name: modifiedByDateBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:17Z'
        description: The beginning date used to return orders that were last modified within a time frame.
      - name: modifiedByDateEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:17Z'
        description: The end date used to return orders that were last modified within a time frame.
      responses:
        '200':
          description: The query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdersDto'
