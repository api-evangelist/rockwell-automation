openapi: 3.2.0
info:
  title: Plex (Rockwell Automation) Connect Tolerance Types API
  version: '2026-10-20'
  description: Plex Smart Manufacturing Platform REST APIs, converted mechanically from the structured operation documents the Plex Developer Portal (developers.plex.com, a Rockwell Automation property) serves at /api/documentation/{api}/{operation}. No operations were authored by hand.
  x-generated-from: provider-documentation-json
  x-source: https://developers.plex.com/api/documentation/info
servers:
- url: https://connect.plex.com
  description: Production
- url: https://test.connect.plex.com
  description: Test (from https://developers.plex.com/api/sandbox/url)
security:
- PlexConnectApiKey: []
tags:
- name: Tolerance Types API
  description: The Tolerance Types API is used to manage tolerance types data.
paths:
  /quality/v1/tolerance-types:
    get:
      operationId: listToleranceTypes
      summary: List Tolerance Types
      tags:
      - Tolerance Types API
      description: Retrieve a list of Tolerance Types.
      parameters:
      - name: toleranceType
        in: query
        required: false
        schema:
          type: string
          example: string
        description: A list of tolerance types.
      - name: attributeData
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: The designation of whether the tolerance type is attribute data or not.
      - name: referenceOnly
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: The designation of whether the tolerance type is attribute data or not.
      responses:
        '200':
          description: Query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListToleranceTypesResponseDto'
      x-source: https://developers.plex.com/api/documentation/tolerance-types-api/list-tolerance-types
components:
  schemas:
    ListToleranceTypesResponseDto:
      type: object
      properties:
        toleranceType:
          type: string
          description: The tolerance type name.
          example: string
        toleranceTypeCode:
          type: string
          description: An abbreviation for the type of tolerance allowed for a specification.
          example: string
        attributeData:
          type: boolean
          description: The designation of this tolerance type is an attribute specification or not.
          example: false
        referenceOnly:
          type: boolean
          description: The designation if this tolerance type is reference only.
          example: false
        oneSidedMaxFlag:
          type: boolean
          description: The designation if this tolerance type is set to one sided maximum.
          example: false
        oneSidedMinFlag:
          type: boolean
          description: The designation if this tolerance type is set to one sided minimum.
          example: false
        oneSidedShowTargetFlag:
          type: boolean
          description: The designation if this tolerance type is one sided and needs to specify a target value as well.
          example: false
        targetOnlyFlag:
          type: boolean
          description: The designation if this tolerance type should only specify a target.
          example: false
        textOnlyFlag:
          type: boolean
          description: The designation if this tolerance type only needs a text for verification.
          example: false
        default:
          type: boolean
          description: This designates if this tolerance type is the default for part specifications.
          example: false
  securitySchemes:
    PlexConnectApiKey:
      type: apiKey
      in: header
      name: X-Plex-Connect-Api-Key
      description: 'Subscription key (Consumer Key of an app created in the Plex Developer Portal). Source: https://developers.plex.com/getstarted'
