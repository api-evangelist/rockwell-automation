tags:
- name: Shipping Inventory API
  description: The Shipping Inventory API is used to manage shipping inventory data.
paths:
  /shipping/v1/inventory/containers/{serialNo}/shipping-details:
    get:
      operationId: getContainerShippingDetails
      summary: Get Container Shipping Details
      tags:
      - Shipping Inventory API
      description: Retrieve shipping details for a container.
      parameters:
      - name: serialNo
        in: path
        required: true
        schema:
          type: string
          example: string
        description: The serial number of the container.
      responses:
        '200':
          description: Query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerShippingDetailsDto'
        '404':
          description: Resource not found.
      x-source: https://developers.plex.com/api/documentation/shipping-inventory-api/get-container-shipping-details
  /shipping/v1/inventory/master-units/{masterUnitId}:
    get:
      operationId: getMasterUnit_shippingInventoryApi
      summary: Get Master Unit
      tags:
      - Shipping Inventory API
      description: Retrieve master unit details based on the master unit ID.
      parameters:
      - name: masterUnitId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The unique master unit identifier.
      responses:
        '200':
          description: Query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterUnitDetailsDto'
        '404':
          description: Resource not found.
      x-source: https://developers.plex.com/api/documentation/shipping-inventory-api/get-master-unit
  /shipping/v1/inventory/parts/{partId}/shipping-details:
    get:
      operationId: getPartShippingDetails
      summary: Get Part Shipping Details
      tags:
      - Shipping Inventory API
      description: Retrieve shipping details for a Part by ID.
      parameters:
      - name: partId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: A unique identifier for the part.
      responses:
        '200':
          description: Query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartShippingDetailsDto'
        '404':
          description: Resource not found.
      x-source: https://developers.plex.com/api/documentation/shipping-inventory-api/get-part-shipping-details
  /shipping/v1/inventory/customer-shippers/{shipperId}/shippable-containers:
    get:
      operationId: listShippableContainers
      summary: List Shippable Containers
      tags:
      - Shipping Inventory API
      description: List shippable containers by query parameters.
      parameters:
      - name: shipperId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The shipper ID associated with the container.
      - name: buildingId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the building associated with the shippable container.
      - name: location
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The location associated with the shippable container.
      - name: locationGroup
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The location group associated with the shippable container.
      - name: partId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the part associated with the shippable container.
      responses:
        '200':
          description: Query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippableContainerDto'
        '404':
          description: Resource not found.
      x-source: https://developers.plex.com/api/documentation/shipping-inventory-api/list-shippable-containers
