paths:
  /accounting/v1/fiscal-period-statuses:
    get:
      operationId: listFiscalPeriodStatuses
      summary: List Fiscal Period Statuses
      tags:
      - Fiscal Period Statuses API
      description: List fiscal period statuses based on specified parameters.
      parameters:
      - name: periodDisplayBegin
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The starting period used to return fiscal period status records.
      - name: periodDisplayEnd
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The ending period used to return fiscal period status records.
      responses:
        '200':
          description: The query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiscalPeriodStatusDto'
      x-source: https://developers.plex.com/api/documentation/fiscal-period-statuses-api/list-fiscal-period-statuses
components:
  schemas:
    FiscalPeriodStatusDto:
      type: object
      description: The Fiscal Period Status model.
      properties:
        fiscalYear:
          type: string
          description: Fiscal Year.
          example: string
        periodDisplay:
          type: string
          description: Fiscal Period.
          example: string
        beginDate:
          type: string
          format: date-time
          description: The calendar start date of a fiscal period.
          example: '2026-10-20T12:03:12Z'
        endDate:
          type: string
          format: date-time
          description: The calendar end date of a fiscal period.
          example: '2026-10-20T12:03:12Z'
        periodStatus:
          type: string
          description: 'Period status.

            Open - Transactions can be posted in open periods.

            Soft Closed - Transactions can be viewed, and posted/modified by users with access permissions.

            Closed - The period has ended. Transactions cannot be posted.'
          example: string
        yearStatus:
          type: string
          description: 'Fiscal year status.

            Open - The fiscal year is open. Transactions can be posted in open periods.

            Closed - The fiscal year has ended. Transactions cannot be posted to fiscal year periods.'
          example: string
  securitySchemes:
    PlexConnectApiKey:
      type: apiKey
      in: header
      name: X-Plex-Connect-Api-Key
      description: 'Subscription key (Consumer Key of an app created in the Plex Developer Portal). Source: https://developers.plex.com/getstarted'
