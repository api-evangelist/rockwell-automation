  /quality/v1/control-plans/{id}/control-plan-lines:
    get:
      operationId: listControlPlanLines
      summary: List Control Plan Lines
      tags:
      - Control Plans API
      description: Retrieve a list of control plan lines.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
      - name: ids
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: A list of IDs representing the Control Plan Line.
      - name: jobOpId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
