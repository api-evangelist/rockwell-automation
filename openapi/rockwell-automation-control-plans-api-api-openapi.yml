      description: Retrieve a control plan line.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
      - name: lineId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
      responses:
        '200':
          description: Query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetControlPlanLineResponseDto'
        '404':
          description: Resource not found.
      x-source: https://developers.plex.com/api/documentation/control-plans-api/get-control-plan-line
  /quality/v1/control-plans/{id}:
    get:
      operationId: getControlPlan
      summary: Get Control Plan
      tags:
      - Control Plans API
      description: Retrieve a control plan.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
      responses:
        '200':
          description: Query executed successfully.
