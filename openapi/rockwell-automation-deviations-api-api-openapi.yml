          example: 0
        approvedByUserId:
          type: string
          description: ID representing the approving user.
          example: string
        approvedDate:
          type: string
          format: date-time
          description: The approved date.
          example: '2026-10-20T12:03:02Z'
        buildingId:
          type: string
          format: uuid
          description: ID representing the building.
          example: 00000000-0000-0000-0000-000000000000
        buildingCode:
          type: string
          description: The building code.
          example: string
        codeNo:
          type: string
          description: The code no.
          example: string
        departmentCode:
          type: string
          description: The department code.
          example: string
        deviationAcknowledgementFrequencyDescription:
          type: string
          description: The deviation acknowledgement frequency.
          example: string
        deviationNo:
          type: string
          description: The deviation no.
          example: string
        deviationStatus:
          type: string
          description: The deviation status.
          example: string
        effectiveDate:
          type: string
          format: date-time
          description: The effective date.
          example: '2026-10-20T12:03:02Z'
        expirationDate:
          type: string
          format: date-time
          description: The expiration date.
          example: '2026-10-20T12:03:02Z'
        jobIds:
          type: array
          description: A list of IDs representing deviation jobs.
          items:
            type: string
            format: uuid
        note:
          type: string
          description: The deviation note.
          example: string
        type:
          type: string
          description: The deviation type.
          example: string
        parts:
          type: array
          description: A list of deviation parts.
          items:
            type: object
            properties: {}
        piecesAffected:
          type: integer
          format: int32
          description: The pieces affected.
          example: 0
        reason:
          type: string
          description: The deviation reason.
          example: string
        revisionDeviationId:
          type: string
          format: uuid
          description: ID representing the revision deviation.
          example: 00000000-0000-0000-0000-000000000000
        revisionDeviationNo:
          type: string
          description: The revision deviation no.
          example: string
        supplierId:
          type: string
          format: uuid
          description: ID representing the supplier.
          example: 00000000-0000-0000-0000-000000000000
  securitySchemes:
