paths:
  /quality/v1/deviations/{id}:
    get:
      operationId: getDeviation
      summary: Get Deviation
      tags:
      - Deviations API
      description: Retrieve a deviation.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
      responses:
        '200':
          description: Query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDeviationResponseDto'
        '404':
          description: Resource not found.
      x-source: https://developers.plex.com/api/documentation/deviations-api/get-deviation
  /quality/v1/deviations:
    get:
      operationId: listDeviations
      summary: List Deviations
      tags:
      - Deviations API
      description: Retrieve a list of deviations.
      parameters:
      - name: ids
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: A list of IDs representing the Deviation.
      - name: specificationId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: ID representing a Specification.
      - name: jobId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: ID representing a Job.
      - name: partId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: ID representing a Part.
      - name: deviationStatus
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The list of deviation status.
      - name: currentlyEffectiveOnly
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: If true, only the list of deviations with effective date less than or equal to today and an expiration date or is greater than today will be returned.
      responses:
        '200':
          description: Query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDeviationResponseDto'
      x-source: https://developers.plex.com/api/documentation/deviations-api/list-deviations
components:
