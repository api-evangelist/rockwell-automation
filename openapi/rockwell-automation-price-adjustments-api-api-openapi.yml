openapi: 3.2.0
info:
  title: Plex (Rockwell Automation) Connect Price Adjustments API
  version: '2026-10-20'
  description: Plex Smart Manufacturing Platform REST APIs, converted mechanically from the structured operation documents the Plex Developer Portal (developers.plex.com, a Rockwell Automation property) serves at /api/documentation/{api}/{operation}. No operations were authored by hand.
  x-generated-from: provider-documentation-json
  x-source: https://developers.plex.com/api/documentation/info
servers:
- url: https://connect.plex.com
  description: Production
- url: https://test.connect.plex.com
  description: Test (from https://developers.plex.com/api/sandbox/url)
security:
- PlexConnectApiKey: []
tags:
- name: Price Adjustments API
  description: The Price Adjustments API is used to manage price adjustment data.
paths:
  /sales/v1/price-adjustments:
    post:
      operationId: createPriceAdjustment
      summary: Create Price Adjustment
      tags:
      - Price Adjustments API
      description: Create a price adjustment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePriceAdjustmentDto'
      responses:
        '201':
          description: The record was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePriceAdjustmentDto'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
      x-source: https://developers.plex.com/api/documentation/price-adjustments-api/create-price-adjustment
    get:
      operationId: listPriceAdjustments
      summary: List Price Adjustments
      tags:
      - Price Adjustments API
      description: List price adjustments by query parameters.
      parameters:
      - name: id
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the price adjustment.
      - name: type
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The price adjustment type assigned to the price adjustment.
      - name: accountNo
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The GL account number associated with the price adjustment record.
      - name: partId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the internal part number to which the price adjustment record applies.
      - name: active
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: Identifies if the price adjustment record is active, regardless of effective and expiration dates.
      - name: effectiveDateBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:14Z'
        description: The beginning date used to return price adjustments with an effective date within a time frame.
      - name: effectiveDateEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:14Z'
        description: The end date used to return price adjustments with an effective date within a time frame.
      - name: expirationDateBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:14Z'
        description: The beginning date used to return price adjustments with an expiration date within a time frame.
      - name: expirationDateEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:14Z'
        description: The end date used to return price adjustments with an expiration date within a time frame.
      - name: customerType
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The customer type to which the price adjustment record applies.
      - name: partProductType
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The price adjustment record pertains to internal part numbers of a specific part product type.
      - name: grade
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The material grade assigned to a price adjustment.
      - name: partType
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The price adjustment record pertains to part numbers of a specific part type.
      - name: region
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The region associated with the price adjustment.
      - name: partGroup
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The price adjustment record pertains to part numbers of a specific part group.
      - name: partProductGroup
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The price adjustment record pertains to part numbers of a specific part product group.
      responses:
        '200':
          description: Query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceAdjustmentDto'
      x-source: https://developers.plex.com/api/documentation/price-adjustments-api/list-price-adjustments
  /sales/v1/price-adjustments/{id}:
    get:
      operationId: getPriceAdjustment
      summary: Get Price Adjustment
      tags:
      - Price Adjustments API
      description: Retrieve a price adjustment by ID.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
      responses:
        '200':
          description: Query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceAdjustmentDto'
        '404':
          description: Resource not found.
      x-source: https://developers.plex.com/api/documentation/price-adjustments-api/get-price-adjustment
