      description: The request object containing the data required to update a process step's Validate Component configuration.
      properties:
        bomId:
          type: string
          format: uuid
          description: The unique identifier for the BOM that drives Validate Component behavior. Required when creating a new Validate Component configuration.
          example: 00000000-0000-0000-0000-000000000000
        partNoVerify:
          type: boolean
          description: A value indicating whether the part number should be verified.
          example: false
        partNoVerifySortOrder:
          type: integer
          format: int32
          description: The part number verification sort order.
          example: 0
        serialNoVerify:
          type: boolean
          description: A value indicating whether the container serial number should be verified. For use with non-serialized component parts.
          example: false
        serialNoVerifySortOrder:
          type: integer
          format: int32
          description: The container serial number verification sort order. For use with non-serialized component parts.
          example: 0
        lotNoVerify:
          type: boolean
          description: A value indicating whether the lot number should be verified. For use with component parts that have lot tracking enabled.
          example: false
        lotNoVerifySortOrder:
          type: integer
          format: int32
          description: The lot number verification sort order. For use with component parts that have lot tracking enabled.
          example: 0
        pieceSerialNoVerify:
          type: boolean
          description: A value indicating whether the piece serial number should be verified. For use with serialized component parts. Not compatible with the ScanStorePieceSerialNo flag.
          example: false
        pieceSerialNoVerifySortOrder:
          type: integer
          format: int32
          description: The piece serial number verification sort order. For use with serialized component parts.
          example: 0
        scanStorePieceSerialNo:
          type: boolean
          description: A value indicating whether the scanned piece serial number should be stored. For use with serialized component parts. Not compatible with the PieceSerialNoVerify flag.
          example: false
        scanStorePieceSerialNoSortOrder:
          type: integer
          format: int32
          description: The scan-and-store piece serial number sort order. For use with serialized component parts.
          example: 0
        pieceQuantity:
          type: integer
          format: int32
          description: The required piece quantity. For use in serialized component parts. Required when either PieceSerialNoVerify or ScanStorePieceSerialNo is enabled.
          example: 0
      required:
      - bomId
    AddProcessStepRequestDto:
      type: object
      description: The request object containing the data required to add a process step.
      properties:
        processStepType:
          type: string
          description: The process step type (defined by the action assigned to the step). Accepted values are &quot;Checksheet&quot;, &quot;Informational&quot;, &quot;InstallBOM&quot;, &quot;ToolComponent&quot;, and &quot;ValidateComponent&quot; when the process group has a workcenter status type of &quot;Production&quot;. Otherwise, values are limited to &quot;Checksheet&quot; and &quot;Informational&quot;. This value cannot be changed after creation.
          example: string
        description:
          type: string
          description: The process step instruction title.
          example: string
        expectedDurationTimeSpan:
          type: string
          format: date-span
          description: The expected time to perform the process step activities. In the format of &quot;hh:mm:ss&quot; or &quot;d.hh:mm:ss&quot;.
          example: string
        instruction:
          type: string
          description: The work instruction content for the process step.
          example: string
        active:
          type: boolean
          description: A value indicating whether the process step is active.
          example: false
        sequenceNo:
          type: integer
          format: int32
          description: The sequence number.
          example: 0
        dependsOnProcessStepId:
          type: string
          format: uuid
          description: The identifier of the process step that this process step depends on. That process step must have the same parent process group and a lower sequence number.
          example: 00000000-0000-0000-0000-000000000000
        controlPanelVisible:
          type: boolean
          description: A value indicating whether this process step will be visible on the Control Panel.
          example: false
        recordActivityType:
          type: string
          description: Defines how activity is recorded against a process step. Accepted values are &quot;Complete&quot;, &quot;N/A&quot;, and &quot;Start/Complete&quot; when the process step type is &quot;Informational&quot; or &quot;Start/Complete&quot; for all other process step types.
          example: string
      required:
      - processStepType
      - description
      - active
      - sequenceNo
      - recordActivityType
    UpdateProcessStepInstallBomsRequestDto:
      type: object
      description: The request object containing the data required to update an Install BOM and its component parts.
      properties:
        bom:
          type: array
          description: The list of component parts that comprise the Install BOM.
          items:
            type: object
            description: A request object containing the data required to update a process step's Install BOM.
            properties: {}
        installBomId:
          type: string
          format: uuid
          description: The unique identifier for the Install BOM component.
          example: 00000000-0000-0000-0000-000000000000
        sortOrder:
          type: integer
          format: int32
          description: The component part's sort order within the Install BOM.
          example: 0
        quantity:
          type: number
          format: double
          description: The component quantity to use for the Install BOM.
          example: 0.1
        minimumQuantity:
          type: number
          format: double
          description: The minimum component quantity to use for the Install BOM. Used with operations that have the Variable BOM flag enabled.
          example: 0.1
        maximumQuantity:
          type: number
          format: double
          description: The maximum component quantity to use for the Install BOM. Used with operations that have the Variable BOM flag enabled.
          example: 0.1
      required:
      - bom
      - installBomId
    ProcessStepsReportResponseDto:
      type: object
