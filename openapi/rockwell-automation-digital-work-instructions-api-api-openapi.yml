components:
  schemas:
    ProcessStepResponseDto:
      type: object
      description: A response object containing the data that defines a process step.
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier for the process step.
          example: 00000000-0000-0000-0000-000000000000
        processGroupId:
          type: string
          format: uuid
          description: The unique identifier for the process group.
          example: 00000000-0000-0000-0000-000000000000
        processStepType:
          type: string
          description: 'The process step type (defined by the action assigned to the step). Possible values: &quot;Informational&quot;, &quot;Checksheet&quot;, &quot;InstallBOM&quot;, &quot;ToolComponent&quot;, &quot;ValidateComponent&quot;.'
          example: string
        description:
          type: string
          description: The process step instruction title.
          example: string
        expectedDurationTimeSpan:
          type: string
          format: date-span
          description: The expected time to perform the process step activities.
          example: string
        instruction:
          type: string
          description: The work instruction content for the process step.
          example: string
        active:
          type: boolean
          description: A value indicating whether the process step is active.
          example: false
        sequenceNo:
          type: integer
          format: int32
          description: The sequence number.
          example: 0
        dependsOnProcessStepId:
          type: string
          format: uuid
          description: The identifier of the process step that this process step depends on.
          example: 00000000-0000-0000-0000-000000000000
        controlPanelVisible:
          type: boolean
          description: A value indicating whether this process step will be visible on the Control Panel.
          example: false
        createdById:
          type: string
          format: uuid
          description: The unique identifier for the user that created the process step.
          example: 00000000-0000-0000-0000-000000000000
        createdDateTime:
          type: string
          format: date-time
          description: The date and time when the process step was created.
          example: '2026-10-20T12:03:02Z'
        modifiedById:
          type: string
          format: uuid
          description: The unique identifier for the user that last modified the process step.
          example: 00000000-0000-0000-0000-000000000000
        modifiedDateTime:
          type: string
          format: date-time
          description: The date and time when the process step was last modified.
          example: '2026-10-20T12:03:02Z'
        recordActivityType:
          type: string
          description: 'Defines how activity is recorded against a process step. Possible values: &quot;N/A&quot;, &quot;Start/Complete&quot;, &quot;Complete&quot;.'
          example: string
        checksheet:
          $ref: '#/components/schemas/ProcessStepChecksheetResponseDto'
        validateComponent:
          $ref: '#/components/schemas/ProcessStepValidateComponentResponseDto'
        toolComponent:
          $ref: '#/components/schemas/ProcessStepToolComponentResponseDto'
        installBom:
          $ref: '#/components/schemas/ProcessStepInstallBomResponseDto'
    UpdateProcessStepToolComponentRequestDto:
      type: object
      description: The request object containing the data required to update Tool Component configuration for a process step.
      properties:
        bomId:
          type: string
          format: uuid
          description: The unique identifier for the BOM component. Required when creating a new Tool Component configuration.
          example: 00000000-0000-0000-0000-000000000000
        quantity:
          type: integer
          format: int32
          description: The quantity of the process step's BOM component that the tool is used with.
          example: 0
        retries:
          type: integer
          format: int32
          description: The number of retries allowed for the component.
          example: 0
        storeInChecksheet:
          type: boolean
          description: A value indicating whether to store collected specification data in a checksheet.
          example: false
        tools:
          type: array
          description: A list of Tool Component configurations for the process step.
          items:
            type: object
            description: A request object containing the data that defines a process step's Tool Component configuration.
            properties: {}
        processStepToolId:
          type: string
          description: The unique identifier for the tool specified in the process step's Tool Component configuration. Use for updating existing tools.
          example: string
        toolNo:
          type: string
          description: The tool number. Required for adding new tools to the Tool Component configuration. This value cannot be changed after creation.
          example: string
        toolVerify:
          type: boolean
          description: A value indicating whether tool verification is required.
          example: false
        controlPlanId:
          type: string
          format: uuid
          description: The unique identifier for the associated control plan.
          example: 00000000-0000-0000-0000-000000000000
        inspectionMode:
          type: string
          description: The associated control plan's inspection mode.
          example: string
      required:
      - quantity
      - retries
      - toolNo
    UpdateProcessStepRequestDto:
      type: object
      description: A request object containing the data required to update a process step.
      properties:
        description:
          type: string
          description: The process step instruction title.
          example: string
        expectedDurationTimeSpan:
          type: string
          format: date-span
          description: The expected time to perform the process step activities. In the format of &quot;hh:mm:ss&quot; or &quot;d.hh:mm:ss&quot;.
          example: string
        instruction:
          type: string
          description: The work instruction content for the process step.
          example: string
        active:
          type: boolean
          description: A value indicating whether the process step is active.
          example: false
        sequenceNo:
          type: integer
          format: int32
          description: The sequence number.
          example: 0
        dependsOnProcessStepId:
          type: string
          format: uuid
          description: The identifier of the process step that this process step depends on. That process step must have the same parent process group and a lower sequence number. Omit to retain the current value or set to null to clear it.
          example: 00000000-0000-0000-0000-000000000000
        controlPanelVisible:
          type: boolean
          description: A value indicating whether this process step will be visible on the Control Panel.
