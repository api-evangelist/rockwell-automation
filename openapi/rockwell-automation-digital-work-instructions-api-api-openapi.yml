  /work-instructions/v1/reports/process-step-evaluation-status-report:
    get:
      operationId: getProcessStepEvaluationStatusReport
      summary: Get Process Step Evaluation Status Report
      tags:
      - Digital Work Instructions API
      description: 'Exactly one of the following selection modes is required (selection modes are mutually exclusive):


        jobInUseOnControlPanel=true

        Both jobCompletionDateStart and jobCompletionDateEnd in YYYY-MM-DD format

        jobId


        The timeRemaining field is returned only when jobInUseOnControlPanel=true.'
      x-beta: true
      x-beta-end-date: '2026-12-31T00:00:00'
      parameters:
      - name: jobInUseOnControlPanel
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: A value indicating whether to return rows for jobs currently in use on the Control Panel.
      - name: jobId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The unique identifier for the job.
      - name: jobCompletionDateStart
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The inclusive start of the job completion date range.
      - name: jobCompletionDateEnd
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The inclusive end of the job completion date range.
      - name: partId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The unique identifier for the part.
      - name: operationId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The unique identifier for the operation.
      - name: workcenterGroup
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The workcenter group.
      - name: workcenterId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The unique identifier for the workcenter.
      - name: deviation
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The deviation filter for process step duration. Possible values are 0 (no filter; returns all results), -1 (under time; actual duration is less than expected duration), 1 (over time; actual duration is greater than expected duration), and values greater than 1 (over by a multiplier; actual duration exceeds expected duration * deviation).
      - name: processStepStatus
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The process step status filter that controls which steps are returned based on their completion state. Possible values are 0 (All), 1 (Incomplete), and 2 (In Progress).
      - name: processGroupsOnly
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: A value indicating whether to restrict the report to process group level rows only.
      responses:
        '200':
          description: The report executed successfully. Returns an empty array if no rows match the criteria.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessStepsReportResponseDto'
        '400':
          description: The request does not satisfy a valid selection mode, combines more than one selection mode, or supplies invalid parameter values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
      x-source: https://developers.plex.com/api/documentation/digital-work-instructions-api/get-process-step-evaluation-status-report
