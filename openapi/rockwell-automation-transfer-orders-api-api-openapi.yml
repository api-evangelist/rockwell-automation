components:
  schemas:
    ValidationResponse:
      type: object
      properties:
        code:
          type: string
          example: string
        message:
          type: string
          example: string
        errors:
          type: array
          items:
            type: object
            properties: {}
    UpdateTransferOrderDto:
      type: object
      description: Update transfer order.
      properties:
        description:
          type: string
          description: The transfer order description.
          example: string
        fromLocationId:
          type: string
          format: uuid
          description: The ID of the location the supply item will ship from.
          example: 00000000-0000-0000-0000-000000000000
        lotId:
          type: string
          format: uuid
          description: The ID of the lot allowed on the transfer order.
          example: 00000000-0000-0000-0000-000000000000
        orderQuantity:
          type: number
          format: double
          description: The quantity for the transfer order.
          example: 0.1
        operationId:
          type: string
          format: uuid
          description: The ID of the operation the part must be in to satisfy the transfer order.
          example: 00000000-0000-0000-0000-000000000000
        partId:
          type: string
          format: uuid
          description: The ID for a part.
          example: 00000000-0000-0000-0000-000000000000
        requiredShipDate:
          type: string
          format: date-time
          description: The date the transfer order is required to ship by.
          example: '2026-10-20T12:03:18Z'
        shipFromId:
          type: string
          format: uuid
          description: The ID of the building the order will ship from.
          example: 00000000-0000-0000-0000-000000000000
        shipToId:
          type: string
          format: uuid
          description: The ID of the building the order will ship to.
          example: 00000000-0000-0000-0000-000000000000
        supplyItemId:
          type: string
          format: uuid
          description: The ID for a supply item.
          example: 00000000-0000-0000-0000-000000000000
        type:
          type: string
          description: The transfer order type.
          example: string
      required:
      - orderQuantity
      - shipFromId
      - shipToId
      - type
    CreateTransferOrderDto:
      type: object
      description: Create transfer order.
      properties:
        description:
          type: string
          description: The transfer order description.
          example: string
        fromLocationId:
          type: string
          format: uuid
          description: The ID of the location the supply item will ship from.
          example: 00000000-0000-0000-0000-000000000000
        lotId:
          type: string
          format: uuid
          description: The ID of the lot allowed on the transfer order.
          example: 00000000-0000-0000-0000-000000000000
        orderQuantity:
          type: number
          format: double
          description: The quantity for the transfer order.
          example: 0.1
        operationId:
          type: string
          format: uuid
          description: The ID of the operation the part must be in to satisfy the transfer order.
          example: 00000000-0000-0000-0000-000000000000
        partId:
          type: string
          format: uuid
          description: The ID for a part.
          example: 00000000-0000-0000-0000-000000000000
        requiredShipDate:
          type: string
          format: date-time
          description: The date the transfer order is required to ship by.
          example: '2026-10-20T12:03:18Z'
        shipFromId:
          type: string
          format: uuid
          description: The ID of the building the order will ship from.
          example: 00000000-0000-0000-0000-000000000000
        shipToId:
          type: string
          format: uuid
          description: The ID of the building the order will ship to.
          example: 00000000-0000-0000-0000-000000000000
        supplyItemId:
          type: string
          format: uuid
          description: The ID for a supply item.
          example: 00000000-0000-0000-0000-000000000000
        type:
          type: string
          description: The transfer order type.
          example: string
        id:
          type: string
          format: uuid
          description: A unique identifier for the transfer order. This will be automatically generated if omitted from the request.
          example: 00000000-0000-0000-0000-000000000000
      required:
      - orderQuantity
      - shipFromId
      - shipToId
      - type
    TransferOrderDto:
      type: object
      description: The Transfer Order.
      properties:
        createdByAccountId:
          type: string
          format: uuid
          description: The ID of the user who created the record.
          example: 00000000-0000-0000-0000-000000000000
        createdDate:
          type: string
          format: date-time
          description: The date on which the record was created.
          example: '2026-10-20T12:03:18Z'
        description:
          type: string
          description: The description of the transfer order.
          example: string
        fromLocationId:
          type: string
          format: uuid
          description: The ID for a supply item location.
          example: 00000000-0000-0000-0000-000000000000
        id:
          type: string
          format: uuid
          description: A unique identifier for the transfer order. This will be automatically generated if omitted from the request.
          example: 00000000-0000-0000-0000-000000000000
        intransitShippers:
          type: array
          description: A list of in-transit shippers for the transfer order.
          items:
            type: object
            properties: {}
        lotId:
          type: string
          format: uuid
          description: The ID of the lot allowed on the transfer order.
          example: 00000000-0000-0000-0000-000000000000
        modifiedByAccountId:
          type: string
          format: uuid
          description: The ID of the user who last modified the record.
          example: 00000000-0000-0000-0000-000000000000
        modifiedDate:
          type: string
          format: date-time
          description: The date on which the record was last modified.
          example: '2026-10-20T12:03:18Z'
        operationId:
          type: string
          format: uuid
          description: The ID of the part's operation.
          example: 00000000-0000-0000-0000-000000000000
        orderQuantity:
          type: number
          format: double
          description: The quantity on the transfer order.
          example: 0.1
        partId:
          type: string
          format: uuid
          description: The ID for a part.
          example: 00000000-0000-0000-0000-000000000000
        requiredShipDate:
          type: string
          format: date-time
          description: The date the transfer order is required to ship by.
          example: '2026-10-20T12:03:18Z'
        scheduledQuantity:
          type: number
          format: double
          description: The quantity on the transfer order that has already been scheduled to an interplant shipper.
          example: 0.1
        shipFromId:
          type: string
          format: uuid
          description: The ID of the building from which the order will ship.
          example: 00000000-0000-0000-0000-000000000000
        shippedQuantity:
          type: number
          format: double
          description: The quantity on the transfer order that has already been shipped on an interplant shipper.
          example: 0.1
        shipToId:
          type: string
          format: uuid
          description: The ID of the building the order will ship to.
          example: 00000000-0000-0000-0000-000000000000
        status:
          type: string
          description: The transfer order status.
          example: string
        supplyItemId:
          type: string
          format: uuid
          description: The ID for a supply item.
          example: 00000000-0000-0000-0000-000000000000
        transferOrderNo:
          type: string
          description: The internal order number generated by Plex that corresponds to a given transfer order.
          example: string
        type:
          type: string
          description: The transfer order type.
          example: string
  securitySchemes:
    PlexConnectApiKey:
      type: apiKey
      in: header
      name: X-Plex-Connect-Api-Key
      description: 'Subscription key (Consumer Key of an app created in the Plex Developer Portal). Source: https://developers.plex.com/getstarted'
