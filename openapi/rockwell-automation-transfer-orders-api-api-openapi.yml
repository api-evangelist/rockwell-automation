              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '404':
          description: Not Found
      x-source: https://developers.plex.com/api/documentation/transfer-orders-api/cancel-transfer-order
  /shipping/v1-beta1/transfer-orders:
    post:
      operationId: createTransferOrder
      summary: Create Transfer Order
      tags:
      - Transfer Orders API
      description: Create a transfer order.
      x-beta: true
      x-beta-end-date: null
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransferOrderDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferOrderDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
      x-source: https://developers.plex.com/api/documentation/transfer-orders-api/create-transfer-order
    get:
      operationId: listTransferOrders
      summary: List Transfer Orders
      tags:
      - Transfer Orders API
      description: List Transfer Orders by query parameters.
      x-beta: true
      x-beta-end-date: null
      parameters:
      - name: createdDateBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:18Z'
        description: The beginning date used to return orders that were created within a time frame.
      - name: createdDateEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:18Z'
        description: The end date used to return orders that were created within a time frame.
      - name: id
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: A unique identifier for the transfer order.
      - name: lotId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the lot allowed on the transfer order.
      - name: partId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID for a part.
      - name: requiredShipDateBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:18Z'
        description: The beginning date used to return orders that were placed within a time frame.
      - name: requiredShipDateEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:18Z'
        description: The end date used to return orders that were placed within a time frame.
      - name: shipFromId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the building from which the order will ship.
      - name: shipToId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the building the order will ship to.
      - name: status
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The transfer order status.
      - name: supplyItemId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID for a supply item.
      - name: transferOrderNo
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The internal order number generated by Plex that corresponds to a given transfer order.
      - name: type
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The transfer order type.
      responses:
        '200':
          description: The query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferOrderDto'
      x-source: https://developers.plex.com/api/documentation/transfer-orders-api/list-transfer-orders
