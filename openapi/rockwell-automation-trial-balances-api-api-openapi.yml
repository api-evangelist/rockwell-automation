paths:
  /accounting/v1/trial-balance:
    get:
      operationId: getTrialBalance
      summary: Get Trial Balance
      tags:
      - Trial Balances API
      description: Generate the Trial Balance Report based on specified parameters.
      parameters:
      - name: periodDisplayBegin
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The starting period used to return trial balance records.
      - name: periodDisplayEnd
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The ending period used to return trial balance records.
      - name: excludePeriod13
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: Specify if 13th period records are excluded from the trial balance report.
      - name: periodAdjustmentEntries
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: Specify if period adjustment records are included in the trial balance report.
      responses:
        '200':
          description: Query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrialBalanceDto'
      x-source: https://developers.plex.com/api/documentation/trial-balances-api/get-trial-balance
