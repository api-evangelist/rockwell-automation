    get:
      operationId: listJournalEntriesV2
      summary: List Journal Entries
      tags:
      - Journal Entries API
      description: List journal entries by query parameters.
      parameters:
      - name: id
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
