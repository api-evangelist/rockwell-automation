      - name: postDateBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:13Z'
        description: The beginning date used to return GL journal entries posted within a time frame.
      - name: postDateEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:13Z'
        description: The end date used to return GL journal entries posted within a time frame.
      - name: reversing
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: Specify a GL journal entry has been reversed.
      - name: status
        in: query
        required: false
