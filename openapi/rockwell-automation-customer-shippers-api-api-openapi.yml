components:
  schemas:
    CreateShipperDto:
      type: object
      description: The shipper model exposed for adding.
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the shipper.
          example: 00000000-0000-0000-0000-000000000000
        shipperNumber:
          type: string
          description: The shipper number.
          example: string
        customerId:
          type: string
          format: uuid
          description: The customer ID.
          example: 00000000-0000-0000-0000-000000000000
        customerAddressId:
          type: string
          format: uuid
          description: The customer address ID.
          example: 00000000-0000-0000-0000-000000000000
        carrierId:
          type: string
          format: uuid
          description: The carrier ID.
          example: 00000000-0000-0000-0000-000000000000
        freightTerms:
          type: string
          description: The shipper's freight terms.
          example: string
        status:
          type: string
          description: The shipper status.
          example: string
        trackingNumber:
          type: string
          description: The shipper tracking number.
          example: string
        trailerNumber:
          type: string
          description: The shipper trailer number.
          example: string
        scheduledShipDate:
          type: string
          format: date-time
          description: The scheduled ship date.
          example: '2026-10-20T12:03:02Z'
        shipperNote:
          type: string
          description: A note to print on the shipper and the bill of lading.
          example: string
        truckId:
          type: string
          format: uuid
          description: The truck ID.
          example: 00000000-0000-0000-0000-000000000000
        expediteNote:
          type: string
          description: The expedite note.
          example: string
        expediteReason:
          type: string
          description: The expedite reason.
          example: string
        expediteDepartmentCode:
          type: string
          description: The department code that authorized the expedite.
          example: string
        expediteAdditionalCost:
          type: number
          format: double
          description: Additional cost due to expedited shipping.
          example: 0.1
        shipFromId:
          type: string
          format: uuid
          description: The ship from code.
          example: 00000000-0000-0000-0000-000000000000
        truckArrivalTimeOfDay:
          type: string
          format: time
          description: The truck arrival time. Use format hh:mm:ss.
          example: string
        freightAmount:
          type: number
          format: double
          description: The freight amount.
          example: 0.1
        bolNote:
          type: string
          description: The bill of lading note.
          example: string
        note:
          type: string
          description: An internal note.
          example: string
        customsExporter:
          type: string
          description: The customs exporter.
          example: string
        deliveryDate:
          type: string
          format: date-time
          description: The delivery date.
          example: '2026-10-20T12:03:02Z'
        dropshipSupplierId:
          type: string
          format: uuid
          description: The dropship supplier ID.
          example: 00000000-0000-0000-0000-000000000000
        chargeAmount:
          type: number
          format: double
          description: The charge amount for the shipper.
          example: 0.1
        masterBolNumber:
          type: string
          description: The master bill of lading (BOL) number.
          example: string
        pallets:
          type: integer
          format: int32
          description: The number of pallets on the shipper.
          example: 0
        premiumTransAuth:
          type: string
          description: The number specified in the shipper's Premium Trans Auth field (used for AETC numbers on expedited shipments).
          example: string
        truckConfirmation:
          type: string
          description: The truck confirmation.
          example: string
        truckCalledDate:
          type: string
          format: date
          description: The truck called date. Use format YYYY-MM-DD.
          example: 10/20/2026 00:00:00
        grossWeightOverride:
          type: number
          format: double
          description: The gross weight override.
          example: 0.1
        mrn:
          type: string
          description: The movement reference number (MRN) specified on the shipper.
          example: string
        mrnDate:
          type: string
          format: date
          description: The movement reference number (MRN) date. Use format YYYY-MM-DD.
          example: 10/20/2026 00:00:00
        mrnType:
          type: string
          description: The MRN type.
          example: string
        routingAuthorizationNumber:
          type: string
          description: The routing authorization number.
          example: string
      required:
      - shipperNumber
      - customerId
      - customerAddressId
      - freightTerms
      - status
    ShipperDto:
      type: object
      description: The shipper model exposed.
      properties:
        id:
          type: string
          format: uuid
          description: A unique identifier for the shipper.
          example: 00000000-0000-0000-0000-000000000000
        shipperNumber:
          type: string
          description: The shipper number associated with a given shipment.
          example: string
        customerId:
          type: string
          format: uuid
          description: The ID of the customer that is associated with the shipper.
          example: 00000000-0000-0000-0000-000000000000
        customerAddressId:
          type: string
