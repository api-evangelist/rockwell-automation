        description: The line id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoadContainerDto'
      responses:
        '200':
          description: The container was loaded successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerShippingDetailsDto'
        '400':
          description: A validation error has occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '404':
          description: Not Found
      x-source: https://developers.plex.com/api/documentation/customer-shippers-api/load-container
  /shipping/v1-beta1/customer-shippers/{shipperId}/lines/{lineId}/load-fifo:
