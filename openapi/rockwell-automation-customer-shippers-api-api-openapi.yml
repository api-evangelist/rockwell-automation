  /shipping/v1/customer-shippers:
    get:
      operationId: listCustomerShippers
      summary: List Customer Shippers
      tags:
      - Customer Shippers API
      description: List customer shippers by query parameters.
      parameters:
      - name: id
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: One or more customer shipper line IDs.
      - name: shipperNumber
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The shipper number associated with a given shipment.
      - name: customerId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the customer that is associated with the shipper.
      - name: customerAddressId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the customer address that is associated with the shipper.
      - name: shipDateBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:02Z'
        description: The date on which the shipper was shipped.
      - name: shipDateEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:02Z'
        description: The date on which the shipper was shipped.
      - name: shippedById
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the user who shipped the shipper.
      - name: carrierId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The supplier ID that is flagged as the carrier on this shipment.
      - name: freightTerms
        in: query
        required: false
        schema:
          type: string
          example: string
        description: Terms of the freight payment; for example, COD, Collect, or Prepaid.
      - name: status
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The shipper's status.
      - name: trackingNumber
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The tracking number, often provided by a carrier, that is specified on the shipper.
      - name: trailerNumber
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The trailer number associated with the physical trailer that a specific shipment was shipped on.
      - name: scheduledShipDateBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:02Z'
        description: The beginning date used to return shipper records that were scheduled to ship during a specified period of time.
      - name: scheduledShipDateEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:02Z'
        description: The ending date used to return shipper records that were scheduled to ship during a specified period of time.
      - name: createdById
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the user who created the record.
      - name: createdDateBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:02Z'
        description: The beginning date used to return shipper records that were created during a specified period of time.
      - name: createdDateEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:02Z'
        description: The ending date used to return shipper records that were created during a specified period of time.
      - name: modifiedById
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the user who last modified the record.
      - name: modifiedDateBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:02Z'
        description: The beginning date used to return shipper records that were last modified within a specified period of time.
      - name: modifiedDateEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:02Z'
        description: The ending date used to return shipper records that were last modified within a specified period of time.
      - name: truckId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the truck associated with the shipper.
      - name: expediteReason
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The reason for expedited shipping as specified on the shipper.
      - name: expediteDepartment
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The department that authorized or required an expedited shipment.
      - name: expediteAuthorizedById
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the user who authorized the expedited shipping.
      - name: shipFromCode
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The building code from which the shipper was shipped.
      - name: truckArrivalTimeBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:02Z'
        description: This field has been deprecated. Use TruckArrivalTimeOfDayBegin.
      - name: truckArrivalTimeEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:02Z'
        description: This field has been deprecated. Use TruckArrivalTimeOfDayEnd.
      - name: printedById
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the user who printed the record.
      - name: printedDateBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:02Z'
        description: The beginning date used to return records that were printed within a specified period of time.
      - name: printedDateEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:02Z'
        description: The ending date used to return records that were printed within a specified period of time.
      - name: pickListPrintedDateTimeBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:02Z'
        description: The beginning date used to return pick list records that were printed within a specified period of time.
      - name: pickListPrintedDateTimeEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:02Z'
        description: The ending date used to return pick list records that were printed within a specified period of time.
      - name: truckArrivalTimeOfDayBegin
        in: query
        required: false
        schema:
          type: string
          format: time
          example: string
        description: The beginning time of day used to return truck records that arrived within a specified period of time.
      - name: truckArrivalTimeOfDayEnd
        in: query
        required: false
        schema:
          type: string
          format: time
          example: string
        description: The beginning time of day used to return truck records that arrived within a specified period of time.
      responses:
        '200':
          description: The query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipperDto'
      x-source: https://developers.plex.com/api/documentation/customer-shippers-api/list-customer-shippers
  /shipping/v1-beta1/customer-shippers/{shipperId}/lines/{lineId}/load-container:
