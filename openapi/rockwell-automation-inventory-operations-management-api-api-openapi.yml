components:
  schemas:
    ContainerAdjustment:
      type: object
      description: In Plex, container adjustments are inventory changes made outside of standard receiving, shipping, and production activities, such as cycle counts or manual updates to the container quantity itself.
      properties:
        adjustmentDateTime:
          type: string
          format: date-time
          description: The date and time when an inventory adjustment was made.
          example: '2026-10-20T12:03:12Z'
        serialNo:
          type: string
          description: The serial number of the container that was adjusted. 25 characters maximum.
          example: string
        quantity:
          type: number
          format: double
          description: The delta quantity that was adjusted. This value could be a positive number (inventory quantity increased) or a negative number (inventory quantity decreased). Decimal, (19,5) maximum characters.
          example: 0.1
        netWeight:
          type: number
          format: double
          description: The delta net weight that was adjusted. This value could be a positive number (weight increased) or a negative number (weight decreased). Decimal, (19,5) maximum characters.
          example: 0.1
        adjustmentCode:
          type: string
          description: Setup table &quot;Adjustment Reason&quot; (part.dbo.adjustment_reason). The Adjustment Reason setup table lists the acceptable reasons for inventory changes. 50 characters maximum.
          example: string
        partId:
          type: string
          format: uuid
          description: The container's Part ID.
          example: 00000000-0000-0000-0000-000000000000
        partNumber:
          type: string
          description: The container's Part Number. A short code or number to call the part. This value shows up throughout the system, so use something others will recognize. Acceptable Part Number characters include uppercase and lowercase letters (A-Z), numbers (0-9), and special characters such as dashes (-), underscores ( _ ), and spaces. Other characters may cause issues. 100 characters maximum.
          example: string
        revision:
          type: string
          description: The container's Part Revision. A revision level represents a change or modification to a part or part drawing that is usually initiated through an engineering change request (ECR). 8 characters maximum.
          example: string
        partNumberRevision:
          type: string
          description: Format {partNumber}{part rev separator}{revision}. The container's Part Number Revision formatted with separator. If a part number has a revision, Plex will return the part number and the revision separated by the Part Rev Separator setting. A Part Rev Separator can be up to 5 characters long.
          example: string
        partOperationId:
          type: string
          format: uuid
          description: The container's Part Operation ID.
          example: 00000000-0000-0000-0000-000000000000
        operationCode:
          type: string
          description: The container's Operation Code. 10 characters maximum.
          example: string
        operationNumber:
          type: integer
          format: int32
          description: The container's Operation Number (sequence order). 30 characters maximum.
          example: 0
        location:
          type: string
          description: The Location Code of the container that was adjusted. 50 characters maximum.
          example: string
        locationId:
          type: string
          format: uuid
          description: The location ID of the container that was adjusted.
          example: 00000000-0000-0000-0000-000000000000
        jobNumber:
          type: string
          description: The Job associated to the container adjustment.
          example: string
        standardCost:
          type: number
          format: double
          description: The standard cost per unit from the requested cost model. Decimal, (19,5) maximum characters.
          example: 0.1
        extendedCost:
          type: number
          format: double
          description: The total cost impact of the adjustment (quantity x standard cost). Decimal, (19,6) maximum characters.
          example: 0.1
    InventoryShipment:
      type: object
      description: The inventory shipment.
      properties:
        id:
          type: string
          format: uuid
          description: UUID V4 format XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX. The Inventory Shipment Resource ID.
          example: 00000000-0000-0000-0000-000000000000
        externalShipmentCode:
          type: string
          description: 50 character max. The external inventory shipment code. This code is not provided by Plex and is distinct from the shipment ID.
          example: string
        shipmentStatus:
          type: string
          description: The inventory shipment status. Valid statuses include &quot;Unstaged&quot;, &quot;Staged&quot;, and &quot;Shipped&quot;.
          example: string
        containers:
          type: array
          description: The containers associated with the inventory shipment.
          items:
            type: object
            description: The container associated with the inventory shipment.
            properties: {}
        createdById:
          type: string
          format: uuid
          description: UUID V4 format XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX. The tenant ID used to create this inventory shipment.
          example: 00000000-0000-0000-0000-000000000000
        createdDate:
          type: string
          format: date-time
          description: Date/Time Format YYYY-MM-DDThh:mm:ss.fffffffZ The date and time when an inventory shipment was made. See &quot;Dates and Times&quot; in the Get Started section of the Plex Developer Portal (APIs &gt; Get Started).
