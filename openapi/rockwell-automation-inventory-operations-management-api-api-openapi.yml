  /inventory/v2/inventory-history/container-adjustments:
    get:
      operationId: listContainerAdjustmentsV2
      summary: List Container Adjustments
      tags:
      - Inventory Operations Management API
      description: List container inventory adjustment entries, including all adjustment types (Add Existing Inventory, RF Retire, PC Retire, and manual adjustments), with expanded filter parameters.
      parameters:
      - name: serialNo
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The serial number of the container that was adjusted. 25 characters maximum.
      - name: beginDateTime
        in: query
        required: true
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:12Z'
        description: The date and time from when container adjustment transactions are to be retrieved.
      - name: endDateTime
        in: query
        required: true
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:12Z'
        description: The date and time until when container adjustment transactions are to be retrieved.
      - name: partId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The container's Part ID.
      - name: partOperationId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The container's Part Operation ID.
      - name: adjustmentReason
        in: query
        required: false
        schema:
          type: string
          example: string
        description: Setup table &quot;Adjustment_Reason&quot;. The Adjustment Reason setup table lists the acceptable reasons for inventory changes. 50 characters maximum.
      - name: locationId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The location ID of the container that was adjusted.
      - name: materialCode
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The material code of the container that was adjusted. 50 characters maximum.
      - name: supplyId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The supply item ID of the container that was adjusted.
      - name: containerStatus
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The container status of the container that was adjusted. 50 characters maximum.
      - name: lastAction
        in: query
        required: false
        schema:
          type: string
          example: string
        description: Comma-separated list of last action values of the container that was adjusted (e.g. &quot;Adjust,Scrap&quot;).
      - name: updatedBy
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The user ID of the last update of the container that was adjusted.
      - name: jobId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The job ID of the container that was adjusted.
      - name: partBuildingId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The building ID for the part of the container that was adjusted.
      - name: buildingId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The building ID of the container that was adjusted.
      - name: statusChange
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: Indicates if the last adjustment included a status change.
      - name: costDateTime
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:12Z'
        description: The date and time used for costing that inventory or transaction.
      - name: costModel
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The cost model of the container that was adjusted. 50 characters maximum.
      - name: planningGroup
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The planning group of the container that was adjusted. 20 characters maximum.
      - name: quantityCostImpactOnly
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: The change impacts the inventory quantity and therefore the cost/valuation.
      - name: plannerId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The planner ID of the container that was adjusted.
      - name: partGroup
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The part group of the container's part that was adjusted. 50 characters maximum.
      responses:
        '200':
          description: Query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerAdjustment'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
      x-source: https://developers.plex.com/api/documentation/inventory-operations-management-api/list-container-adjustments
  /inventory/v1/inventory-history/container-adjustments:
    get:
      operationId: listContainerAdjustmentsV1
      summary: List Container Adjustments
      tags:
      - Inventory Operations Management API
      description: List manual container inventory adjustment entries. This API returns results similar to the Inventory Adjustments application. See Knowledge Center MES API documentation for more details.
      parameters:
      - name: serialNo
        in: query
        required: false
        schema:
          type: string
          example: string
        description: 25 characters max. The serial number of the container that was adjusted.
      - name: beginDate
        in: query
        required: true
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:12Z'
        description: The date and time from when container adjustment transactions are to be retrieved.
      - name: endDate
        in: query
        required: true
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:12Z'
        description: The date and time until when container adjustment transactions are to be retrieved.
      - name: partId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The container's Part ID.
      - name: partOperationId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The container's Part Operation ID.
      - name: adjustmentCode
        in: query
        required: false
        schema:
          type: string
          example: string
        description: 50 characters max. Setup table &quot;Adjustment Reason&quot; (part.dbo.adjustment_reason). The Adjustment Reason setup table lists the acceptable reasons for inventory changes.
      - name: locationId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The location ID of the container that was adjusted.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerAdjustment'
      x-source: https://developers.plex.com/api/documentation/inventory-operations-management-api/list-container-adjustments
  /inventory/v1/inventory-history/container-location-moves:
    get:
      operationId: listContainerLocationMoves
      summary: List Container Location Moves
      tags:
      - Inventory Operations Management API
      description: List of container location moves entries.
      parameters:
      - name: serialNo
        in: query
        required: false
        schema:
          type: string
          example: string
        description: 25 characters max. The serial number of the container that was changed.
      - name: beginDate
        in: query
        required: true
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:12Z'
        description: The date and time from when container change transactions are to be retrieved.
      - name: endDate
        in: query
        required: true
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:12Z'
        description: The date and time until when container change transactions are to be retrieved.
      - name: partId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The container's Part ID.
      - name: partOperationId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The container's Part Operation ID.
      - name: partType
        in: query
        required: false
        schema:
          type: string
          example: string
        description: 50 characters max. Setup table &quot;Part Type&quot; (part.dbo.Part_Type). Subclassification for the part. Examples include flange, fastener, gears, crown wheels, clutch hubs, body panels, gear shafts.
      - name: partGroup
        in: query
        required: false
        schema:
          type: string
          example: string
        description: 50 characters max. Setup table &quot;Part Group&quot; (part.dbo.Part_Group). Subclassification for the part.
      - name: partSource
        in: query
        required: false
        schema:
          type: string
          example: string
        description: 50 characters max. Setup table &quot;Part Source&quot; (part.dbo.Part_Source). Categorize where the parts are from, purchased or made in house. The field is not tied to purchasing for lookups or searches.
      - name: locationId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The location ID of the container that was changed.
      - name: movedFromLocationId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The prior location ID of the container before it was changed.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerLocationMoves'
      x-source: https://developers.plex.com/api/documentation/inventory-operations-management-api/list-container-location-moves
  /inventory/v1/inventory-tracking/containers:
