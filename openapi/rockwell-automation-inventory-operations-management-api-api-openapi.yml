  /inventory/v1/inventory-definitions/locations/sync:
    post:
      operationId: syncLocation
      summary: Sync Location
      tags:
      - Inventory Operations Management API
      description: 'This endpoint adds or updates location details. If the provided LocationId is empty or omitted, a new location is created. Otherwise, the existing location is updated.

        Validation logic:


        Module check (7116): If storage validation data (allergens/storage conditions) is provided, the Storage Validation module must be enabled.

        Customer Setting check: If storage conditions or storage condition exclusions are provided, the "Storage Information Display" customer setting must be enabled (allergens are not subject to this check).

        Conflict checks: Cannot provide both allergens and allergen exclusions, or both storage conditions and storage condition exclusions.

        Storage Requirement check: If storage validation data is provided, the Location Type must have the Storage_Requirement flag enabled.

        Name validation: Allergen and storage condition names must exist in their respective master tables.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncLocationDTO'
      responses:
        '200':
          description: Query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncLocationDTO'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
      x-source: https://developers.plex.com/api/documentation/inventory-operations-management-api/sync-location
