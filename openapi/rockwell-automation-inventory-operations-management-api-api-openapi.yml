          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: Search by Part ID.
      - name: supplierLotNumber
        in: query
        required: false
        schema:
          type: string
          example: string
        description: Search by supplier lot number.
      - name: beginManufacturedDateTime
        in: query
        required: false
