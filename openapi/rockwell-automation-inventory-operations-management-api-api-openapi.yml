          type: string
          format: date-time
          example: '2026-10-20T12:03:12Z'
        description: Search by Manufactured Date begin date.
      - name: endManufacturedDateTime
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:12Z'
