  /shipping/v1/customer-trucks/{id}:
    get:
      operationId: getCustomerTruck
      summary: Get Customer Truck
      tags:
      - Customer Trucks API
      description: Retrieve a customer truck by ID.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The unique identifier for the truck record.
      responses:
        '200':
          description: The query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TruckDto'
        '404':
          description: The resource does not exist.
      x-source: https://developers.plex.com/api/documentation/customer-trucks-api/get-customer-truck
  /shipping/v1/customer-trucks:
    get:
      operationId: listCustomerTrucks
      summary: List Customer Trucks
      tags:
      - Customer Trucks API
      description: List customer trucks by query parameters.
      parameters:
      - name: id
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: A unique identifier for the truck. This will be automatically generated if omitted from the request.
      - name: shipDateBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:02Z'
        description: The beginning date used to return truck records with a Ship Date within a specified time frame.
      - name: shipDateEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:02Z'
        description: The end date used to return truck records with a Ship Date within a specified time frame.
      - name: shippedById
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the user who shipped the truck.
      - name: carrierId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the carrier associated with the truck. (A carrier is a supplier with a supplier type of &quot;Carrier&quot;.)
      - name: freightTerms
        in: query
        required: false
        schema:
          type: string
          example: string
        description: Terms of the freight payment; for example, COD, Collect, or Prepaid.
      - name: trackingNumber
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The tracking number, often provided by a carrier, related to a specific shipment.
      - name: trailerNumber
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The trailer number associated with the physical trailer that a specific shipment was shipped on.
      - name: truckCalled
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: Indicates if the carrier has been contacted.
      - name: truckArrivalTimeBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:02Z'
        description: The beginning time used to return truck records with an arrival time within the specified time frame (arrival time can be planned or actual, depending on implementation).
      - name: truckArrivalTimeEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:02Z'
        description: The ending time used to return truck records with an arrival time within the specified time frame (arrival time can be planned or actual, depending on implementation).
      - name: bOLNumber
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The bill of lading number.
      - name: pool
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: Indicates that the truck is part of a pool shipment. A pool is a central warehouse that redistributes shippers from one truck to another before shipping to customer locations.
      - name: poolCustomerAddressId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The customer address ID of the pool location associated with the truck.
      - name: trailerCarrierId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the supplier with a &quot;Carrier&quot; type used as the trailer carrier.
      - name: brokeredCarrierId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the supplier with a &quot;Carrier&quot; type used as the brokered carrier.
      - name: scheduledShipDateBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:02Z'
        description: The beginning date used to return truck records with a scheduled ship date within the specified time frame.
      - name: scheduledShipDateEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:02Z'
        description: The ending date used to return truck records with a scheduled ship date within the specified time frame.
      - name: createdById
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the user who created the record.
      - name: createdDateBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:02Z'
        description: The beginning date used to return truck records that were created within the specified time frame.
      - name: createdDateEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:02Z'
        description: The ending date used to return truck records that were created within the specified time frame.
      - name: modifiedById
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the user who last modified the record.
      - name: modifiedDateBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:02Z'
        description: The beginning date used to return truck records that were last modified within the specified time frame.
      - name: modifiedDateEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:02Z'
        description: The ending date used to return truck records that were last modified within the specified time frame.
      - name: milkRun
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The name of a route with multiple stops that happens on a recurring basis.
      - name: type
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The truck type.
      - name: status
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The truck status.
      - name: truckNumber
        in: query
        required: false
        schema:
          type: string
          example: string
        description: A Plex-generated unique number representing the truck shipment.
      - name: transMode
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The transportation mode associated with the truck.
      - name: shipFromId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the customer address from which the truck was shipped.
      - name: iNCOTerms
        in: query
        required: false
        schema:
          type: string
          example: string
        description: International Commercial (INCO) terms applied to the sales order.
      - name: customsBrokerSupplierId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the supplier with a &quot;Customs Broker&quot; type.
      - name: subBuilding
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The sub-building code indicating the location in the building where the truck will be loaded.
      - name: dropshipSupplierCode
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The dropship supplier code associated with the truck.
      - name: truckRoute
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The route for the truck.
      - name: truckArrivalTimeOfDayBegin
        in: query
        required: false
        schema:
          type: string
          format: time
          example: string
        description: The time at which the truck arrived.
      - name: truckArrivalTimeOfDayEnd
        in: query
        required: false
        schema:
          type: string
          format: time
          example: string
        description: The time at which the truck arrived.
      - name: truckArrivalPlexTimeOfDayBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:02Z'
        description: The time at which the truck arrived.
      - name: truckArrivalPlexTimeOfDayEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:02Z'
        description: The time at which the truck arrived.
      responses:
        '200':
          description: The query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TruckDto'
      x-source: https://developers.plex.com/api/documentation/customer-trucks-api/list-customer-trucks
