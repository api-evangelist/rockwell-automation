openapi: 3.2.0
info:
  title: Plex (Rockwell Automation) Connect Tenant Directory API
  version: '2026-10-20'
  description: Plex Smart Manufacturing Platform REST APIs, converted mechanically from the structured operation documents the Plex Developer Portal (developers.plex.com, a Rockwell Automation property) serves at /api/documentation/{api}/{operation}. No operations were authored by hand.
  x-generated-from: provider-documentation-json
  x-source: https://developers.plex.com/api/documentation/info
servers:
- url: https://connect.plex.com
  description: Production
- url: https://test.connect.plex.com
  description: Test (from https://developers.plex.com/api/sandbox/url)
security:
- PlexConnectApiKey: []
tags:
- name: Tenant Directory API
  description: The Tenant Directory API is used to retrieve tenant information for use with other Plex APIs.
paths:
  /mdm/v1/tenants/{id}:
    get:
      operationId: getTenant
      summary: Get Tenant
      tags:
      - Tenant Directory API
      description: Retrieve a Tenant by ID.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
      responses:
        '200':
          description: The query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantDto'
        '404':
          description: The Tenant does not exist.
      x-source: https://developers.plex.com/api/documentation/tenant-directory-api/get-tenant
  /mdm/v1/tenants:
    get:
      operationId: listTenants
      summary: List Tenants
      tags:
      - Tenant Directory API
      description: List Tenants by query parameters.
      parameters:
      - name: idList
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: A list of Tenant IDs.
      - name: code
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The Company Code as seen on Plex login screens.
      - name: codeList
        in: query
        required: false
        schema:
          type: string
          example: string
        description: A list of Company Codes as seen on Plex login screens.
      responses:
        '200':
          description: The query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantDto'
      x-source: https://developers.plex.com/api/documentation/tenant-directory-api/list-tenants
components:
  schemas:
    TenantDto:
      type: object
      description: Basic Tenant information
      properties:
        id:
          type: string
          format: uuid
          description: A unique identifier for the Tenant.
          example: 00000000-0000-0000-0000-000000000000
        code:
          type: string
          description: The Company Code as seen on Plex login screens.
          example: string
  securitySchemes:
    PlexConnectApiKey:
      type: apiKey
      in: header
      name: X-Plex-Connect-Api-Key
      description: 'Subscription key (Consumer Key of an app created in the Plex Developer Portal). Source: https://developers.plex.com/getstarted'
