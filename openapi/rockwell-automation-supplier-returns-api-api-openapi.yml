    get:
      operationId: getSupplierReturn
      summary: Get Supplier Return
      tags:
      - Supplier Returns API
      description: Retrieve a Supplier Return Record by ID.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
      responses:
        '200':
          description: The query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierReturnDto'
        '404':
          description: The resource does not exist.
      x-source: https://developers.plex.com/api/documentation/supplier-returns-api/get-supplier-return
  /purchasing/v1/supplier-returns/{id}/lines:
    get:
      operationId: listSupplierReturnLines
      summary: List Supplier Return Lines
      tags:
      - Supplier Returns API
      description: List Supplier Return Line records based on supplier return lines.
      parameters:
      - name: createdDateBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:18Z'
        description: The date on which the record was created.
      - name: createdDateEnd
