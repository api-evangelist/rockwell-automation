components:
  schemas:
    LineDto:
      type: object
      description: The shipper line model exposed.
      properties:
        id:
          type: string
          format: uuid
          description: A unique identifier for the shipper line. This will be automatically generated if omitted from the request.
          example: 00000000-0000-0000-0000-000000000000
        shipperId:
          type: string
          format: uuid
          description: The ID of the shipper associated with this shipper line.
          example: 00000000-0000-0000-0000-000000000000
        partId:
          type: string
          format: uuid
          description: The ID of the Part Number associated with the shipper line.
          example: 00000000-0000-0000-0000-000000000000
        quantity:
          type: number
          format: double
          description: The part quantity on the shipper line.
          example: 0.1
        releaseId:
          type: string
          format: uuid
          description: The ID of the release on the specified shipper line.
          example: 00000000-0000-0000-0000-000000000000
        price:
          type: number
          format: double
          description: The shipping order unit price assigned to the shipper line.
          example: 0.1
        customerPartId:
          type: string
          format: uuid
          description: The ID of the customer part on the shipper line.
          example: 00000000-0000-0000-0000-000000000000
        priceId:
          type: string
          format: uuid
          description: The ID of the price used on the shipper line.
          example: 00000000-0000-0000-0000-000000000000
        grossWeight:
          type: number
          format: double
          description: The gross weight of the shipper line.
          example: 0.1
        netWeight:
          type: number
          format: double
          description: The net weight of the shipper line.
          example: 0.1
        tareWeight:
          type: number
          format: double
          description: The tare weight of the shipper line.
          example: 0.1
        shipperLineNote:
          type: string
          description: The note on the shipper line.
          example: string
        packingComplete:
          type: boolean
          description: Indicates if packing is complete for the shipper line.
          example: false
        conversion:
          type: number
          format: double
          description: The unit conversion used on the shipper line.
          example: 0.1
    SupplierReturnDto:
      type: object
      description: The Supplier Return model exposed.
      properties:
        id:
          type: string
          format: uuid
          description: A unique identifier for the Supplier Return. This will be automatically generated if omitted from the request.
          example: 00000000-0000-0000-0000-000000000000
        supplierReturnNumber:
          type: string
          description: Return Number.
          example: string
        supplierId:
          type: string
          format: uuid
          description: The ID of the Supplier.
          example: 00000000-0000-0000-0000-000000000000
        status:
          type: string
          description: 'Setup Table: Supplier Return Status'
          example: string
        type:
          type: string
          description: 'Setup Table: Supplier Return Type'
          example: string
        createdById:
          type: string
          format: uuid
          description: The ID of the user who created the record.
          example: 00000000-0000-0000-0000-000000000000
        createdDate:
          type: string
          format: date-time
          description: The date on which the record was created.
          example: '2026-10-20T12:03:18Z'
        supplierAddressId:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        shipTo:
          type: string
          description: The shipping address for the return.
          example: string
        modifiedById:
          type: string
          format: uuid
          description: The ID of the user who last modified the record.
          example: 00000000-0000-0000-0000-000000000000
        modifiedDate:
          type: string
          format: date-time
          description: The date and time of the last modification to the return.
          example: '2026-10-20T12:03:18Z'
        carrierId:
          type: string
          format: uuid
          description: If the Supplier has a Supplier Type of Carrier, this ID will link to Supplier_No.
          example: 00000000-0000-0000-0000-000000000000
        note:
          type: string
          example: string
        contactId:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
  securitySchemes:
    PlexConnectApiKey:
      type: apiKey
      in: header
      name: X-Plex-Connect-Api-Key
      description: 'Subscription key (Consumer Key of an app created in the Plex Developer Portal). Source: https://developers.plex.com/getstarted'
