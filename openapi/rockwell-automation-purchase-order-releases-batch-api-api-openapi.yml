components:
  schemas:
    BatchCreateReleaseDto:
      type: object
      description: The parameters for creating a batch of Releases.
      properties:
        id:
          type: string
          format: uuid
          description: A unique identifier for the Release. This will be automatically generated if omitted from the request.
          example: 00000000-0000-0000-0000-000000000000
        poLineItemId:
          type: string
          format: uuid
          description: Purchase Order Line Item ID.
          example: 00000000-0000-0000-0000-000000000000
        status:
          type: string
          description: The status of the new release. If no value is provided for the status, it will be determined based on the firm and planned days by the values provided in this request or in the Approved Supplier record associated with the PO line item.
          example: string
        dueDate:
          type: string
          format: date-time
          description: The Due Date of the Release.
          example: '2026-10-20T12:03:17Z'
        quantity:
          type: number
          format: double
          description: Release Quantity.
          example: 0.1
        type:
          type: string
          description: Release Type.
          example: string
        note:
          type: string
          description: Release Note.
          example: string
        poShipTo:
          type: string
          description: Purchase Order Ship To.
          example: string
        firmDays:
          type: integer
          format: int32
          description: 'The maximum number of days in which to create releases with a firm status.

            Any value provided in this parameter will override any Approved Supplier record associated with the PO line item.'
          example: 0
        planDays:
          type: integer
          format: int32
          description: 'The maximum number of days in which to create releases with a planned status.

            Any value provided in this parameter will override any Approved Supplier record associated with the PO line item.'
          example: 0
        forecastDays:
          type: integer
          format: int32
          description: 'The maximum number of days in which to create releases with a forecast status.

            Provide a value in this parameter to limit the created releases (the Approved Supplier record is not used to limit the number of Forecast Days for releases).'
          example: 0
        releaseLineNo:
          type: integer
          format: int32
          description: The purchase order line item number that the release is associated with. When this is included in the request, the value is taken from the external system rather than assigned according to Plex logic when releases are created. This value helps clarify the due date order in the Plex user interface when releases are created out of order due to parallel asynchronous batch processing.
          example: 0
      required:
      - poLineItemId
      - dueDate
      - quantity
    BatchUpdateReleaseDto:
      type: object
      description: The parameters for updating a batch of Releases.
      properties:
        status:
          type: string
          description: The status of the release. If no value is provided for the status, it will be determined based on the firm and planned days by the values provided in this request or in the Approved Supplier record associated with the PO line item.
          example: string
        dueDate:
          type: string
          format: date-time
          description: The Due Date of the Release.
          example: '2026-10-20T12:03:17Z'
        quantity:
          type: number
          format: double
          description: Release Quantity.
          example: 0.1
        type:
          type: string
          description: Release Type.
          example: string
        note:
          type: string
          description: Release Note.
          example: string
        poShipTo:
          type: string
          description: Purchase Order Ship To.
          example: string
        firmDays:
          type: integer
          format: int32
          description: 'The maximum number of days in which to create releases with a firm status.

            Any value provided in this parameter will override any Approved Supplier record associated with the PO line item.'
          example: 0
        planDays:
          type: integer
          format: int32
          description: 'The maximum number of days in which to create releases with a planned status.

            Any value provided in this parameter will override any Approved Supplier record associated with the PO line item.'
          example: 0
        forecastDays:
          type: integer
          format: int32
          description: 'The maximum number of days in which to create releases with a forecast status.

            Provide a value in this parameter to limit the created releases (the Approved Supplier record is not used to limit the number of Forecast Days for releases).'
          example: 0
        id:
          type: string
          format: uuid
          description: The release id.
          example: 00000000-0000-0000-0000-000000000000
      required:
      - dueDate
      - quantity
      - id
    BatchReleaseCancelDto:
      type: object
      description: Extension of the ReleaseCancelDto class to hold any additional fields for Batch endpoints.
      properties:
        status:
          type: string
          description: The Release_Status
          example: string
        id:
          type: string
          format: uuid
          description: The release id.
          example: 00000000-0000-0000-0000-000000000000
      required:
      - status
      - id
    BatchProgressDto:
      type: object
      description: Progress details for a batch request.
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the batch request.
          example: 00000000-0000-0000-0000-000000000000
        releasesCount:
          type: integer
          format: int32
          description: The number of releases in the batch request.
          example: 0
        releasesProcessed:
          type: integer
          format: int32
          description: The number of releases in the batch request that have been processed.
          example: 0
        failures:
          type: array
          description: Any errors encountered while processing the releases from a batch request.
          items: {}
    BatchReleaseDeleteDto:
      type: object
      description: The query parameters for deleting Release resources.
      properties:
        deleteReleaseAcknowledgementRecords:
          type: boolean
          description: A flag indicating whether or not to delete the release acknowledgements which are associated with the releases.
          example: false
        releaseId:
          type: array
          description: A list of unique identifiers for releases to delete.
          items:
            type: string
            format: uuid
        status:
          type: array
          description: One or more release status names.
          items:
            type: string
        partId:
          type: array
          description: One or more unique identifiers for parts which are associated with releases.
          items:
            type: string
            format: uuid
        supplierId:
          type: array
          description: One or more unique identifiers for suppliers which are associated with releases.
          items:
            type: string
            format: uuid
  securitySchemes:
    PlexConnectApiKey:
      type: apiKey
      in: header
      name: X-Plex-Connect-Api-Key
      description: 'Subscription key (Consumer Key of an app created in the Plex Developer Portal). Source: https://developers.plex.com/getstarted'
