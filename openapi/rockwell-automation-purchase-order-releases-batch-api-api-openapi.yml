      description: En-queues a batch of releases to be created offline.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCreateReleaseDto'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchProgressDto'
        '400':
          description: Bad Request
      x-source: https://developers.plex.com/api/documentation/purchase-order-releases-batch-api/create-release-batch
  /purchasing/v2-beta1/release-batch/delete:
    post:
      operationId: deleteReleaseBatchV2-BETA1
      summary: Delete Release Batch
      tags:
      - Purchase Order Releases Batch API
      description: En-queues a batch of releases to be deleted offline. This endpoint can delete releases by release ID, or by a combination of release status, part ID, and supplier ID. To safeguard against deleting all releases in a tenant, this endpoint requires at least one request parameter when not identifying specific releases.
      x-beta: true
      x-beta-end-date: null
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchReleaseDeleteDto'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
