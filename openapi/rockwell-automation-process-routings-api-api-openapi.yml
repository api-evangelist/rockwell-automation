    get:
      operationId: listPartOperations
      summary: List Part Operations
      tags:
      - Process Routings API
      description: List part operations by query parameters.
      parameters:
      - name: partId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: A unique identifier to a part.
      - name: operationId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: A unique identifier to an operation.
      - name: active
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: If the routing is activated for use in production.
      - name: subOperation
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: Refers to if the operation is encapsulated within another operation.
      - name: operationNumber
        in: query
        required: false
        schema:
          type: integer
          format: int32
          example: 0
        description: The order this operation is executed in, usually added in increments of 10 to leave room for inserting additional operations.
      - name: createdDateTimeBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:14Z'
        description: The beginning date and time used to return records created within a time frame.
      - name: createdDateTimeEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:14Z'
        description: The end date and time used to return records created within a time frame.
      - name: modifiedDateTimeBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:14Z'
        description: The beginning date and time used to return records modified within a time frame. Records that have never been modified are evaluated against the date and time they were created.
      - name: modifiedDateTimeEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:14Z'
        description: The end date and time used to return records modified within a time frame. Records that have never been modified are evaluated against the date and time they were created.
