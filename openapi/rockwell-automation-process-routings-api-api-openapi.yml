components:
  schemas:
    StorageDTO:
      type: object
      description: The container storage detail for a Part Operation.
      properties:
        id:
          type: string
          format: uuid
          description: A unique identifier to a Part Operation.
          example: 00000000-0000-0000-0000-000000000000
        labelFormat:
          type: string
          description: The format that is printed for the container's label.
          example: string
        masterLabel:
          type: string
          description: The master label to be printed for this Part Operation.
          example: string
        standardQuantity:
          type: number
          format: double
          description: Standard pack size for the Part Operation.
          example: 0.1
    UpdateProductionDTO:
      type: object
      description: Model for Part Operation production updates
      properties:
        multiple:
          type: integer
          format: int32
          description: Multiple for Part Operation production.
          example: 0
        numberOfStrokes:
          type: number
          format: double
          description: Number of Strokes for Part Operation production.
          example: 0.1
        repetitions:
          type: integer
          format: int32
          description: Repetitions for Part Operation production.
          example: 0
      required:
      - multiple
      - numberOfStrokes
      - repetitions
    UpdatePartOperationDTO:
      type: object
      description: Properties to be set when updating a Part Operation
      properties:
        operationId:
          type: string
          format: uuid
          description: A unique identifier to an operation.
          example: 00000000-0000-0000-0000-000000000000
        operationNumber:
          type: integer
          format: int32
          description: The order this operation is executed in, usually added in increments of 10 to leave room for inserting additional operations.
          example: 0
        multiple:
          type: integer
          format: int32
          description: The operation multiple.
          example: 0
        subOperation:
          type: boolean
          description: Refers to if the operation is encapsulated within another operation.
          example: false
        shippable:
          type: boolean
          description: If shipping is allowed for operation on this Part Operation. The part should have at least one shippable operation. If not, MRP calculations are impacted.
          example: false
        netWeight:
          type: number
          format: double
          description: The part weight per inventory unit at this operation. This is used in calculations for valuing inventory, standard costing, and shipping documents for subcontract WIP operations.
          example: 0.1
        type:
          type: string
          description: The part operation type.
          example: string
      required:
      - operationId
      - operationNumber
      - multiple
      - type
    SchedulingDTO:
      type: object
      description: The model for Part Operation Scheduling.
      properties:
        id:
          type: string
          format: uuid
          description: A unique identifier for the Part Operation.
          example: 00000000-0000-0000-0000-000000000000
        scrapPercentage:
          type: number
          format: double
          description: The scrap percentage for the Part Operation.
          example: 0.1
        operatorScrapPercentage:
          type: number
          format: double
          description: The Operator Scrap percentage for the Part Operation.
          example: 0.1
        fixedRunTimeHours:
          type: number
          format: double
          description: Fixed Runtime Houses for the Part Operation.
          example: 0.1
        delayBeforeHours:
          type: number
          format: double
          description: Delay before hours for the Part Operation.
          example: 0.1
        delayAfterHours:
          type: number
          format: double
          description: Delay after house for the Part Operation.
          example: 0.1
        delayReason:
          type: string
          description: Delay reason for the Part Operation.
          example: string
        overlapPercentage:
          type: number
          format: double
          description: Overlap percentage for the Part Operation.
          example: 0.1
        overlapQuantity:
          type: integer
          format: int32
          description: Overlap Quantity for the Part Operation.
          example: 0
    DescriptionDTO:
      type: object
      description: Model for Part Operation description
      properties:
        description:
          type: string
          description: The description of the part operation.
          example: string
      required:
      - description
    UpdateSchedulingDTO:
      type: object
      description: Modle for Part Operation scheduling updates.
      properties:
        scrapPercentage:
          type: number
          format: double
          description: Scrap percentage of the Part Operation.
          example: 0.1
        operatorScrapPercentage:
          type: number
          format: double
          description: Operator Scrap Percentage of the Part Operation.
          example: 0.1
        fixedRunTimeHours:
          type: number
          format: double
          description: Fixed run time hours of the Part Operation.
          example: 0.1
        delayBeforeHours:
          type: number
          format: double
          description: Delay before hours of the Part Operation.
          example: 0.1
        delayAfterHours:
          type: number
          format: double
          description: Delay after hours of the Part Operation.
          example: 0.1
        delayReason:
          type: string
          description: Delay reason of the Part Operation.
          example: string
        overlapPercentage:
          type: number
          format: double
          description: Overlap percentage of the Part Operation.
          example: 0.1
        overlapQuantity:
          type: integer
          format: int32
          description: Overlap quantity of the Part Operation.
          example: 0
      required:
      - delayReason
    ValidationResponse:
      type: object
      properties:
        code:
          type: string
          example: string
        message:
          type: string
          example: string
        errors:
          type: array
          items:
            type: object
            properties: {}
    NoteDTO:
      type: object
      description: Model for Part Operation notes
      properties:
        note:
          type: string
          description: Note for Part Operation.
          example: string
        otherNote:
          type: string
          description: Other note for Part Operation.
          example: string
      required:
      - note
      - otherNote
    UpdateStorageDTO:
      type: object
      description: The container storage detail for a Part Operation.
      properties:
        standardQuantity:
          type: number
          format: double
          description: Standard pack size for the Part Operation.
          example: 0.1
      required:
      - standardQuantity
    CreatePartOperationDTO:
      type: object
      description: A single operation in a part operation routing.
      properties:
        partId:
          type: string
          format: uuid
          description: A unique identifier to a part.
          example: 00000000-0000-0000-0000-000000000000
        operationId:
          type: string
          format: uuid
          description: A unique identifier to an operation.
          example: 00000000-0000-0000-0000-000000000000
        type:
          type: string
          description: The Part Operation type.
          example: string
        operationNumber:
          type: integer
          format: int32
          description: The order this operation is executed in, usually added in increments of 10 to leave room for inserting additional operations.
          example: 0
        subOperation:
          type: boolean
          description: Refers to if the operation is encapsulated within another operation.
          example: false
        shippable:
          type: boolean
          description: If shipping is allowed for operation on this routing. The part should have at least one shippable operation. If not, MRP calculations are impacted.
          example: false
        netWeight:
          type: number
          format: double
          description: The part weight per inventory unit at this operation. This is used in calculations for valuing inventory, standard costing, and shipping documents for subcontract WIP operations.
          example: 0.1
        standardQuantity:
          type: number
          format: double
          description: Standard pack size for the process routing.
          example: 0.1
      required:
      - partId
      - operationId
      - type
      - operationNumber
    OperationDTO:
      type: object
      description: The all-inclusive domain model for a Operation.
      properties:
        id:
          type: string
          format: uuid
          description: A unique identifier for the Operation.
          example: 00000000-0000-0000-0000-000000000000
        code:
          type: string
          example: string
        type:
          type: string
          example: string
        inventoryType:
          type: string
          example: string
    PartOperationDTO:
      type: object
      description: A single operation in a part operation routing.
      properties:
        id:
          type: string
          format: uuid
          description: A unique identifier to a Part Operation.
          example: 00000000-0000-0000-0000-000000000000
        partId:
          type: string
          format: uuid
          description: A unique identifier to a part.
          example: 00000000-0000-0000-0000-000000000000
        operationId:
          type: string
          format: uuid
          description: A unique identifier to an operation.
          example: 00000000-0000-0000-0000-000000000000
        type:
          type: string
          description: The routing type.
          example: string
        operationNumber:
          type: integer
          format: int32
          description: The order this operation is executed in, usually added in increments of 10 to leave room for inserting additional operations.
          example: 0
        active:
          type: boolean
          description: If the Part Operation is activated for use in production.
          example: false
        subOperation:
          type: boolean
          description: Refers to if the operation is encapsulated within another operation.
          example: false
        shippable:
          type: boolean
          description: If shipping is allowed for operation on this Part Operation. The part should have at least one shippable operation. If not, MRP calculations are impacted.
          example: false
        multiple:
          type: integer
          format: int32
          description: The number of output parts each input part produces. Used primarily for non-BOM operations where one part results in multiples of the next operation.
          example: 0
        netWeight:
          type: number
          format: double
          description: The part weight per inventory unit at this operation. This is used in calculations for valuing inventory, standard costing, and shipping documents for subcontract WIP operations.
          example: 0.1
    PartOperationListItemDTO:
      type: object
      description: A single operation in a part operation routing, as returned by the List Part Operations endpoint.
      properties:
        id:
          type: string
          format: uuid
          description: A unique identifier to a Part Operation.
          example: 00000000-0000-0000-0000-000000000000
        partId:
          type: string
          format: uuid
          description: A unique identifier to a part.
          example: 00000000-0000-0000-0000-000000000000
        operationId:
          type: string
          format: uuid
          description: A unique identifier to an operation.
          example: 00000000-0000-0000-0000-000000000000
        type:
          type: string
          description: The routing type.
          example: string
        operationNumber:
          type: integer
          format: int32
          description: The order this operation is executed in, usually added in increments of 10 to leave room for inserting additional operations.
          example: 0
        active:
          type: boolean
          description: If the Part Operation is activated for use in production.
          example: false
        subOperation:
          type: boolean
          description: Refers to if the operation is encapsulated within another operation.
          example: false
        shippable:
          type: boolean
          description: If shipping is allowed for operation on this Part Operation. The part should have at least one shippable operation. If not, MRP calculations are impacted.
          example: false
        multiple:
          type: integer
          format: int32
          description: The number of output parts each input part produces. Used primarily for non-BOM operations where one part results in multiples of the next operation.
          example: 0
        netWeight:
          type: number
          format: double
          description: The part weight per inventory unit at this operation. This is used in calculations for valuing inventory, standard costing, and shipping documents for subcontract WIP operations.
          example: 0.1
        createdDateTime:
          type: string
          format: date-time
          description: The date and time on which the record was created.
          example: '2026-10-20T12:03:14Z'
        modifiedDateTime:
          type: string
          format: date-time
          description: The date and time on which the record was last modified. Defaults to the created timestamp when the record has never been modified.
          example: '2026-10-20T12:03:14Z'
        modifiedById:
          type: string
          format: uuid
          description: The IAM account ID of the user who last modified this record. Defaults to the created user when the record has never been modified.
          example: 00000000-0000-0000-0000-000000000000
    UpdateDescriptionDTO:
      type: object
      description: Model for Part Operation description
      properties:
        description:
          type: string
          description: The description of the Part Operation.
          example: string
      required:
      - description
    ProductionDTO:
      type: object
      description: Model for Part Operation production
      properties:
        id:
          type: string
          format: uuid
          description: A unique ID for Part Operation production.
          example: 00000000-0000-0000-0000-000000000000
        multiple:
          type: integer
          format: int32
          description: Multiple for Part Operation production.
          example: 0
        numberOfStrokes:
          type: number
          format: double
          description: Number of Strokes for Part Operation production.
          example: 0.1
        repetitions:
          type: integer
          format: int32
          description: Repetitions for Part Operation production.
          example: 0
