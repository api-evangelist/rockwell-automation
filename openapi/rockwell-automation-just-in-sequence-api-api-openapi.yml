components:
  schemas:
    CreateReleaseDto:
      type: object
      description: The Sequenced Release model exposed for adding.
      properties:
        id:
          type: string
          format: uuid
          description: A unique identifier for the sequenced release.
          example: 00000000-0000-0000-0000-000000000000
        salesReleaseId:
          type: string
          format: uuid
          description: A unique identifier for the sales release.
          example: 00000000-0000-0000-0000-000000000000
        kitId:
          type: string
          format: uuid
          description: A unique identifier for the kit.
          example: 00000000-0000-0000-0000-000000000000
      required:
      - salesReleaseId
      - kitId
    ContainerDto:
      type: object
      description: The Container model.
      properties:
        serialNumber:
          type: string
          description: The serial number of the container. 25 characters max.
          example: string
        status:
          type: string
          description: The container's status.
          example: string
        partId:
          type: string
          format: uuid
          description: The ID of the part that was produced.
          example: 00000000-0000-0000-0000-000000000000
        partNumber:
          type: string
          description: The part number associated to the &quot;partId&quot; that was produced. Acceptable part number characters include uppercase and lowercase letters (A-Z), numbers (0-9), and special characters such as dashes (-), underscores ( _ ), and spaces. Part numbers cannot use question marks (?) or ampersands. Other characters may cause issues.
          example: string
        partRevision:
          type: string
          description: The part revision of the &quot;partId&quot;. A revision represents a change or modification to a part or part drawing that is usually initiated through an engineering change request (ECR).
          example: string
        partNumberRevision:
          type: string
          description: 'The part number and revision formatted with separator. If a part number has a revision, Plex will return the part number and the revision separated by the Part Rev Separator setting. A Part Rev Separator can be up to 5 characters long. Format: {partNumber}{part rev separator}{revision}.'
          example: string
        partOperationId:
          type: string
          format: uuid
          description: The ID of the part operation.
          example: 00000000-0000-0000-0000-000000000000
        operationNumber:
          type: integer
          format: int32
          description: The operation number of the part operation.
          example: 0
        operationCode:
          type: string
          description: The operation code associated to the &quot;partOperationId&quot;. 30 characters max.
          example: string
        location:
          type: string
          description: The container's location.
          example: string
        jobNumber:
          type: string
          description: The unique job number. 20 characters max.
          example: string
        jobId:
          type: string
          format: uuid
          description: The ID of the production job that production was recorded against. Note that a production job is not necessary to record production. Another scheduling method such as Kanban may have been used.
          example: 00000000-0000-0000-0000-000000000000
        type:
          type: string
          description: The container type of the container's.
          example: string
        quantity:
          type: number
          format: double
          description: The container's part quantity.
          example: 0.1
        active:
          type: boolean
          description: The container's active status (active or inactive).
          example: false
        createdDate:
          type: string
          format: date-time
          description: The date on which the container record was added.
          example: '2026-10-20T12:03:12Z'
        modifiedDate:
          type: string
          format: date-time
          description: The date on which the container record was updated.
          example: '2026-10-20T12:03:12Z'
        quantityUnit:
          type: string
          description: The unit used for the container quantity, as defined on the operation.
          example: string
        grossWeight:
          type: number
          format: double
          description: The container's gross weight.
          example: 0.1
        netWeight:
          type: number
          format: double
          description: The container's net weight.
          example: 0.1
        tareWeight:
          type: number
          format: double
          description: The container's tare weight.
          example: 0.1
        trackingNumber:
          type: string
          description: The tracking number of the container. 50 characters max.
          example: string
        heatNumber:
          type: string
          description: The heat number of the heat. 30 characters max.
          example: string
        lotNumber:
          type: string
          description: The unique lot number. 25 characters max.
          example: string
        masterUnitNo:
          type: string
          description: The master unit number of the master unit. 10 characters max.
          example: string
        masterUnitId:
          type: string
          format: uuid
          description: The master unit resource ID.
          example: 00000000-0000-0000-0000-000000000000
        lotId:
