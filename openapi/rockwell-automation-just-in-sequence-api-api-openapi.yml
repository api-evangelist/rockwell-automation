openapi: 3.2.0
info:
  title: Plex (Rockwell Automation) Connect Just In Sequence API
  version: '2026-10-20'
  description: Plex Smart Manufacturing Platform REST APIs, converted mechanically from the structured operation documents the Plex Developer Portal (developers.plex.com, a Rockwell Automation property) serves at /api/documentation/{api}/{operation}. No operations were authored by hand.
  x-generated-from: provider-documentation-json
  x-source: https://developers.plex.com/api/documentation/info
servers:
- url: https://connect.plex.com
  description: Production
- url: https://test.connect.plex.com
  description: Test (from https://developers.plex.com/api/sandbox/url)
security:
- PlexConnectApiKey: []
tags:
- name: Just In Sequence API
  description: The Just In Sequence API is used to manage sequenced shipping data.
paths:
  /shipping/v1/jis/releases/{id}/confirm:
    post:
      operationId: auditJisRelease
      summary: Audit JIS Release
      tags:
      - Just In Sequence API
      description: Audit and confirm an individual sequenced release.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the sequenced release.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditReleaseDto'
      responses:
        '200':
          description: The request executed successfully.
        '400':
          description: Validation error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '404':
          description: The resource does not exist.
      x-source: https://developers.plex.com/api/documentation/just-in-sequence-api/audit-jis-release
  /shipping/v1/jis/kits:
    post:
      operationId: createJisKit
      summary: Create JIS Kit
      tags:
      - Just In Sequence API
      description: Create a sequenced kit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKitDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KitDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '404':
          description: Not Found
      x-source: https://developers.plex.com/api/documentation/just-in-sequence-api/create-jis-kit
    get:
      operationId: listJisKits
      summary: List JIS Kits
      tags:
      - Just In Sequence API
      description: List sequenced kits by query parameters.
      parameters:
      - name: id
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the sequenced kit.
      - name: jisKitStatus
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The sequenced kit's status.
      - name: kitName
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The sequenced kit's name.
      - name: isReprintNeeded
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: Determines whether the kit requires its paperwork to be reprinted.
      - name: addDateTimeBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:13Z'
        description: The beginning date and time on which the kit was created.
      - name: addDateTimeEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:13Z'
        description: The ending date and time on which the kit was created.
      - name: rackSequenceNumber
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The kit's rack number.
      - name: labelPrintedDateTimeBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:13Z'
        description: The beginning date and time on which the kit label was last printed.
      - name: labelPrintedDateTimeEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:13Z'
        description: The ending date and time on which the kit label was last printed.
      responses:
        '200':
          description: The query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KitDto'
      x-source: https://developers.plex.com/api/documentation/just-in-sequence-api/list-jis-kits
  /shipping/v1/jis/racks:
    post:
      operationId: createJisRack
      summary: Create JIS Rack
      tags:
      - Just In Sequence API
      description: Create a sequenced rack.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRackDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RackDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
      x-source: https://developers.plex.com/api/documentation/just-in-sequence-api/create-jis-rack
    get:
      operationId: listJisRacks
      summary: List JIS Racks
      tags:
      - Just In Sequence API
      description: List sequenced rack records based on specified properties.
      parameters:
      - name: id
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: A unique identifier for the sales order. This will be automatically generated if omitted from the request.
      - name: rackStatus
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The status of the rack.
      - name: rackSequenceNumber
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The rack sequence number.
      - name: masterUnitNumber
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The master unit number associated with the rack.
      - name: lineSequenceSetupName
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The rack's line sequence setup name.
      - name: createdDateTimeStart
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:13Z'
        description: The start date and time on which the rack was added.
      - name: createdDateTimeEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:13Z'
        description: The end date and time on which the rack was added.
      - name: reprintNeeded
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: Determines whether the rack requires its paperwork to be reprinted.
      - name: printedDateTimeStart
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:13Z'
        description: The start date and time on which the rack paperwork was last printed.
      - name: printedDateTimeEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:13Z'
        description: The end date and time on which the rack paperwork was last printed.
      - name: truckID
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The unique ID of the truck associated with the rack.
      - name: truckNumber
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The truck number associated with the rack.
      - name: trailerNumber
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The trailer number of the rack's associated truck.
      - name: labelPrintedDateTimeStart
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:13Z'
        description: The start date and time on which the rack label was last printed.
      - name: labelPrintedDateTimeEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:13Z'
        description: The end date and time on which the rack label was last printed.
      responses:
        '200':
          description: The query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RackDto'
      x-source: https://developers.plex.com/api/documentation/just-in-sequence-api/list-jis-racks
