      tags:
      - Accounts Receivable Invoices API
      description: Retrieve an AR invoice by ID.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The Accounts Receivable invoice ID.
      responses:
