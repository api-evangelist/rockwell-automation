          description: Query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountsReceivableInvoiceDto'
        '404':
          description: Resource not found.
      x-source: https://developers.plex.com/api/documentation/accounts-receivable-invoices-api/get-ar-invoice
