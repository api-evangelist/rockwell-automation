  description: The Accounts Receivable Invoices API is used to retrieve Accounts Receivable invoices, Accounts Receivable invoice lines, and Accounts Receivable invoice tax data.
paths:
  /accounting/v1/ar-invoices:
    post:
      operationId: createArInvoice
      summary: Create AR Invoice
      tags:
      - Accounts Receivable Invoices API
      description: Add an AR invoice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAccountsReceivableInvoiceDto'
      responses:
        '201':
          description: The record was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountsReceivableInvoiceDto'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
      x-source: https://developers.plex.com/api/documentation/accounts-receivable-invoices-api/create-ar-invoice
    get:
      operationId: listArInvoices
      summary: List AR Invoices
      tags:
      - Accounts Receivable Invoices API
      description: 'Disclaimer: The APIs are designed to maintain optimal performance with a limit of 1,000 invoices per call (depending on the number of distribution lines per invoice). To avoid timeout errors, you can apply relevant filters to retrieve a more specific response.'
      parameters:
      - name: id
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The ID of the AR invoice.
      - name: invoiceNumber
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The AR invoice number.
      - name: periodDisplayBegin
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The beginning date used to return AR invoice records during a period.
      - name: periodDisplayEnd
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The end date used to return AR invoice records during a period.
      - name: transactionDateBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:01Z'
        description: The beginning date used to return AR transaction records during a period.
      - name: transactionDateEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:01Z'
        description: The end date used to return AR transaction records during a period.
      - name: createdDateBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:01Z'
        description: The beginning date used to return AR invoices created within a time frame.
      - name: createdDateEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:01Z'
        description: The end date used to return AR invoices created within a time frame.
      - name: booked
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: Specify that an AR invoice has a booked status.
      - name: modifiedDateBegin
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:01Z'
        description: The beginning date used to return AR invoices modified within a time frame.
      - name: modifiedDateEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-10-20T12:03:01Z'
        description: The end date used to return AR invoices modified within a time frame.
      - name: customerCode
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The AR invoice customer code.
      - name: customerPONo
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The AR invoice customer purchase order number.
      - name: status
        in: query
        required: false
        schema:
          type: string
          example: string
        description: The AR invoice status.
      - name: paid
        in: query
        required: false
        schema:
          type: integer
          format: int32
          example: 0
        description: 'Specify whether or not the AR invoices in your query results have been paid by entering one of the following: 0 - Unpaid invoices only, 1 - Fully paid invoices only, 2 - Partially paid invoices only, 3 - All invoices.'
      - name: void
        in: query
        required: false
        schema:
          type: boolean
          example: false
        description: Specify that the AR invoice is void.
      responses:
        '200':
          description: Query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountsReceivableInvoiceDto'
      x-source: https://developers.plex.com/api/documentation/accounts-receivable-invoices-api/list-ar-invoices
