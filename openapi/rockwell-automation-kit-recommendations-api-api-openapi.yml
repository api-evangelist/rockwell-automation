  /engineering/v1/kit-recommendations/{id}:
    get:
      operationId: getKitRecommendation
      summary: Get Kit Recommendation
      tags:
      - Kit Recommendations API
      description: Retrieve a kit recommendation by ID.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The Kit Recommendation ID.
      responses:
        '200':
          description: Query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KitRecommendationDto'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
