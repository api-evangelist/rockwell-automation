  /engineering/v1/kit-recommendations:
    post:
      operationId: createKitRecommendation
      summary: Create Kit Recommendation
      tags:
      - Kit Recommendations API
      description: Create a new kit recommendation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddKitRecommendationRequest'
      responses:
        '201':
