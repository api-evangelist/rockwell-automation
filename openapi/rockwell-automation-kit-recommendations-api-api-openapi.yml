    get:
      operationId: listKitRecommendations
      summary: List Kit Recommendations
      tags:
      - Kit Recommendations API
      description: List kit recommendations by request parameters.
      parameters:
      - name: id
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: Search by Kit Recommendation ID.
      - name: partId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: Search by Part ID.
      - name: bomId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
