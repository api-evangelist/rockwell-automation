      x-source: https://developers.plex.com/api/documentation/kit-recommendations-api/get-kit-recommendation
components:
  schemas:
    KitRecommendationDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The Kit Recommendation ID.
          example: 00000000-0000-0000-0000-000000000000
        partId:
          type: string
          format: uuid
          description: The Part ID.
          example: 00000000-0000-0000-0000-000000000000
        partNo:
          type: string
          description: The Part Number.
          example: string
        partRevision:
          type: string
          description: The Part Revision.
          example: string
    AddKitRecommendationRequest:
      type: object
      properties:
        partId:
          type: string
          format: uuid
          description: The Part ID for the initial kit recommendation.
          example: 00000000-0000-0000-0000-000000000000
      required:
      - partId
    ValidationResponse:
      type: object
      properties:
        code:
          type: string
          example: string
        message:
          type: string
          example: string
        errors:
          type: array
          items:
            type: object
            properties: {}
    KitRecommendationBomsRequest:
      type: object
      properties:
        bomIds:
          type: array
          items:
            type: string
            format: uuid
      required:
      - bomIds
    Error:
      type: object
      properties:
        code:
          type: string
          example: string
        message:
          type: string
          example: string
    KitRecommendationBom:
      type: object
      properties:
        bomId:
          type: string
          format: uuid
          description: The Bill of Material ID.
          example: 00000000-0000-0000-0000-000000000000
        partId:
          type: string
          format: uuid
          description: The Part ID.
          example: 00000000-0000-0000-0000-000000000000
        partOperationId:
          type: string
          format: uuid
          description: The Part Operation ID.
          example: 00000000-0000-0000-0000-000000000000
  securitySchemes:
    PlexConnectApiKey:
      type: apiKey
      in: header
      name: X-Plex-Connect-Api-Key
      description: 'Subscription key (Consumer Key of an app created in the Plex Developer Portal). Source: https://developers.plex.com/getstarted'
