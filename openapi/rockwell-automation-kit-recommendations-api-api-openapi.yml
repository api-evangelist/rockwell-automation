    post:
      operationId: createKitRecommendationBomAssociation
      summary: Create Kit Recommendation Bom Association
      tags:
      - Kit Recommendations API
      description: Add BOM ID associations to the kit recommendation.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The Kit Recommendation ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KitRecommendationBomsRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KitRecommendationBom'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-source: https://developers.plex.com/api/documentation/kit-recommendations-api/create-kit-recommendation-bom-association
    delete:
      operationId: deleteKitRecommendationBomAssociation
      summary: Delete Kit Recommendation Bom Association
      tags:
      - Kit Recommendations API
      description: Removes BOM ID associations from the kit recommendation.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        description: The Kit Recommendation ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KitRecommendationBomsRequest'
      responses:
        '204':
          description: Request succeeded without response content.
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-source: https://developers.plex.com/api/documentation/kit-recommendations-api/delete-kit-recommendation-bom-association
    get:
      operationId: getKitRecommendationBomAssociation
      summary: Get Kit Recommendation Bom Association
      tags:
      - Kit Recommendations API
      description: Retrieves a list of BOM IDs associated with the kit recommendation.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
