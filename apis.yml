apis:
- aid: rockwell-automation:factorytalk-datamosaix-api
  name: Rockwell Automation FactoryTalk DataMosaix API
  description: >-
    FactoryTalk DataMosaix is an Industrial DataOps solution that provides REST API access for industrial
    data management, contextualization, and analytics. Supports machine-to-machine (M2M) communication,
    data ingestion, visualization, and integration with enterprise analytics tools via OpenAPI-specified
    endpoints accessible through Swagger UI.
  tags:
  - Industrial Data
  - DataOps
  - Manufacturing
  - REST
  - Industrial Automation
  humanURL: https://www.rockwellautomation.com/en-us/products/software/factorytalk/datamosaix.html
  baseURL: https://datamosaix-portal.cloud.rockwellautomation.com
  properties:
  - url: >-
      https://www.rockwellautomation.com/en-us/docs/factorytalk-datamosaix/current/online-help-ditamap/api-reference.html
    type: Documentation
  - url: https://www.rockwellautomation.com/en-us/products/software/factorytalk/datamosaix.html
    type: Website
- aid: rockwell-automation:factorytalk-remote-access-api
  name: Rockwell Automation FactoryTalk Remote Access Web API
  description: >-
    FactoryTalk Remote Access (FTRA) Web API provides RESTful HTTP interface for remote access management,
    enabling developers to integrate industrial device remote access capabilities into third-party applications
    and proprietary systems. Supports GET, POST, PUT, PATCH, and DELETE operations for device and session
    management.
  tags:
  - Remote Access
  - Industrial Automation
  - REST
  - Manufacturing
  humanURL: >-
    https://www.rockwellautomation.com/en-us/products/software/factorytalk/remote-access.html
  baseURL: https://api.rockwellautomation.com
  properties: []
